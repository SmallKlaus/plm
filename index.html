  <text x="818" y="324" text-anchor="middle" font-family="${F_BODY}" font-weight="700" font-size="16" fill="#3A1A26">scan me (go on)</text>
  <text x="818" y="343" text-anchor="middle" font-family="${F_BODY}" font-weight="700" font-size="12.5" fill="#3A1A26" opacity=".8">password protected</text>
  <text x="818" y="372" text-anchor="middle" font-family="${F_DOT}" font-size="14.5" fill="#3A1A26">No. ${esc(s.serial)}</text>
  <text x="818" y="414" text-anchor="middle" font-family="${F_CN}" font-size="21" fill="#3A1A26">小马恋爱机</text>
  <text x="818" y="434" text-anchor="middle" font-family="${F_DOT}" font-size="11" letter-spacing="1.4" fill="#3A1A26">PONY LOVE MACHINE</text>
  <text transform="translate(941 232) rotate(90)" text-anchor="middle" font-family="${F_DISPLAY}" font-weight="700" font-size="18" letter-spacing="5" fill="#3A1A26">ADMIT ONE</text>

  <g class="tk-peek" style="opacity:0">${peek}</g>

  <g class="tk-stamp" style="opacity:0">
    <g filter="url(#${u('ink')})" transform="rotate(-12 626 100)" opacity=".9">
      <circle cx="626" cy="100" r="56" fill="none" stroke="#E0335F" stroke-width="5"/>
      <circle cx="626" cy="100" r="39" fill="none" stroke="#E0335F" stroke-width="2.5"/>
      <text font-family="${F_DISPLAY}" font-weight="700" font-size="11.5" letter-spacing="1.1" fill="#E0335F"><textPath href="#${u('circ')}">APPROVED BY 汤圆 · 已批准 · APPROVED BY 汤圆 · 已批准 ·</textPath></text>
      <path d="M626 118s-15-9-15-19.4a8.4 8.4 0 0 1 15-5 8.4 8.4 0 0 1 15 5c0 10.4-15 19.4-15 19.4z" fill="#E0335F"/>
    </g>
  </g>
</svg>`;
  }

  /* ---------------- print + reveal ---------------- */
  const FINAL = { x: 240, y: 34 };
  let guardOn = false;
  window.addEventListener('beforeunload', (e) => {
    if (!guardOn) return;
    e.preventDefault();
    e.returnValue = '';
  });

  async function print(s) {
    const layer = U.$('#voucherLayer');
    const M = PLM.machine;
    layer.classList.add('is-on');
    layer.innerHTML = '';
    const markup = build(s);
    const fly = U.el('div', { class: 'ticket-fly' });
    fly.innerHTML = markup;
    const svg = fly.querySelector('svg');
    const stamp = svg.querySelector('.tk-stamp');
    const peek = svg.querySelector('.tk-peek');
    const sk = U.skipper();
    const reduced = U.reduced();
    PLM.host.say('Printing… don’t read the fine print.', { expr: 'smug', ms: 2600 });

    const finalTransform = `translate(${FINAL.x}px, ${FINAL.y}px) rotate(0deg) scale(1)`;
    let skipped = false;

    if (!reduced) {
      // 1. rises out of the ticket slot in mechanical steps
      const slot = PLM.stage.rectOf(M.ticketslot.querySelector('.slit'));
      const k = (slot.w - 10) / 460;
      const maskH = 420;
      const mask = U.el('div', { class: 'print-mask' });
      Object.assign(mask.style, { left: slot.x - 12 + 'px', top: slot.cy - maskH + 'px', width: slot.w + 24 + 'px', height: maskH + 'px' });
      layer.append(mask);
      mask.append(fly);
      const tx = (slot.w + 24) / 2 - 300 * k;
      const ty0 = maskH + 960 * k;
      const ty1 = maskH + 96 * k;
      const at = (ty, rot) => `translate(${tx}px, ${ty}px) rotate(${-90 + (rot || 0)}deg) scale(${k})`;
      fly.style.transform = at(ty0);
      M.bulbs.set('chase');
      const steps = 12;
      for (let i = 1; i <= steps && !sk.skipped; i++) {
        const from = U.lerp(ty0, ty1, (i - 1) / steps);
        const to = U.lerp(ty0, ty1, i / steps);
        PLM.sfx('chirp');
        U.animate(fly, [{ transform: at(from) }, { transform: at(to) }], { duration: 70, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'forwards' });
        fly.style.transform = at(to);
        await sk.wait(118);
      }
      // 2. tear off with a little wiggle
      if (!sk.skipped) {
        PLM.sfx('pop');
        U.animate(fly, [{ transform: at(ty1) }, { transform: at(ty1, 2) }, { transform: at(ty1, -2) }, { transform: at(ty1, 1) }, { transform: at(ty1) }], { duration: 300, easing: 'ease-in-out' });
        await sk.wait(320);
      }
      // 3. fly to the centre while the cabinet steps back
      const m = PLM.stage.rectOf(mask);
      const startStage = `translate(${m.x + tx}px, ${m.y + ty1}px) rotate(-90deg) scale(${k})`;
      layer.append(fly);
      mask.remove();
      fly.style.transform = startStage;
      M.dim(true);
      if (!sk.skipped) {
        PLM.sfx('whoosh');
        const a = U.animate(fly, [
          { transform: startStage },
          { transform: `translate(${FINAL.x}px, ${FINAL.y}px) rotate(-3deg) scale(1)` },
        ], { duration: 640, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' });
        await Promise.race([a.finished, sk.wait(660)]);
        fly.style.transform = `translate(${FINAL.x}px, ${FINAL.y}px) rotate(-3deg) scale(1)`;
        if (!sk.skipped) {
          U.animate(fly, [{ transform: `translate(${FINAL.x}px, ${FINAL.y}px) rotate(-3deg) scale(1)` }, { transform: finalTransform }], { duration: 420, easing: 'cubic-bezier(.34,1.4,.64,1)', fill: 'forwards' });
          await sk.wait(260);
        }
      }
      fly.getAnimations().forEach((an) => an.cancel());
      fly.style.transform = finalTransform;
      M.bulbs.set('steady');

      // 4. the stamp thunks down
      if (!sk.skipped) {
        stamp.style.transformBox = 'fill-box';
        stamp.style.transformOrigin = '50% 50%';
        const st = U.animate(stamp, [{ opacity: 0, transform: 'scale(1.22)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 170, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'forwards' });
        await st.finished;
        stamp.style.opacity = '1';
        PLM.sfx('thunk');
        U.animate(fly, [
          { transform: finalTransform }, { transform: `translate(${FINAL.x + 2}px, ${FINAL.y + 1}px)` },
          { transform: `translate(${FINAL.x - 2}px, ${FINAL.y}px)` }, { transform: finalTransform },
        ], { duration: 160, easing: 'linear' });
        U.burst(FINAL.x + 626, FINAL.y + 70 + 100, { count: 18, spread: 260 });
        await sk.wait(260);
      }
      // 5. the host pony pops up from behind the stub
      if (!sk.skipped) {
        PLM.sfx('pop');
        peek.style.transformBox = 'fill-box';
        peek.style.transformOrigin = '50% 100%';
        U.animate(peek, [{ opacity: 0, transform: 'translateY(40px) scale(.94)' }, { opacity: 1, transform: 'none' }], { duration: 480, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'forwards' });
        await sk.wait(300);
      }
      skipped = sk.skipped;
    } else {
      layer.append(fly);
      fly.style.transform = finalTransform;
      M.dim(true);
      U.animate(fly, [{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: 'ease' });
      PLM.sfx('thunk');
    }
    sk.dispose();

    // settle the final state as real attributes (so the PNG export sees it)
    fly.getAnimations().forEach((an) => an.cancel());
    fly.style.transform = finalTransform;
    [stamp, peek].forEach((g) => { g.getAnimations().forEach((an) => an.cancel()); g.style.opacity = '1'; g.style.transform = ''; });
    svg.style.filter = 'drop-shadow(0 18px 26px rgba(58,26,38,.24)) drop-shadow(0 2px 3px rgba(58,26,38,.18))';
    if (skipped) {
      M.dim(true);
      M.bulbs.set('steady');
    }

    // 6. one foil sweep across the paper
    if (!reduced) {
      const foil = U.el('div', { class: 'foil', 'aria-hidden': 'true' });
      Object.assign(foil.style, { left: FINAL.x + 'px', top: FINAL.y + 70 + 'px' });
      layer.append(foil);
      requestAnimationFrame(() => foil.classList.add('sweep'));
      setTimeout(() => foil.remove(), 1100);
    }
    PLM.sfx('twinkle');
    showUi(s, svg);
    guardOn = true;
  }

  function shortcutHtml() {
    return U.isMac()
      ? '<kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>4</kbd>'
      : '<kbd>Win</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>';
  }

  function showUi(s, svg) {
    const layer = U.$('#voucherLayer');
    const icon = (n) => (art().icon ? art().icon(n) : '');
    const ui = U.el('div', { class: 'voucher-ui' });
    ui.innerHTML = `
      <div class="shot-banner blink" data-enter="lead">
        <span class="cam">${icon('camera')}</span>
        <div class="shot-text"><span class="lead">Screenshot this now, Babe.</span><span>This machine forgets everything when you close it. <b>I won’t.</b></span></div>
        <span class="keys" aria-label="Screenshot shortcut">${shortcutHtml()}</span>
      </div>
      <div class="v-actions" data-enter="support">
        <button class="v-btn save" type="button">${icon('download')}Save as image</button>
        <button class="v-btn primary done" type="button">I screenshotted it${icon('check')}</button>
      </div>`;
    layer.append(ui);
    U.enter(ui);
    const save = ui.querySelector('.save');
    const done = ui.querySelector('.done');
    setTimeout(() => done.focus({ preventScroll: true }), 400);

    save.addEventListener('click', () => saveImage(s, svg, save));
    done.addEventListener('click', () => {
      guardOn = false;
      PLM.sfx('fanfare');
      PLM.machine.bulbs.flash(1600);
      const fin = U.el('div', { class: 'v-final' });
      fin.innerHTML = `
        <div class="small" data-enter="support">Good. Send it to me so it’s official.</div>
        <div class="big" data-enter="lead">See you Thursday, Babe. <span class="cn">想你.</span></div>
        <button class="v-btn tiny-save" type="button" data-enter="deco">${icon('download')}Save as image</button>`;
      ui.replaceChildren(fin);
      U.enter(fin);
      fin.querySelector('.tiny-save').addEventListener('click', (e) => saveImage(s, svg, e.currentTarget));
      U.drift({ count: 26 });
      PLM.host.setBase('love');
      PLM.host.say('Best. Purchase. Ever.', { expr: 'love', ms: 3200 });
      if (PLM.audio && PLM.audio.duck) PLM.audio.duck(4, 1.4);
    });
  }

  async function saveImage(s, svg, btn) {
    if (!PLM.exporter) return;
    btn.setAttribute('aria-busy', 'true');
    try {
      const blob = await PLM.exporter.svgToPngBlob(svg, { scale: 2, background: '#9ADCFF', padding: 40 });
      const name = `pony-love-machine-voucher-${s.serial}.png`;
      const inApp = /MicroMessenger|WeChat|QQ\//i.test(navigator.userAgent);
      if (inApp) PLM.exporter.showImageFallback(blob, { title: 'Your voucher', hint: 'Long-press or right-click the picture to save it.' });
      else PLM.exporter.download(blob, name);
      guardOn = false;
      PLM.sfx('twinkle');
      PLM.host.say('Saved. Screenshot it anyway, I’m insecure.', { expr: 'smug', ms: 3000 });
    } catch (e) {
      PLM.host.say('The printer jammed. Screenshot it instead, Babe.', { expr: 'shocked' });
    } finally {
      btn.removeAttribute('aria-busy');
    }
  }

  PLM.voucher = { build, print, qrText };
})(window.PLM = window.PLM || {});

</script>
<script>
/* scenes.js - the story, scene by scene, plus the rainbow "mane wipe" between them.
   attract -> boot -> ask -> duel (+confession) -> prizes -> fine -> voucher (print) */
(function (PLM) {
  'use strict';

  const U = PLM.util;
  const art = () => PLM.art || {};
  const M = () => PLM.machine;
  const host = () => PLM.host;
  const sticker = (n, o) => (art().sticker ? art().sticker(n, o) : '');
  const icon = (n, o) => (art().icon ? art().icon(n, o) : '');
  const S = () => PLM.state;
  const D = () => PLM.data;
  const setExpr = (svg, e) => { if (!svg) return; if (art().setExpr) art().setExpr(svg, e); else svg.setAttribute('data-expr', e); };

  /* ---------------- scene runner ---------------- */
  let current = null;

  function makeCtx() {
    const cleanups = [];
    return {
      token: PLM.flow.token(),
      cleanups,
      onCleanup(fn) { cleanups.push(fn); },
      listen(target, type, fn, opts) {
        target.addEventListener(type, fn, opts);
        cleanups.push(() => target.removeEventListener(type, fn, opts));
      },
      timeout(fn, ms) {
        const t = setTimeout(fn, ms);
        cleanups.push(() => clearTimeout(t));
        return t;
      },
    };
  }

  async function wipe(swap) {
    const bands = U.$$('#wipe i');
    PLM.sfx('whoosh');
    if (U.reduced()) {
      const el = swap();
      U.animate(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease' });
      return;
    }
    const gaps = [0, 26, 46, 60, 70];
    const ease = 'cubic-bezier(.77,0,.175,1)';
    await Promise.all(bands.map((b, i) => U.animate(b, [{ transform: 'translateX(-101%)' }, { transform: 'translateX(0)' }], { duration: 250, delay: gaps[i], easing: ease, fill: 'forwards' }).finished));
    swap();
    host().hop();
    await U.sleep(50);
    await Promise.all(bands.map((b, i) => U.animate(b, [{ transform: 'translateX(0)' }, { transform: 'translateX(101%)' }], { duration: 250, delay: gaps[i], easing: ease, fill: 'forwards' }).finished));
    bands.forEach((b) => b.getAnimations().forEach((a) => a.cancel()));
  }

  const SCENES = {};

  async function go(name, opts) {
    const def = SCENES[name];
    if (!def) return;
    const ctx = makeCtx();
    const el = def.build(opts);
    const swap = () => {
      if (current) current.cleanups.forEach((fn) => { try { fn(); } catch (e) { /* ignore */ } });
      U.$('#sceneHost').replaceChildren(el);
      current = { name, el, cleanups: ctx.cleanups };
      if (def.deck) M().setDeck(def.deck);
      U.enter(el);
      // the control that started the wipe is gone: land keyboard + screen-reader focus on the new heading
      const a = document.activeElement;
      if (!a || a === document.body) {
        const h = el.querySelector('h2');
        if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
      }
      return el;
    };
    if (!current) swap();
    else await wipe(swap);
    PLM.scene = name;
    if (def.run) def.run(el, ctx, opts);
  }
  PLM.go = go;

  function captionSetter(node) {
    return (html) => {
      node.innerHTML = html;
      node.classList.remove('swap');
      void node.offsetWidth;
      node.classList.add('swap');
      U.announce(node.textContent);
    };
  }

  /* ================================================================== */
  /* S0 - attract mode + the heart coin                                  */
  /* ================================================================== */
  SCENES.attract = {
    deck: 'coin',
    build() {
      const capt = art().captain ? art().captain({ size: 250, expr: 'love', facing: 'left' }) : '';
      return U.frag(`<section class="scene s-attract" aria-labelledby="att-h">
        <div class="top-left" data-enter="deco">PLAYER 1 · <span class="cn">徐梦</span></div>
        <h2 class="h1" id="att-h" data-enter="lead"><span class="cn">徐梦</span>, I built a whole arcade machine to ask you one question.</h2>
        <p class="sub" data-enter="support">Texting was an option. I chose violence.</p>
        <div class="insert" data-enter="support">INSERT HEART TO START</div>
        <div class="stage-pony" data-enter="deco"><div class="cloudbed">${sticker('cloud', { size: 300 })}</div>${capt}</div>
      </section>`);
    },
    run(el, ctx) {
      PLM.alive.add(el.querySelector('.stage-pony .pony'));
      M().bulbs.set('attract');
      M().coinslot.classList.add('glow');
      const stage = U.$('#stage');
      const coin = U.el('button', { class: 'coin is-idle', type: 'button', 'aria-label': 'Insert the heart coin to start', html: sticker('heartCoin', { size: 118 }) });
      const hint = U.el('div', {
        class: 'coin-hint', 'aria-hidden': 'true',
        html: `<span class="arrow">${sticker('arrow', { size: 74, diecut: false })}</span><div class="note">Insert heart, Babe<small>${icon('speaker')} sound on, it’s cute</small></div>`,
      });
      stage.append(coin, hint);
      U.animate(coin, [{ opacity: 0, transform: 'translateY(-24px) scale(.92)' }, { opacity: 1, transform: 'none' }], { duration: 560, delay: 320, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'backwards' });
      U.animate(hint, [{ opacity: 0 }, { opacity: 1 }], { duration: 420, delay: 560, easing: 'ease', fill: 'backwards' });
      ctx.timeout(() => host().say('Psst. The coin. Put it in the slot.', { expr: 'smug' }), 2600);
      ctx.timeout(() => host().say('You can drag it too. I’m not your boss.', { expr: 'happy' }), 14000);

      const base = { cx: 502 + 59, cy: 728 + 59 };
      let inserted = false;
      let drag = null;

      function insert(ox, oy) {
        if (inserted) return;
        inserted = true;
        if (PLM.audio) { PLM.audio.init(); PLM.audio.playMusic(); }
        if (M().syncPlayer) M().syncPlayer();
        coin.classList.remove('is-idle');
        coin.disabled = true;
        hint.classList.add('is-off');
        const slot = PLM.stage.rectOf(M().coinslot.querySelector('.slit'));
        const dx = slot.cx - base.cx;
        const dy = slot.cy - base.cy;
        PLM.sfx('coin');
        const a = U.reduced()
          ? U.animate(coin, [{ opacity: 1 }, { opacity: 0 }], { duration: 240, fill: 'forwards' })
          : U.animate(coin, [
            { transform: `translate(${ox}px, ${oy}px) rotate(0deg) scale(1)` },
            { transform: `translate(${(ox + dx) / 2}px, ${Math.min(oy, dy) - 90}px) rotate(-24deg) scale(.78)`, offset: 0.45, easing: 'cubic-bezier(.55,0,1,.45)' },
            { transform: `translate(${dx}px, ${dy}px) rotate(0deg) scale(.42)`, offset: 0.82 },
            { transform: `translate(${dx}px, ${dy + 18}px) rotate(0deg) scale(.06, .42)`, opacity: 0 },
          ], { duration: 760, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'forwards' });
        a.finished.then(async () => {
          coin.remove();
          hint.remove();
          M().coinslot.classList.remove('glow');
          M().setCredits(1);
          M().bulbs.flash(900);
          host().say('Ooh. A paying customer.', { expr: 'happy', ms: 2000 });
          await U.sleep(620);
          if (ctx.token.alive) go('boot');
        });
      }

      coin.addEventListener('pointerdown', (e) => {
        if (inserted || e.button > 0) return;
        e.preventDefault();
        try { coin.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
        drag = { sx: e.clientX, sy: e.clientY, moved: false, ox: 0, oy: 0 };
        coin.classList.remove('is-idle');
      });
      coin.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const s = PLM.stage.scale;
        const dx = (e.clientX - drag.sx) / s;
        const dy = (e.clientY - drag.sy) / s;
        if (!drag.moved && Math.hypot(dx, dy) > 6) drag.moved = true;
        if (drag.moved) {
          drag.ox = dx;
          drag.oy = dy;
          coin.style.transform = `translate(${dx}px, ${dy}px) rotate(${U.clamp(dx * 0.06, -16, 16)}deg)`;
        }
      });
      const release = () => {
        if (!drag) return;
        const d = drag;
        drag = null;
        if (!d.moved) { insert(0, 0); return; }
        const slot = PLM.stage.rectOf(M().coinslot);
        if (Math.hypot(base.cx + d.ox - slot.cx, base.cy + d.oy - slot.cy) < 170) insert(d.ox, d.oy);
        else {
          U.animate(coin, [{ transform: coin.style.transform }, { transform: 'translate(0px, 0px) rotate(0deg)' }], { duration: 420, easing: 'cubic-bezier(.34,1.56,.64,1)' });
          coin.style.transform = '';
          coin.classList.add('is-idle');
          host().say('In the slot, Babe. The little dark one on the left.', { expr: 'smug' });
        }
      };
      coin.addEventListener('pointerup', release);
      coin.addEventListener('pointercancel', () => { drag = null; coin.style.transform = ''; });
      coin.addEventListener('click', (e) => { if (e.detail === 0) insert(0, 0); });
      ctx.onCleanup(() => { coin.remove(); hint.remove(); M().bulbs.set('steady'); });
    },
  };

  /* ================================================================== */
  /* S1 - "calculating how much I miss you"                              */
  /* ================================================================== */
  SCENES.boot = {
    deck: 'none',
    build() {
      return U.frag(`<section class="scene s-boot" aria-labelledby="boot-h">
        <h2 class="h2" id="boot-h" data-enter="lead">Calculating how much I miss you…</h2>
        <div class="boot-bar" data-enter="support" role="progressbar" aria-label="How much I miss you" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="fill"></div>
          <svg class="crack" viewBox="0 0 70 74" aria-hidden="true"><path d="M34 2l-7 20 15 8-13 16 11 7-9 19" fill="none" stroke="#3A1A26" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="boot-pct" data-enter="support" aria-hidden="true">0%</div>
        <p class="boot-note" data-enter="deco"></p>
        <div class="boot-err" aria-hidden="true">ERROR: NUMBER TOO BIG</div>
        <div class="skip-hint" aria-hidden="true">CLICK TO SKIP</div>
      </section>`);
    },
    async run(el, ctx) {
      const sk = U.skipper();
      ctx.onCleanup(() => sk.dispose());
      const fill = el.querySelector('.fill');
      const pct = el.querySelector('.boot-pct');
      const note = el.querySelector('.boot-note');
      const err = el.querySelector('.boot-err');
      const crack = el.querySelector('.crack');
      const bar = el.querySelector('.boot-bar');
      const TRACK = 538;
      const fmt = (v) => Math.round(v).toLocaleString('en-US') + '%';
      const setW = (w, animate) => {
        if (animate && !U.reduced()) {
          U.animate(fill, [{ width: fill.style.width || '0px' }, { width: w + 'px' }], { duration: 240, easing: 'cubic-bezier(.23,1,.32,1)' });
        }
        fill.style.width = w + 'px';
      };
      const leave = () => { if (ctx.token.alive) go('ask'); };

      // 0 -> 99%
      await new Promise((resolve) => {
        const t0 = performance.now();
        const dur = U.reduced() ? 600 : 1500;
        let lastChirp = 0;
        const f = (t) => {
          if (!ctx.token.alive || sk.skipped) return resolve();
          const k = Math.min(1, (t - t0) / dur);
          const v = 99 * (1 - Math.pow(1 - k, 3));
          setW((TRACK * v) / 100);
          pct.textContent = fmt(v);
          bar.setAttribute('aria-valuenow', String(Math.round(v)));
          if (v - lastChirp > 14) { lastChirp = v; PLM.sfx('chirp'); }
          if (k < 1) requestAnimationFrame(f); else resolve();
        };
        requestAnimationFrame(f);
      });
      if (sk.skipped) return leave();
      note.textContent = 'almost…';
      if (await sk.wait(950)) return leave();
      pct.textContent = '100%';
      setW(TRACK, true);
      if (await sk.wait(240)) return leave();
      pct.textContent = '340%';
      PLM.sfx('boing', 4);
      setW(TRACK * 1.22, true);
      note.textContent = 'hold on.';
      if (await sk.wait(520)) return leave();
      pct.textContent = '9,999%';
      PLM.sfx('boing', 9);
      setW(TRACK * 2.2, true);
      if (await sk.wait(260)) return leave();
      // crack
      PLM.sfx('bonk');
      crack.style.opacity = '1';
      U.animate(bar, [
        { transform: 'translateX(0)' }, { transform: 'translateX(-7px)' }, { transform: 'translateX(6px)' },
        { transform: 'translateX(-4px)' }, { transform: 'translateX(2px)' }, { transform: 'translateX(0)' },
      ], { duration: 360, easing: 'ease-out' });
      U.animate(err, [{ opacity: 0, transform: 'scale(.94)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'forwards' });
      note.textContent = 'Skipping to the question.';
      U.announce('Error: number too big. Skipping to the question.');
      host().say('It broke. Classic.', { expr: 'shocked', ms: 1800 });
      await sk.wait(1500);
      leave();
    },
  };

  /* ================================================================== */
  /* S2 - the question                                                   */
  /* ================================================================== */
  const NO_STEPS = [
    null,
    { label: 'No', caption: 'Missed.' },
    { label: 'Are you sure?', caption: 'It moved. Weird.' },
    { label: 'Bro, really?', caption: 'YES is getting bigger. Unrelated.', scale: 0.88 },
    { label: 'Babe, think again', caption: 'It’s shrinking. Like my chances.', scale: 0.76 },
    { label: 'I’ll cry', caption: 'Look what you did to the pony.', scale: 0.74, host: { expr: 'cry', say: 'You made the pony cry.' } },
    { label: 'I’ll buy you <span class="cn">奶茶</span>', caption: 'Bribery is legal on this website.', scale: 0.74 },
    { label: '<span class="cn">好不好嘛</span>', caption: 'It’s hiding. It’s scared of you.', scale: 0.74, hide: true },
    { label: '<span class="cn">哼</span>', caption: 'Now it’s sulking. Happy?', scale: 0.74, sulk: true },
    { label: 'Yes (shy)', caption: 'Plot twist: it changed sides.', scale: 0.8, shy: true },
    { dialog: true },
  ];

  function openSystemDialog() {
    return new Promise((resolve) => {
      const layer = U.$('#dialogLayer');
      const face = art().ponyPeek ? art().ponyPeek({ size: 64, expr: 'shocked', diecut: false }) : '';
      layer.innerHTML = `<div class="scrim"></div>
        <div class="sysdlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-d">
          <div class="bar"><h2 id="dlg-t"><span lang="zh">系统提示</span><span>SYSTEM MESSAGE</span></h2><button class="x" type="button" aria-label="Close">${icon('close')}</button></div>
          <div class="body"><div class="warn">${face}</div><p id="dlg-d">Are you sure you want to say no to Amine?<small>(your bro, your buddy, your boyfriend)</small></p></div>
          <div class="acts"><button type="button" class="b1">Fine, I’ll go out with him</button><button type="button" class="primary b2">Yes, I’ll go out with him</button></div>
        </div>`;
      const dlg = layer.querySelector('.sysdlg');
      requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('is-on')));
      const focusables = () => U.$$('button', dlg);
      const done = (res) => {
        document.removeEventListener('keydown', onKey, true);
        layer.classList.remove('is-on');
        setTimeout(() => { layer.innerHTML = ''; }, 260);
        resolve(res);
      };
      const onKey = (e) => {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done('close'); return; }
        if (e.key === 'Tab') {
          const f = focusables();
          const i = f.indexOf(document.activeElement);
          e.preventDefault();
          f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
        }
      };
      document.addEventListener('keydown', onKey, true);
      layer.querySelector('.x').addEventListener('click', () => done('close'));

  SCENES.ask = {
    deck: 'yesno',
    build() {
      const capt = art().captain ? art().captain({ size: 250, expr: 'love', facing: 'left' }) : '';
      return U.frag(`<section class="scene s-ask" aria-labelledby="ask-h">
        <div class="top-left" data-enter="deco">QUESTION 1 OF 1</div>
        <div class="q">
          <h2 class="h1" id="ask-h" data-enter="lead"><span class="cn">徐梦</span>, will you hang out with me this weekend?</h2>
          <p class="sub" data-enter="support"><span class="cn">好不好嘛</span>~ (there is a right answer)</p>
        </div>
        <p class="caption" data-enter="deco"></p>
        <div class="capt-wrap" data-enter="deco">${capt}</div>
      </section>`);
    },
    run(el, ctx) {
      const yes = M().yes;
      const yesLabel = yes.querySelector('.label');
      yesLabel.innerHTML = 'YES';
      yes.style.transform = '';
      yes.classList.remove('pulse');
      const capt = el.querySelector('.capt-wrap .pony');
      PLM.alive.add(capt);
      const setCaption = captionSetter(el.querySelector('.caption'));
      let no = null;
      let answered = false;
      const startT = performance.now();

      let cloud = U.$('#stage .hidecloud');
      if (!cloud) {
        cloud = U.el('div', { class: 'hidecloud', 'aria-hidden': 'true', html: sticker('cloud', { size: 200 }) });
        U.$('#stage').append(cloud);
      }

      function sayYes() {
        if (answered) return;
        answered = true;
        const n = no ? no.attempts : 0;
        if (no) no.destroy();
        PLM.sfx('yes');
        M().bulbs.flash(1400);
        const r = PLM.stage.rectOf(yes);
        U.burst(r.cx, r.cy - 10, { count: 24, spread: 320 });
        yes.classList.remove('pulse');
        yes.style.transform = '';
        cloud.classList.remove('is-on');
        host().hop();
        host().say(n === 0 ? 'Wow. No hesitation. Respect.' : n >= 5 ? 'Finally. The pony was sweating.' : 'Correct answer.', { expr: 'love' });
        setExpr(capt, 'laugh');
        const q = el.querySelector('.q');
        const after = U.frag(`<div class="after">
          <h2 class="h1" data-enter="lead">${n >= 5 ? 'Took you long enough.' : 'I knew it.'}</h2>
          <p class="sub" data-enter="support">(I was nervous.)</p>
          <div class="chips" data-enter="support"><button class="chip" type="button">Okay, what now?</button></div>
        </div>`);
        q.remove();
        el.querySelector('.caption').textContent = '';
        el.append(after);
        U.enter(after);
        U.announce('I knew it. I was nervous.');
        setTimeout(() => M().setDeck('none'), 520);
        const chip = after.querySelector('.chip');
        chip.addEventListener('click', () => { PLM.sfx('click'); go('duel'); });
        setTimeout(() => chip.focus({ preventScroll: true }), 700);
      }

      ctx.listen(yes, 'click', () => { PLM.sfx('click'); sayYes(); });

      ctx.timeout(() => {
        if (answered) return;
        no = PLM.noButton.mount({
          home: M().noHome,
          yes,
          steps: NO_STEPS,
          onAttempt(n, step) {
            if (step.caption) setCaption(step.caption);
            yes.style.transform = `scale(${Math.min(1 + n * 0.04, 1.3)})`;
            if (n >= 3) setExpr(capt, 'sweat');
            if (step.host) host().say(step.host.say, { expr: step.host.expr, html: true });
          },
          hideCloud(show) {
            cloud.classList.toggle('is-on', !!show);
            return { x: 22, y: 470, r: 22 + 200, b: 470 + 120, cx: 122, cy: 528 };
          },
          onDialog: async () => {
            const res = await openSystemDialog();
            if (res === 'yes') sayYes();
            return res;
          },
          onFired() {
            yesLabel.innerHTML = 'YES<small>(obviously)</small>';
            yes.classList.add('pulse');
            setCaption('The No button has been fired, effective immediately.');
            host().say('Closing it counts as a yes. I wrote the rules.', { expr: 'smug' });
            setTimeout(() => yes.focus({ preventScroll: true }), 300);
          },
        });
      }, 320);

      // idle lines
      let idleStage = 0;
      let lastKey = performance.now();
      ctx.listen(window, 'keydown', () => { lastKey = performance.now(); });
      const iv = setInterval(() => {
        if (answered) return;
        const idle = performance.now() - Math.max(PLM.pointer.t || 0, lastKey, startT);
        if (idleStage === 0 && idle > 20000) { idleStage = 1; host().say('Take your time. (Please don’t take your time.)', { expr: 'sleepy' }); }
        else if (idleStage === 1 && idle > 45000) { idleStage = 2; host().say('I’m staring at my phone too, you know.', { expr: 'pout' }); }
      }, 1000);
      ctx.onCleanup(() => {
        clearInterval(iv);
        if (no && !answered) no.destroy();
        cloud.classList.remove('is-on');
      });
    },
  };

  SCENES.duel = {
    deck: 'rps',
    build() {
      const capt = art().captain ? art().captain({ size: 190, expr: 'smug', facing: 'left' }) : '';
      return U.frag(`<section class="scene s-duel" aria-labelledby="duel-h">
        <div class="duel-top" data-enter="lead">
          <div class="duel-title" id="duel-h">A duel. Winner picks our date.<small>Captain Amine borrowed a glove. Ponies don’t have fingers.</small></div>
          <div class="score" aria-label="Score">AMINE <b class="sa">0</b> : <b class="sh">0</b> <span class="cn">徐梦</span></div>
        </div>
        <div class="arena" data-enter="support">
          <div class="hand-her">${PLM.hand.svg({ pose: 'rock', cuff: '#FF6FAE' })}</div>
          <div class="hand-his">${PLM.hand.svg({ pose: 'rock', cuff: '#8EEBC6', mirror: true, sparkles: true })}</div>
          <div class="capt">${capt}</div>
          <div class="chant" aria-hidden="true"><span>石头…</span> <span>剪刀…</span> <span>布!</span></div>
          <div class="speech is-hidden" role="status"></div>
          <div class="verdict-stamp" aria-hidden="true">YOU LOSE</div>
        </div>
        <div class="duel-bottom"><p class="caption" aria-live="polite">Pick on the machine: rock, paper or scissors.</p><div class="chips"></div></div>
        <div class="confess" aria-live="polite">
          <div class="big-hand">${PLM.hand.svg({ pose: 'ily', cuff: '#8EEBC6', sparkles: true })}</div>
          <div class="confess-text">
            <p class="typed"></p>
            <p class="love"><span class="cn">我爱你, 徐梦.</span><span class="en">I love you.</span></p>
            <div class="final-score"><span class="cn">徐梦</span> <b>∞</b> : <b>2</b> AMINE (cheated)</div>
            <p class="fine">Fine. I cheated. You win. You pick the date. You were always going to.</p>
            <div class="chips"><button class="chip" type="button">Show me the prizes${icon('arrowRight')}</button></div>
          </div>
        </div>
      </section>`);
    },
    run(el, ctx) {
      const herHand = el.querySelector('.hand-her svg');
      const hisHand = el.querySelector('.hand-his svg');
      const capt = el.querySelector('.capt .pony');
      PLM.alive.add(capt);
      const speech = el.querySelector('.speech');
      const stampEl = el.querySelector('.verdict-stamp');
      const chant = U.$$('.chant span', el);
      const chips = el.querySelector('.duel-bottom .chips');
      const setCap = captionSetter(el.querySelector('.duel-bottom .caption'));
      const scoreBox = el.querySelector('.score');
      const scoreA = el.querySelector('.sa');
      const picks = M().rps;
      let round = 0;
      let armed = false;

      const say = (html, ms) => {
        speech.innerHTML = html;
        speech.classList.remove('is-hidden');
        clearTimeout(speech._t);
        if (ms) speech._t = setTimeout(() => speech.classList.add('is-hidden'), ms);
      };
      const arm = (on) => {
        armed = on;
        Object.values(picks).forEach((b) => { b.disabled = !on; });
      };
      const hideStamp = () => { stampEl.getAnimations().forEach((a) => a.cancel()); stampEl.style.opacity = '0'; };
      const addChip = (html, fn) => {
        const b = U.el('button', { class: 'chip', type: 'button', html });
        b.addEventListener('click', () => { PLM.sfx('click'); fn(); });
        chips.append(b);
        U.animate(b, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 360, delay: chips.children.length * 70, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' });
        return b;
      };
      const bounce = (svg) => U.animate(svg.querySelector('.hand-wrap'), [
        { transform: 'translateY(0)' }, { transform: 'translateY(-30px)', offset: 0.45, easing: 'cubic-bezier(.23,1,.32,1)' }, { transform: 'translateY(0)' },
      ], { duration: 340, easing: 'cubic-bezier(.77,0,.175,1)' });
      const reset = () => {
        hideStamp();
        PLM.hand.set(herHand, 'rock');
        PLM.hand.set(hisHand, 'rock');
        chant.forEach((s) => { s.getAnimations().forEach((a) => a.cancel()); s.style.opacity = '0'; });
      };

      ctx.timeout(() => say('Captain Amine. Your bro. Your buddy. Undefeated.', 3400), 520);
      arm(true);
      Object.entries(picks).forEach(([pick, b]) => ctx.listen(b, 'click', () => play(pick)));
      ctx.listen(window, 'keydown', (e) => {
        if (!armed || e.repeat) return;
        const map = { 1: 'rock', 2: 'paper', 3: 'scissors' };
        const pick = map[e.key];
        if (!pick) return;
        const b = picks[pick];
        b.classList.add('is-pressed');
        setTimeout(() => b.classList.remove('is-pressed'), 140);
        play(pick);
      });
      ctx.onCleanup(() => arm(false));

      async function play(pick) {
        if (!armed) return;
        arm(false);
        round++;
        PLM.sfx('click');
        chips.replaceChildren();
        speech.classList.add('is-hidden');
        reset();
        setCap('&nbsp;');
        // three beats: 石头… 剪刀… 布!
        for (let i = 0; i < 3; i++) {
          if (!ctx.token.alive) return;
          const s = chant[i];
          s.style.opacity = '1';
          U.animate(s, [{ opacity: 0, transform: 'translateY(10px) scale(.9)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'cubic-bezier(.34,1.56,.64,1)' });
          PLM.sfx('tick', i);
          if (!U.reduced()) { bounce(herHand); bounce(hisHand); }
          await U.sleep(U.reduced() ? 300 : 400);
        }
        if (!ctx.token.alive) return;
        PLM.hand.set(herHand, pick);
        PLM.hand.set(hisHand, 'middle', { shineDelay: 140 });
        chant.forEach((s) => U.animate(s, [{ opacity: 1 }, { opacity: 0 }], { duration: 260, delay: 500, fill: 'forwards' }));

        if (round < 3) {
          await U.sleep(120);
          if (PLM.audio && PLM.audio.duck) PLM.audio.duck(14, 1.3);
          PLM.sfx('scratch');
          await U.sleep(320);
          if (!ctx.token.alive) return;
          PLM.sfx('trombone');
          U.animate(hisHand, [{ transform: 'scale(1)' }, { transform: 'scale(1.08)' }, { transform: 'scale(1.03)' }], { duration: 420, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'forwards' });
          stampEl.style.opacity = '1';
          U.animate(stampEl, [
            { opacity: 0, transform: 'translate(-50%, -50%) rotate(-8deg) scale(1.3)' },
            { opacity: 1, transform: 'translate(-50%, -50%) rotate(-8deg) scale(1)' },
          ], { duration: 180, easing: 'cubic-bezier(.23,1,.32,1)' });
          setTimeout(() => PLM.sfx('thunk'), 150);
          scoreA.textContent = String(round);
          scoreBox.classList.remove('bump');
          void scoreBox.offsetWidth;
          scoreBox.classList.add('bump');
          setExpr(capt, round === 1 ? 'laugh' : 'wink');
          if (round === 1) {
            setCap('Middle finger beats everything. House rules.');
            host().say('Rules are rules.', { expr: 'smug', ms: 2200 });
            await U.sleep(520);
            addChip('That’s cheating. Rematch.', () => {
              chips.replaceChildren();
              setExpr(capt, 'smug');
              reset();
              say('I’ll play rock this time. Pony promise.', 0);
              setCap('Pick again.');
              arm(true);
            });
          } else {
            setCap('Middle finger beats rock, paper, scissors <i>and</i> trust.');
            host().say('To be fair, he did promise.', { expr: 'smug', ms: 2400 });
            await U.sleep(520);
            const next = () => {
              chips.replaceChildren();
              setExpr(capt, 'sweat');
              reset();
              say('Last round. For real this time.', 0);
              setCap('Final round. Pick.');
              arm(true);
            };
            addChip('Rematch', next);
            addChip('<span class="cn">哼!!!</span>', next);
          }
        } else {
          // round three: the turn
          await U.sleep(140);
          if (PLM.audio && PLM.audio.duck) PLM.audio.duck(18, 2.4);
          PLM.sfx('scratch');
          setExpr(capt, 'sweat');
          setCap('Middle finger… wait.');
          await U.sleep(950);
          if (!ctx.token.alive) return;
          PLM.hand.set(hisHand, 'ily', { order: ['middle', 'thumb', 'index', 'pinky', 'ring'], stagger: 70 });
          PLM.sfx('harp');
          const r = PLM.stage.rectOf(hisHand);
          U.burst(r.cx, r.y + 50, { count: 20, spread: 260 });
          setExpr(capt, 'love');
          host().say('Oh no. He’s being smooth.', { expr: 'love', ms: 2600 });
          await U.sleep(1150);
          if (ctx.token.alive) confess();
        }
      }

      async function confess() {
        M().setDeck('none');
        const c = el.querySelector('.confess');
        c.classList.add('is-on');
        U.animate(c, [{ opacity: 0 }, { opacity: 1 }], { duration: 320, easing: 'ease' });
        // the duel underneath is covered: take it out of the picture (and out of screen readers)
        setTimeout(() => {
          ['.duel-top', '.arena', '.duel-bottom'].forEach((sel) => {
            const n = el.querySelector(sel);
            if (n) { n.style.visibility = 'hidden'; n.setAttribute('aria-hidden', 'true'); }
          });
        }, 340);
        const big = c.querySelector('.big-hand');
        U.animate(big, U.reduced()
          ? [{ opacity: 0 }, { opacity: 1 }]
          : [{ opacity: 0, transform: 'translateX(260px) scale(.8) rotate(8deg)' }, { opacity: 1, transform: 'none' }],
        { duration: 640, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' });
        const typed = c.querySelector('.typed');
        const love = c.querySelector('.love');
        const rest = [c.querySelector('.final-score'), c.querySelector('.fine'), c.querySelector('.chips')];
        [love, ...rest].forEach((n) => { n.style.opacity = '0'; });
        await U.sleep(380);
        await U.type(typed, 'That’s “I love you” in sign language.', { token: ctx.token });
        await U.sleep(420);
        if (!ctx.token.alive) return;
        love.style.opacity = '';
        U.animate(love, U.reduced()
          ? [{ opacity: 0 }, { opacity: 1 }]
          : [{ opacity: 0, transform: 'translateY(16px) scale(.97)', filter: 'blur(3px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }],
        { duration: 620, easing: 'cubic-bezier(.16,1,.3,1)' });
        PLM.sfx('twinkle');
        const lr = PLM.stage.rectOf(love);
        U.burst(lr.cx, lr.cy, { count: 16, spread: 300, kinds: ['heart'] });
        U.announce('我爱你, 徐梦. I love you.');
        await U.sleep(600);
        const gaps = [0, 110, 190];
        rest.forEach((n, i) => {
          n.style.opacity = '';
          U.animate(n, U.reduced() ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }],
            { duration: 460, delay: gaps[i], easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' });
        });
        const chip = c.querySelector('.chip');
        chip.addEventListener('click', () => { PLM.sfx('click'); go('prizes'); });
        setTimeout(() => chip.focus({ preventScroll: true }), 500);
      }
    },
  };

  SCENES.prizes = {
    deck: 'none',
    build() {
      const cells = D().PLANS.map((p) => {
        const inner = art().mark ? art().mark(p.id, { size: 64, diecut: false }) : '';
        const cap = art().capsule ? art().capsule({ color: p.color, inner }) : '';
        return `<button class="prize" type="button" aria-pressed="false" data-id="${p.id}">
          <span class="capwrap">${cap}${p.rosette ? `<span class="rosette" aria-hidden="true">${sticker('rosette', { size: 52 })}</span>` : ''}</span>
          <span class="pname"><span class="pn-main">${p.name}</span><span class="pn-sub">${p.nameCn}</span></span>
          <span class="tick" aria-hidden="true">${icon('check')}</span>
        </button>`;
      }).join('');
      return U.frag(`<section class="scene s-prizes" aria-labelledby="prz-h">
        <div class="prize-head" data-enter="lead"><div><h2 class="h2" id="prz-h">Pick our dates.</h2><p class="sub">Up to three. I’m paying for all of them.</p></div><div class="picked-count" aria-live="polite">0 / 3 PICKED</div></div>
        <div class="shelf" data-enter="support">${cells}</div>
        <div class="prize-foot" data-enter="support"><p class="prize-detail">Hover a capsule to read the menu.</p><div class="chips"><button class="chip go" type="button" aria-disabled="true">Pick at least one, Babe</button></div></div>
      </section>`);
    },
    run(el, ctx) {
      const sel = new Set();
      const detail = el.querySelector('.prize-detail');
      const count = el.querySelector('.picked-count');
      const goBtn = el.querySelector('.chip.go');
      const plain = (html) => html.replace(/<[^>]+>/g, '');
      const show = (p) => { detail.innerHTML = `<b>${plain(p.name)}</b> ${p.line}`; };
      const update = () => {
        count.textContent = `${sel.size} / 3 PICKED`;
        if (sel.size) {
          goBtn.removeAttribute('aria-disabled');
          goBtn.innerHTML = 'These ones, please' + icon('arrowRight');
        } else {
          goBtn.setAttribute('aria-disabled', 'true');
          goBtn.textContent = 'Pick at least one, Babe';
        }
      };
      const wiggle = (n) => { n.classList.remove('wiggle'); void n.offsetWidth; n.classList.add('wiggle'); };
      U.$$('.prize', el).forEach((btn) => {
        const p = D().byId(btn.dataset.id);
        ctx.listen(btn, 'pointerenter', () => { show(p); PLM.sfx('hover'); });
        ctx.listen(btn, 'focus', () => show(p));
        ctx.listen(btn, 'click', () => {
          const capsule = btn.querySelector('.capsule');
          if (sel.has(p.id)) {
            sel.delete(p.id);
            btn.setAttribute('aria-pressed', 'false');
            if (capsule) capsule.classList.remove('is-open');
            PLM.sfx('click');
          } else {
            if (sel.size >= 3) {
              wiggle(btn);
              PLM.sfx('bonk');
              host().say('Greedy. I love it. Max 3 per weekend though.', { expr: 'smug' });
              return;
            }
            const first = sel.size === 0;
            sel.add(p.id);
            btn.setAttribute('aria-pressed', 'true');
            if (capsule) capsule.classList.add('is-open');
            PLM.sfx('pop');
            const r = PLM.stage.rectOf(btn.querySelector('.capwrap'));
            U.burst(r.cx, r.cy - 10, { count: 9, spread: 130, size: [12, 22] });
            if (first && p.id === 'waimai') host().say('Correct answer.', { expr: 'love' });
            else host().say(p.joke, { expr: 'happy' });
          }
          show(p);
          update();
        });
      });
      ctx.listen(goBtn, 'click', () => {
        if (!sel.size) { wiggle(goBtn); PLM.sfx('bonk'); return; }
        PLM.sfx('click');
        S().plans = D().PLANS.filter((p) => sel.has(p.id)).map((p) => p.id);
        go('when');
      });
    },
  };

  /* ================================================================== */
  /* S5b - when? (she lands Thursday night, stays until Sunday)          */

  SCENES.when = {
    deck: 'none',
    build() {
      const rows = S().plans.map((id) => {
        const p = D().byId(id);
        const plainName = p.name.replace(/<[^>]+>/g, '');
        const mark = art().mark ? art().mark(p.id, { size: 56, diecut: false }) : '';
        const days = D().DAYS.map((d) => `<button class="pill day" type="button" role="radio" aria-checked="false" data-day="${d.id}" aria-label="${d.label} ${d.date} November"><b>${d.label}</b><small>${d.date}</small></button>`).join('');
        const times = D().TIMES.map((t) => `<button class="pill time" type="button" role="radio" aria-checked="false" data-time="${t.id}">${t.label}</button>`).join('');
        return `<div class="when-row" data-id="${p.id}">
          <div class="wr-mark" aria-hidden="true">${mark}</div>
          <div class="wr-body">
            <div class="wr-name"><span>${p.name}</span><span class="wr-sum"></span></div>
            <div class="wr-picks">
              <div class="pills days" role="radiogroup" aria-label="Day for ${plainName}">${days}</div>
              <div class="pills times" role="radiogroup" aria-label="Time for ${plainName}">${times}</div>
            </div>
          </div>
        </div>`;
      }).join('');
      return U.frag(`<section class="scene s-when" aria-labelledby="when-h">
        <div class="when-head" data-enter="lead"><h2 class="h2" id="when-h">When are we doing these?</h2><p class="sub">You land Thursday night. You’re mine until Sunday.</p></div>
        <div class="when-list" data-enter="support">${rows}</div>
        <div class="when-foot" data-enter="support"><p class="caption"></p><div class="chips"><button class="chip go" type="button" aria-disabled="true">Pick a day and a time</button></div></div>
      </section>`);
    },
    run(el, ctx) {
      const st = S();
      st.schedule = {};
      const setCap = captionSetter(el.querySelector('.when-foot .caption'));
      const goBtn = el.querySelector('.chip.go');
      const wiggle = (n) => { n.classList.remove('no-go'); void n.offsetWidth; n.classList.add('no-go'); };
      let lastSay = 0;
      let saidDouble = false;
      const chatter = (html, expr) => {
        const now = performance.now();
        if (now - lastSay < 1400) return;
        lastSay = now;
        host().say(html, { expr: expr || 'happy', html: true });
      };
      const done = (id) => !!(st.schedule[id] && st.schedule[id].day && st.schedule[id].time);
      const update = () => {
        const n = st.plans.filter(done).length;
        const all = n === st.plans.length;
        if (all) {
          goBtn.removeAttribute('aria-disabled');
          goBtn.innerHTML = 'Lock it in' + icon('arrowRight');
          setCap('Looks perfect. I’m already nervous.');
        } else {
          goBtn.setAttribute('aria-disabled', 'true');
          goBtn.textContent = st.plans.length > 1 ? `${n} of ${st.plans.length} scheduled` : 'Pick a day and a time';
          setCap('');
        }
        // the same slot twice?
        const keys = st.plans.filter(done).map((id) => st.schedule[id].day + st.schedule[id].time);
        if (!saidDouble && new Set(keys).size < keys.length) {
          saidDouble = true;
          host().say('Two dates at once? Ambitious. I’m in.', { expr: 'love' });
          lastSay = performance.now();
        }
      };

      U.$$('.when-row', el).forEach((row) => {
        const id = row.dataset.id;
        st.schedule[id] = { day: null, time: null };
        const dayBtns = U.$$('.day', row);
        const timeBtns = U.$$('.time', row);
        const sum = row.querySelector('.wr-sum');
        const lockTimes = (nightOnly) => timeBtns.forEach((b) => {
          const blocked = nightOnly && b.dataset.time !== 'late';
          b.classList.toggle('is-blocked', blocked);
          if (blocked) { b.setAttribute('aria-disabled', 'true'); b.title = 'You land Thursday night'; }
          else { b.removeAttribute('aria-disabled'); b.removeAttribute('title'); }
        });
        const render = () => {
          const sl = st.schedule[id];
          dayBtns.forEach((b) => b.setAttribute('aria-checked', String(b.dataset.day === sl.day)));
          timeBtns.forEach((b) => b.setAttribute('aria-checked', String(b.dataset.time === sl.time)));
          sum.textContent = D().slotText(sl);
          row.classList.toggle('is-done', done(id));
        };
        dayBtns.forEach((b) => ctx.listen(b, 'click', () => {
          const d = D().DAYS.find((x) => x.id === b.dataset.day);
          const sl = st.schedule[id];
          if (sl.day === d.id) return;
          sl.day = d.id;
          PLM.sfx('click');
          if (d.nightOnly) {
            lockTimes(true);
            sl.time = 'late';
            host().say(d.say, { expr: 'smug' });
            lastSay = performance.now();
          } else {
            lockTimes(false);
            chatter(d.say);
          }
          render();
          update();
        }));
        timeBtns.forEach((b) => ctx.listen(b, 'click', () => {
          if (b.classList.contains('is-blocked')) {
            wiggle(b);
            PLM.sfx('bonk');
            host().say('You’ll still be in the sky, Babe. Thursday is late night only.', { expr: 'pout' });
            lastSay = performance.now();
            return;
          }
          const t = D().TIMES.find((x) => x.id === b.dataset.time);
          const sl = st.schedule[id];
          if (sl.time === t.id) return;
          sl.time = t.id;
          PLM.sfx('click');
          chatter(t.say, t.id === 'late' ? 'smug' : 'happy');
          render();
          update();
        }));
        render();
      });
      update();

      ctx.listen(goBtn, 'click', () => {
        if (goBtn.getAttribute('aria-disabled') === 'true') {
          wiggle(goBtn);
          PLM.sfx('bonk');
          host().say('Every date needs a day and a time.', { expr: 'pout' });
          return;
        }
        PLM.sfx('click');
        go('fine');
      });
    },
  };

  /* ================================================================== */
  /* S6 - the fine print, then the crank                                 */
  /* ================================================================== */
  let thumbUrl = null;
  function ponyThumb() {
    if (thumbUrl) return thumbUrl;
    if (!art().ponyPeek) return 'none';
    let svg = art().ponyPeek({ size: 64, expr: 'love', diecut: false });
    if (!/xmlns=/.test(svg)) svg = svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    thumbUrl = `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;
    return thumbUrl;
  }

  SCENES.fine = {
    deck: 'none',
    build() {
      return U.frag(`<section class="scene s-fine" aria-labelledby="fine-h">
        <div data-enter="lead"><h2 class="h2" id="fine-h">The fine print.</h2><p class="sub">Two small details. Then the machine prints your voucher.</p></div>
        <div class="fine-row" data-enter="support"><div class="q">How clingy should I be?<small>Be honest.</small></div>
          <div class="cling"><span class="end">polite</span>
            <div class="cling-track"><button class="soldout" type="button" tabindex="-1" aria-hidden="true">SOLD OUT</button><div class="cling-fill" aria-hidden="true"></div><input class="cling-range" type="range" min="60" max="100" step="1" value="75" aria-label="How clingy should Amine be (polite is sold out)"></div>
            <span class="end">koala</span><span class="val" aria-hidden="true"></span></div></div>
        <div class="fine-row" data-enter="support"><div class="q">Who pays?<small>Think carefully.</small></div>
          <div class="pills pays" role="radiogroup" aria-label="Who pays">
            <button class="pill pay" type="button" role="radio" aria-checked="true" data-id="a1">Amine</button>
            <button class="pill pay" type="button" role="radio" aria-checked="false" data-id="a2">Amine</button>
            <button class="pill pay her" type="button" role="radio" aria-checked="false" data-id="her"><span class="cn">徐梦</span><span class="strike" aria-hidden="true"></span></button>
          </div></div>
        <div class="fine-foot" data-enter="support"><p class="caption"></p><div class="go">Now turn the crank${icon('arrowRight')}</div></div>
      </section>`);
    },
    run(el, ctx) {
      const setCap = captionSetter(el.querySelector('.fine-foot .caption'));
      const wiggle = (n) => { n.classList.remove('no-go'); void n.offsetWidth; n.classList.add('no-go'); };
      const select = (group, btn) => U.$$('.pill', group).forEach((b) => b.setAttribute('aria-checked', String(b === btn)));

      // clinginess: the slider only spans 60-100. Pushing against "sold out" gets the joke,
      // but nothing ever fights the drag or moves under the pointer.
      const range = el.querySelector('.cling-range');
      const track = el.querySelector('.cling-track');
      const sold = el.querySelector('.soldout');
      const val = el.querySelector('.cling .val');
      range.style.setProperty('--thumb', ponyThumb());
      let lastWarn = 0;
      let lastTick = 0;
      let dragging = false;
      const politeIsSoldOut = () => {
        const now = performance.now();
        if (now - lastWarn < 1800) return;
        lastWarn = now;
        host().say('Polite is out of stock.', { expr: 'smug' });
        PLM.sfx('bonk');
        wiggle(sold);
      };
      const upd = (fromUser) => {
        const v = Number(range.value);
        S().clingy = v;
        track.style.setProperty('--p', ((v - 60) / 40).toFixed(4));
        val.innerHTML = `${v}%<small>${D().clingWord(v)}</small>`;
        range.setAttribute('aria-valuetext', `${v}%, ${D().clingWord(v)}`);
        const now = performance.now();
        if (fromUser && now - lastTick > 70) { lastTick = now; PLM.sfx('slide'); }
      };
      ctx.listen(range, 'input', () => upd(true));
      ctx.listen(range, 'pointerdown', () => { dragging = true; });
      ctx.listen(window, 'pointerup', () => { dragging = false; });
      ctx.listen(window, 'pointercancel', () => { dragging = false; });
      ctx.listen(window, 'pointermove', (e) => {
        if (!dragging || Number(range.value) > 60) return;
        if (e.clientX < range.getBoundingClientRect().left - 8) politeIsSoldOut();
      }, { passive: true });
      ctx.listen(range, 'keydown', (e) => {
        if (Number(range.value) <= 60 && ['ArrowLeft', 'ArrowDown', 'PageDown', 'Home'].includes(e.key)) politeIsSoldOut();
      });
      ctx.listen(sold, 'click', politeIsSoldOut);
      upd(false);

      // who pays (it's Amine)
      setCap('Everything’s in order. Mostly.');
      const pays = el.querySelector('.pays');
      U.$$('.pill', pays).forEach((b) => ctx.listen(b, 'click', () => {
        if (b.classList.contains('her')) {
          if (b.classList.contains('is-crossed')) {
            wiggle(b);
            PLM.sfx('bonk');
            host().say('Still no.', { expr: 'smug' });
            return;
          }
          select(pays, b);
          PLM.sfx('click');
          setTimeout(() => {
            b.classList.add('is-crossed');
            b.setAttribute('aria-disabled', 'true');
            wiggle(b);
            PLM.sfx('bonk');
            select(pays, pays.querySelector('[data-id="a1"]'));
            host().say('Cute. No.', { expr: 'smug' });
          }, 280);
        } else {
          select(pays, b);
          PLM.sfx('click');
          if (b.dataset.id === 'a2') host().say('Same Amine. Great choice.', { expr: 'happy' });
        }
      }));

      // the crank prints the voucher
      M().setCrankReady(true);
      ctx.onCleanup(() => M().setCrankReady(false));
      let printing = false;
      ctx.listen(M().crank, 'click', async () => {
        if (printing) return;
        const st = S();
        const ready = st.plans.length && st.plans.every((id) => st.schedule[id] && st.schedule[id].day && st.schedule[id].time);
        if (!ready) {
          host().say('Every date needs a day and a time first.', { expr: 'pout' });
          PLM.sfx('bonk');
          return;
        }
        printing = true;
        M().setCrankReady(false);
        await M().turnCrank();
        PLM.voucher.print(S());
      });
    },
  };

  /* ---------------- dev jumps (#dev-<scene>) for testing ---------------- */
  PLM.dev = {
    async jump(name) {
      const st = S();
      if (['when', 'fine', 'voucher'].includes(name)) { st.plans = ['waimai', 'westlake', 'hotpot']; }
      if (['fine', 'voucher'].includes(name)) {
        st.schedule = { waimai: { day: 'thu', time: 'late' }, westlake: { day: 'sat', time: 'golden' }, hotpot: { day: 'fri', time: 'late' } };
      }
      if (name === 'voucher') {
        st.clingy = 87;
        await go('fine');
        await U.sleep(400);
        PLM.voucher.print(st);
        return;
      }
      go(SCENES[name] ? name : 'attract');
    },
  };
})(window.PLM = window.PLM || {});

</script>
<script>
/* eggs.js - small secrets: tab title, back button, konami herd, the right-click menu,
   M to mute, and a reaction to devtools. */
(function (PLM) {
  'use strict';

  const U = PLM.util;
  const art = () => PLM.art || {};
  const icon = (n) => (art().icon ? art().icon(n) : '');
  const E = (PLM.eggs = {});

  function herd() {
    const fx = U.$('#fx');
    const colors = ['pink', 'peach', 'butter', 'mint', 'sky', 'pink', 'mint'];
    PLM.sfx('fanfare');
    PLM.host.say('Cheat code accepted. Amine does the dishes for a week.', { expr: 'love', ms: 4200 });
    colors.forEach((c, i) => {
      const size = U.rand(96, 132);
      const p = U.el('div', { class: 'herd', html: art().miniPony ? art().miniPony({ color: c, size }) : '' });
      p.style.width = size + 'px';
      const y = U.rand(640, 800);
      fx.append(p);
      const d = U.rand(2300, 3400);
      const delay = i * U.rand(120, 260);
      const a = U.reduced()
        ? U.animate(p, [
          { transform: `translate(${200 + i * 160}px, ${y}px)`, opacity: 0 },
          { transform: `translate(${200 + i * 160}px, ${y}px)`, opacity: 1, offset: 0.3 },
          { transform: `translate(${200 + i * 160}px, ${y}px)`, opacity: 0 },
        ], { duration: 2000, delay, fill: 'both' })
        : U.animate(p, [
          { transform: `translate(-180px, ${y}px)` },
          { transform: `translate(1620px, ${y - 20}px)` },
        ], { duration: d, delay, easing: 'linear', fill: 'both' });
      const svg = p.querySelector('svg');
      if (svg) svg.classList.add('gallop', 'is-alive');
      a.finished.then(() => p.remove());
    });
  }

  function contextMenu() {
    const layer = U.$('#menuLayer');
    const menu = U.el('div', { class: 'ctxmenu is-hidden', role: 'menu', 'aria-label': 'Secret menu' });
    menu.innerHTML = `<div class="cm-title">Inspect element? Inspect your feelings instead.</div>
      <button type="button" role="menuitem" data-a="copy">${icon('heart')}Copy love</button>
      <button type="button" role="menuitem" data-a="save">${icon('download')}Save Amine as…</button>
      <button type="button" role="menuitem" data-a="src">${icon('sparkle')}View source of my heart</button>`;
    layer.append(menu);
    let open = false;
    const close = () => {
      if (!open) return;
      open = false;
      menu.classList.add('is-hidden');
    };
    document.addEventListener('contextmenu', (e) => {
      if (e.target.closest && e.target.closest('input, img, textarea, dialog')) return;
      e.preventDefault();
      const p = PLM.stage.toStage(e.clientX, e.clientY);
      const x = U.clamp(p.x, 8, 1440 - 300);
      const y = U.clamp(p.y, 8, 900 - 200);
      menu.style.left = x + 'px';
      menu.style.top = y + 'px';
      menu.classList.add('is-hidden');
      void menu.offsetWidth;
      menu.classList.remove('is-hidden');
      open = true;
      PLM.sfx('pop');
      setTimeout(() => { const b = menu.querySelector('button'); if (b) b.focus({ preventScroll: true }); }, 30);
    });
    window.addEventListener('pointerdown', (e) => { if (!menu.contains(e.target)) close(); }, true);
    window.addEventListener('keydown', (e) => {
      if (!open) return;
      if (e.key === 'Escape') { close(); return; }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        const items = U.$$('button', menu);
        const i = items.indexOf(document.activeElement);
        items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
      }
    });
    window.addEventListener('blur', close);
    menu.addEventListener('click', async (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      close();
      PLM.sfx('click');
      if (b.dataset.a === 'copy') {
        try { await navigator.clipboard.writeText('我爱你, 徐梦. — Amine'); } catch (err) { /* ok */ }
        PLM.host.say('Copied. Paste it somewhere nice.', { expr: 'love' });
      } else if (b.dataset.a === 'save') {
        PLM.host.say('Saved as: boyfriend. Forever. No undo.', { expr: 'smug' });
      } else {
        PLM.host.say('It’s just your name. Three thousand times.', { expr: 'love' });
      }
    });
  }

  E.init = function () {
    // tab title
    const baseTitle = document.title;
    let leftAt = 0;
    let lastWelcome = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        leftAt = Date.now();
        document.title = 'Babe come back 🥺';
      } else {
        document.title = baseTitle;
        const now = Date.now();
        if (now - leftAt > 2500 && now - lastWelcome > 30000) {
          lastWelcome = now;
          setTimeout(() => PLM.host.say('Welcome back. I counted the seconds.', { expr: 'happy' }), 450);
        }
      }
    });

    // back button: there is no going back
    try { history.pushState({ plm: 1 }, ''); } catch (e) { /* file:// may refuse */ }
    window.addEventListener('popstate', () => {
      try { history.pushState({ plm: 1 }, ''); } catch (e) { /* ignore */ }
      PLM.host.say('Only forward, Babe ♡', { expr: 'smug' });
    });

    // keys
    const seq = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
    let pos = 0;
    window.addEventListener('keydown', (e) => {
      const k = e.key && e.key.length === 1 ? e.key.toLowerCase() : e.key;
      pos = k === seq[pos] ? pos + 1 : k === seq[0] ? 1 : 0;
      if (pos === seq.length) { pos = 0; herd(); }

      const typing = e.target && e.target.matches && e.target.matches('input[type="text"], textarea');
      if (k === 'm' && !e.ctrlKey && !e.metaKey && !e.altKey && !typing && PLM.audio) {
        PLM.audio.init();
        PLM.audio.toggleMuted();
        if (PLM.machine.syncPlayer) PLM.machine.syncPlayer();
        const m = PLM.audio.isMuted();
        PLM.host.say(m ? 'Muted. The pony is offended.' : 'The pony forgives you.', { expr: m ? 'pout' : 'happy', ms: 2200 });
      }

      const dev = e.key === 'F12'
        || ((e.ctrlKey || e.metaKey) && e.shiftKey && /^[ijc]$/i.test(e.key))
        || (e.metaKey && e.altKey && /^[ij]$/i.test(e.key));
      if (dev) PLM.host.say('Hacker Babe detected. The No button isn’t in the code. (It is. Don’t look.)', { expr: 'shocked', ms: 4400 });
    });

    contextMenu();
  };
})(window.PLM = window.PLM || {});

</script>
<script>
/* main.js - boot: styles from the art modules, favicon, stage, phone gate, first scene. */
(function (PLM) {
  'use strict';

  const U = PLM.util;
  const root = document.documentElement;
  root.classList.remove('no-js');
  root.classList.add('js');

  function injectArtCss() {
    const css = [PLM.art && PLM.art.ponyCSS, PLM.art && PLM.art.stickerCSS].filter(Boolean).join('\n');
    if (css) document.head.append(U.el('style', { text: css }));
  }

  function svgDataUrl(svg) {
    if (!/xmlns=/.test(svg)) svg = svg.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function favicon() {
    if (!PLM.art || !PLM.art.ponyPeek) return;
    const svg = PLM.art.ponyPeek({ size: 64, expr: 'happy', diecut: false });
    document.head.append(U.el('link', { rel: 'icon', type: 'image/svg+xml', href: svgDataUrl(svg) }));
  }

  function isPhone() {
    const coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    const shortSide = Math.min(window.screen ? screen.width : innerWidth, window.screen ? screen.height : innerHeight);
    return (coarse && shortSide < 700) || innerWidth < 560;
  }

  function showGate(onPlay) {
    const gate = U.$('#gate');
    const peek = PLM.art && PLM.art.ponyPeek ? PLM.art.ponyPeek({ size: 150, expr: 'pout' }) : '';
    gate.innerHTML = `<div class="gate-card">
      <div class="peek">${peek}</div>
      <h2>This machine is bigger than your phone, Babe.</h2>
      <p>${/^https?:$/.test(location.protocol)
        ? 'Open this link on your computer instead. WeChat for PC or Mac works too. Sound on.'
        : 'Open it on your computer instead. In WeChat for PC or Mac, click the file and it opens in your browser. Sound on.'}</p>
      <p class="cn">用电脑打开 ♡</p>
      <button type="button">Play anyway (tiny mode)</button>
    </div>`;
    gate.hidden = false;
    gate.querySelector('button').addEventListener('click', () => {
      gate.hidden = true;
      PLM.stage.tiny = true;
      PLM.stage.fit();
      onPlay();
    });
  }

  async function start() {
    try { await Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), U.sleep(2500)]); } catch (e) { /* ok */ }
    PLM.machine.build();
    PLM.eggs.init();
    PLM.started = true;
    const dev = /^#dev-(\w+)/.exec(location.hash);
    if (dev && PLM.dev) PLM.dev.jump(dev[1]);
    else PLM.go('attract');
  }

  function boot() {
    injectArtCss();
    favicon();
    PLM.stage.init();
    if (isPhone() && !/#dev-/.test(location.hash)) showGate(start);
    else start();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window.PLM = window.PLM || {});

</script>
</body>
