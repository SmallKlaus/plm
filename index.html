        defs.appendChild(copy);
        if (styler) pairs(src, copy, []).forEach(([o, c], i) => styler.inline(o, c, i === 0 ? 'top' : 'child'));
        sources.push(src);
        present.add(id);
        added++;
      });
      if (!added) break;
    }
    return sources;
  }

  /* ---------------------------------------------------------------- */
  /* Fonts                                                              */

  function familyList(value) {
    return String(value || '')
      .split(',')
      .map((f) => f.trim().replace(/^['"]|['"]$/g, '').toLowerCase())
      .filter(Boolean);
  }

  function fontFaceRules() {
    const out = [];
    const visit = (rules, base) => {
      for (let i = 0; i < rules.length; i++) {
        const rule = rules[i];
        if (rule.type === 5 /* CSSRule.FONT_FACE_RULE */) out.push({ rule, base });
        else if (rule.type === 3 /* IMPORT_RULE */ && rule.styleSheet) {
          try {
            visit(rule.styleSheet.cssRules, rule.styleSheet.href || base);
          } catch (e) { /* cross-origin import */ }
        } else if (rule.cssRules) {
          try {
            visit(rule.cssRules, base);
          } catch (e) { /* ignore */ }
        }
      }
    };
    for (const sheet of Array.from(document.styleSheets)) {
      let rules = null;
      try {
        rules = sheet.cssRules;
      } catch (e) {
        continue; // cross-origin stylesheet
      }
      if (rules) visit(rules, sheet.href || document.baseURI);
    }
    return out;
  }

  /** @font-face text for the used families, with every font URL as a data: URL. */
  async function fontCss(used, extraCss) {
    const extra = String(extraCss || '').toLowerCase();
    const chunks = [];
    for (const { rule, base } of fontFaceRules()) {
      const fam = familyList(rule.style.getPropertyValue('font-family'))[0];
      if (!fam || !(used.has(fam) || (extra && extra.indexOf(fam) >= 0))) continue;
      let css = rule.cssText;
      const urls = [];
      css.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (m, q, u) => {
        if (!/^data:/i.test(u)) urls.push(u);
        return m;
      });
      let okRule = true;
      for (const u of urls) {
        try {
          const data = await fetchAsDataURL(new URL(u, base).href);
          css = css.split(u).join(data);
        } catch (e) {
          okRule = false; // e.g. file:// pages cannot fetch; skip this face
          break;
        }
      }
      if (okRule) chunks.push(css);
    }
    return chunks.join('\n');
  }

  /** Inline <image> hrefs that are not data: URLs (best effort). */
  async function inlineImages(clone) {
    const imgs = Array.from(clone.querySelectorAll('image'));
    for (const img of imgs) {
      const href = img.getAttribute('href') || img.getAttributeNS(XLINK_NS, 'href');
      if (!href || /^data:/i.test(href)) continue;
      try {
        const data = await fetchAsDataURL(new URL(href, document.baseURI).href);
        img.removeAttributeNS(XLINK_NS, 'href');
        img.setAttribute('href', data);
      } catch (e) { /* leave it; it will just not render */ }
    }
  }

  /* ---------------------------------------------------------------- */
  /* Geometry                                                           */

  function measure(svg) {
    const vb = svg.viewBox && svg.viewBox.baseVal;
    if (vb && vb.width > 0 && vb.height > 0) return { x: vb.x, y: vb.y, w: vb.width, h: vb.height };
    let w = 0;
    let h = 0;
    try {
      if (svg.width.baseVal.unitType !== 2 /* % */) w = svg.width.baseVal.value;
      if (svg.height.baseVal.unitType !== 2) h = svg.height.baseVal.value;
    } catch (e) { /* no attributes */ }
    if (!(w > 0 && h > 0)) {
      w = svg.clientWidth;
      h = svg.clientHeight;
    }
    if (!(w > 0 && h > 0)) {
      const r = svg.getBoundingClientRect();
      w = r.width;
      h = r.height;
    }
    return { x: 0, y: 0, w, h };
  }

  /* ---------------------------------------------------------------- */
  /* Rendering                                                          */

  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('PLM.exporter: the SVG could not be loaded as an image'));
      img.src = src;
    });
  }

  function canvasToBlob(canvas) {
    return new Promise((resolve, reject) => {
      if (canvas.toBlob) {
        canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('PLM.exporter: toBlob returned null'))), 'image/png');
      } else {
        const url = canvas.toDataURL('image/png'); // throws SecurityError if tainted
        const bin = atob(url.split(',')[1]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        resolve(new Blob([bytes], { type: 'image/png' }));
      }
    });
  }

  async function render(src, W, H, background, passes, delay) {
    const img = await loadImage(src);
    if (img.decode) {
      try {
        await img.decode();
      } catch (e) { /* older Safari rejects decode() for SVG; onload already fired */ }
    }
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    for (let i = 0; i < passes; i++) {
      // Safari (and sometimes Chrome) lays out web fonts inside an SVG image lazily: the first
      // draw kicks the font load, a later draw picks it up.
      if (i) await wait(delay);
      ctx.clearRect(0, 0, W, H);
      if (background) {
        ctx.fillStyle = background;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.drawImage(img, 0, 0, W, H);
    }
    return canvasToBlob(canvas);
  }

  function mountString(markup) {
    const host = document.createElement('div');
    host.setAttribute('aria-hidden', 'true');
    host.style.cssText = 'position:fixed;left:-99999px;top:0;width:1px;height:1px;overflow:hidden;pointer-events:none';
    host.innerHTML = String(markup).trim();
    (document.body || document.documentElement).appendChild(host);
    return { svg: host.querySelector('svg'), host };
  }

  async function svgToPngBlob(svgEl, options) {
    const o = options || {};
    const scaleIn = o.scale == null ? 2 : Math.max(0.01, +o.scale || 2);
    const background = o.background == null || o.background === '' ? null : String(o.background);
    const padding = Math.max(0, +o.padding || 0);
    const extraCss = o.extraCss ? String(o.extraCss) : '';

    let host = null;
    if (typeof svgEl === 'string') {
      const m = mountString(svgEl);
      svgEl = m.svg;
      host = m.host;
    }
    let styler = null;
    try {
      if (!svgEl || svgEl.namespaceURI !== SVG_NS || svgEl.localName !== 'svg') {
        throw new TypeError('PLM.exporter.svgToPngBlob: expected an <svg> element');
      }
      const box = measure(svgEl);
      if (!(box.w > 0 && box.h > 0)) throw new Error('PLM.exporter: the SVG has no size (add a viewBox)');
      const vw = box.w + 2 * padding;
      const vh = box.h + 2 * padding;
      let scale = scaleIn;
      scale = Math.min(scale, Math.sqrt(MAX_AREA / (vw * vh)), MAX_SIDE / Math.max(vw, vh));
      const W = Math.max(1, Math.round(vw * scale));
      const H = Math.max(1, Math.round(vh * scale));

      // 1. Clone + styles
      const clone = svgEl.cloneNode(true);
      const list = pairs(svgEl, clone, []);
      if (o.inlineStyles !== false) {
        styler = makeStyler();
        clone.removeAttribute('style');
        list.forEach(([orig, copy], i) => styler.inline(orig, copy, i === 0 ? 'root' : 'child'));
      }
      const imported = importMissingRefs(svgEl, clone, styler);

      // 2. Font families used by text (and by <use>, whose instances inherit from it)
      const used = new Set();
      const TEXTISH = 'text, tspan, textPath, use';
      const walk = [svgEl, ...svgEl.querySelectorAll(TEXTISH)];
      imported.forEach((src) => walk.push(src, ...src.querySelectorAll(TEXTISH)));
      for (const el of walk) familyList(getComputedStyle(el).fontFamily).forEach((f) => used.add(f));

      clone.querySelectorAll(STRIP).forEach((el) => el.remove());
      await inlineImages(clone);
      const fonts = await fontCss(used, extraCss);
      const css = [fonts, extraCss].filter(Boolean).join('\n');
      if (css) {
        const style = document.createElementNS(SVG_NS, 'style');
        style.textContent = css;
        clone.insertBefore(style, clone.firstChild);
      }

      // 3. Geometry
      clone.setAttributeNS(XMLNS_NS, 'xmlns', SVG_NS);
      clone.setAttributeNS(XMLNS_NS, 'xmlns:xlink', XLINK_NS);
      clone.setAttribute('viewBox', [box.x - padding, box.y - padding, vw, vh].join(' '));
      clone.setAttribute('width', String(W));
      clone.setAttribute('height', String(H));
      if (clone.style) {
        ['width', 'height', 'max-width', 'max-height', 'min-width', 'min-height', 'transform', 'position'].forEach((p) =>
          clone.style.removeProperty(p)
        );
      }

      const markup = new XMLSerializer().serializeToString(clone);
      const hasFonts = !!fonts;
      const webkit = isWebKit();
      const passes = o.passes != null ? Math.max(1, o.passes | 0) : hasFonts ? (webkit ? 3 : 2) : 1;
      const delay = o.fontDelay != null ? Math.max(0, +o.fontDelay) : webkit ? 180 : 60;

      // 4. Render: Blob URL first, data: URL if the canvas ends up tainted or the load fails
      const blobUrl = URL.createObjectURL(new Blob([markup], { type: 'image/svg+xml;charset=utf-8' }));
      try {
        return await render(blobUrl, W, H, background, passes, delay);
      } catch (e) {
        const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(markup);
        return await render(dataUrl, W, H, background, passes, delay);
      } finally {
        URL.revokeObjectURL(blobUrl);
      }
    } finally {
      if (styler) styler.dispose();
      if (host) host.remove();
    }
  }

  /* ---------------------------------------------------------------- */
  /* Saving                                                             */

  function download(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || 'ticket.png';
    a.rel = 'noopener';
    a.style.display = 'none';
    (document.body || document.documentElement).appendChild(a);
    a.click();
    setTimeout(() => {
      a.remove();
      URL.revokeObjectURL(url);
    }, 60000); // Safari needs the URL alive for a while after click()
  }

  /** WeChat, QQ, Weibo, Facebook, Instagram and similar webviews block downloads. */
  function isInAppBrowser() {
    const ua = navigator.userAgent || '';
    return /MicroMessenger|WeChat|WeiBo|QQ\/|MQQBrowser|DingTalk|AlipayClient|FBAN|FBAV|Instagram|Line\/|Twitter|TikTok|BytedanceWebview|; wv\)/i.test(ua);
  }

  let styleInjected = false;
  function injectStyle() {
    if (styleInjected || document.getElementById('plm-export-style')) return;
    styleInjected = true;
    const s = document.createElement('style');
    s.id = 'plm-export-style';
    s.textContent =
      '.plm-export-dialog::backdrop{background:rgba(58,26,38,.55)}' +
      '.plm-export-dialog{animation:plm-export-in .22s cubic-bezier(.16,1,.3,1)}' +
      '@keyframes plm-export-in{from{opacity:0;transform:translateY(10px) scale(.96)}}' +
      '.plm-export-dialog button:focus-visible,.plm-export-dialog a:focus-visible{outline:3px solid #C2185B;outline-offset:3px}' +
      '.plm-export-dialog button:active{transform:translateY(3px);box-shadow:0 1px 0 #3A1A26}' +
      '@media (prefers-reduced-motion:reduce){.plm-export-dialog{animation:none}}';
    document.head.appendChild(s);
  }

  let current = null;
  /** Show the PNG in a modal so it can be saved by right-click / long-press. Returns the dialog. */
  function showImageFallback(blob, options) {
    const o = options || {};
    if (current) current.close();
    injectStyle();
    const title = o.title || 'Your ticket';
    const hint = o.hint || 'Right-click the picture and choose “Save image as…”. On a phone, long-press it.';
    const uid = 'plm-x-' + Math.random().toString(36).slice(2, 8);
    const opener = document.activeElement;
    const objectUrl = URL.createObjectURL(blob);

    const dlg = document.createElement('dialog');
    dlg.className = 'plm-export-dialog';
    dlg.setAttribute('aria-labelledby', uid + '-t');
    dlg.setAttribute('aria-describedby', uid + '-h');
    dlg.setAttribute('data-plm-allow-contextmenu', '');
    dlg.style.cssText =
      'box-sizing:border-box;max-width:min(92vw,980px);max-height:92vh;overflow:auto;padding:20px 22px 18px;' +
      'border:3px solid #3A1A26;border-radius:24px;background:#FFFBFD;color:#3A1A26;text-align:center;' +
      'box-shadow:0 8px 0 #E0458C,0 22px 50px rgba(58,26,38,.35);color-scheme:light;' +
      'font-family:"Zen Maru Gothic","DynaPuff",system-ui,sans-serif';

    const h = document.createElement('h2');
    h.id = uid + '-t';
    h.textContent = title;
    h.style.cssText = 'margin:0 0 14px;font:700 24px/1.2 "DynaPuff","Zen Maru Gothic",system-ui,sans-serif;color:#3A1A26';

    const img = document.createElement('img');
    img.alt = o.alt || title;
    img.src = objectUrl;
    // WeChat-style webviews save long-pressed images from data: URLs, not blob: URLs.
    blobToDataURL(blob).then((d) => { if (!closed) img.src = d; }, () => {});
    img.draggable = true;
    img.style.cssText =
      'display:block;margin:0 auto;max-width:100%;max-height:64vh;width:auto;height:auto;border-radius:14px;' +
      'background:#FFFBFD;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;pointer-events:auto';

    const p = document.createElement('p');
    p.id = uid + '-h';
    p.textContent = hint;
    p.style.cssText = 'margin:14px auto 16px;max-width:46ch;font:500 16px/1.5 "Zen Maru Gothic",system-ui,sans-serif;color:#3A1A26';

    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = o.closeLabel || 'Close';
    btn.style.cssText =
      'font:700 17px/1 "DynaPuff","Zen Maru Gothic",system-ui,sans-serif;color:#3A1A26;background:#FFE066;' +
      'border:3px solid #3A1A26;border-radius:999px;padding:11px 24px;cursor:pointer;box-shadow:0 4px 0 #3A1A26;' +
      'transition:transform .12s cubic-bezier(.23,1,.32,1),box-shadow .12s cubic-bezier(.23,1,.32,1)';
    row.appendChild(btn);
    if (o.filename) {
      const a = document.createElement('a');
      a.href = objectUrl;
      a.download = o.filename;
      a.textContent = o.downloadLabel || 'Download PNG';
      a.style.cssText = 'font:700 16px/1 "Zen Maru Gothic",system-ui,sans-serif;color:#C2185B;text-underline-offset:3px';
      row.appendChild(a);
    }
    dlg.append(h, img, p, row);

    // Keep the app's global shortcuts and custom right-click menu away from this dialog.
    dlg.addEventListener('contextmenu', (e) => e.stopPropagation());
    dlg.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !dlg.showModal) {
        e.preventDefault();
        close();
      }
      e.stopPropagation();
    });
    dlg.addEventListener('click', (e) => {
      if (e.target !== dlg) return; // backdrop clicks land on the dialog box itself
      const r = dlg.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) close();
    });

    let closed = false;
    function cleanup() {
      if (closed) return;
      closed = true;
      dlg.remove();
      setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
      if (current === api) current = null;
      if (opener && opener.focus && document.contains(opener)) opener.focus();
    }
    function close() {
      if (dlg.open && dlg.close) dlg.close();
      else cleanup();
    }
    dlg.addEventListener('close', cleanup);
    btn.addEventListener('click', close);
    const api = { close, dialog: dlg };
    current = api;

    (document.body || document.documentElement).appendChild(dlg);
    if (typeof dlg.showModal === 'function') {
      dlg.showModal();
    } else {
      // Very old engines: fake a modal.
      dlg.setAttribute('open', '');
      dlg.setAttribute('role', 'dialog');
      dlg.setAttribute('aria-modal', 'true');
      dlg.style.cssText += ';position:fixed;inset:0;margin:auto;z-index:2147483647;height:fit-content';
    }
    btn.focus();
    return dlg;
  }

  /** Download where possible, otherwise show the long-press fallback. Returns which one ran. */
  function save(blob, filename, fallbackOptions) {
    const canDownload = 'download' in HTMLAnchorElement.prototype;
    if (!canDownload || isInAppBrowser()) {
      showImageFallback(blob, Object.assign({ filename: null }, fallbackOptions));
      return 'fallback';
    }
    download(blob, filename);
    return 'download';
  }

  PLM.exporter = { svgToPngBlob, download, showImageFallback, save, isInAppBrowser };
})(window.PLM = window.PLM || {});

</script>
<script>
/* hand.js - one parametric cartoon glove that can make every gesture the duel needs.
   Upright, back of the hand facing us. Fingers are separate groups pivoting at their
   base (hidden under the palm), so poses morph on springs:
   rock -> paper -> scissors -> middle (the joke) -> ily (I love you in sign language). */
(function (PLM) {
  'use strict';

  const INK = '#3A1A26';
  const MILK = '#FFFBFD';
  const KNUCKLE = 132; // y of the knuckle line (palm top edge)
  const BASE = 20; // finger length hidden under the palm
  const FOLD = 16; // visible height of a folded finger above the knuckle

  const FINGERS = [
    { id: 'index', x: 76, w: 25, len: 76 },
    { id: 'middle', x: 100, w: 26, len: 90 },
    { id: 'ring', x: 123, w: 24, len: 80 },
    { id: 'pinky', x: 142, w: 20, len: 60 },
  ];
  const THUMB = { x: 64, y: 186, w: 26, len: 56, base: 16 };

  // [extended 0|1, rotation in degrees] per digit
  const POSES = {
    rock: { thumb: [0, 10], index: [0, -3], middle: [0, -1], ring: [0, 0], pinky: [0, 1] },
    paper: { thumb: [1, -48], index: [1, -13], middle: [1, -3], ring: [1, 7], pinky: [1, 17] },
    scissors: { thumb: [0, 10], index: [1, -14], middle: [1, 9], ring: [0, 0], pinky: [0, 1] },
    middle: { thumb: [0, 10], index: [0, -3], middle: [1, 0], ring: [0, 0], pinky: [0, 1] },
    ily: { thumb: [1, -60], index: [1, -8], middle: [0, -1], ring: [0, 0], pinky: [1, 15] },
  };

  function fingerTransform(f, pose) {
    const [ext, rot] = pose;
    const s = ext ? 1 : (FOLD + BASE) / (f.len + BASE);
    return `rotate(${rot}deg) scaleY(${s.toFixed(4)})`;
  }
  function thumbTransform(pose) {
    const [ext, rot] = pose;
    // folded: slide in behind the palm so no stray sliver shows
    return ext ? `translate(0px, 0px) rotate(${rot}deg) scaleY(1)` : `translate(12px, 6px) rotate(${rot}deg) scaleY(0.4)`;
  }

  function fingerMarkup(f, pose) {
    const top = KNUCKLE - f.len;
    const h = f.len + BASE;
    const ox = f.x;
    const oy = KNUCKLE + BASE;
    return `<g class="f f-${f.id}" style="transform-origin:${ox}px ${oy}px;transform:${fingerTransform(f, pose)}">
      <rect x="${f.x - f.w / 2}" y="${top}" width="${f.w}" height="${h}" rx="${f.w / 2}" fill="${MILK}" stroke="${INK}" stroke-width="3.2" vector-effect="non-scaling-stroke"/>
    </g>`;
  }

  function thumbMarkup(pose) {
    const t = THUMB;
    const ox = t.x;
    const oy = t.y + t.base;
    return `<g class="f f-thumb" style="transform-origin:${ox}px ${oy}px;transform:${thumbTransform(pose)}">
      <rect x="${t.x - t.w / 2}" y="${t.y - t.len}" width="${t.w}" height="${t.len + t.base}" rx="${t.w / 2}" fill="${MILK}" stroke="${INK}" stroke-width="3.2" vector-effect="non-scaling-stroke"/>
    </g>`;
  }

  const SPARK = (x, y, s, fill) => `<path class="shine" opacity="0" transform="translate(${x} ${y}) scale(${s})" d="M0-10c.9 5.6 3.3 8.2 9 9.4-5.7 1.2-8.1 3.8-9 9.4-.9-5.6-3.3-8.2-9-9.4 5.7-1.2 8.1-3.8 9-9.4z" fill="${fill}" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>`;

  /**
   * @param {object} o { pose='rock', cuff='#FF6FAE', mirror=false, className='', sparkles=false }
   * @returns {string} SVG markup
   */
  function svg(o) {
    o = o || {};
    const pose = POSES[o.pose] || POSES.rock;
    const cuff = o.cuff || '#FF6FAE';
    const fingers = FINGERS.map((f) => fingerMarkup(f, pose[f.id])).join('');
    const body = `
      ${thumbMarkup(pose.thumb)}
      ${fingers}
      <path class="palm" d="M58 146c0-11 6-16 16-16h60c12 0 18 6 18 18l-2 50c-1 20-12 30-32 30H90c-20 0-32-10-33-30z" fill="${MILK}" stroke="${INK}" stroke-width="3.4" stroke-linejoin="round"/>
      <g fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round" opacity=".5">
        <path d="M84 154q-2 18 0 36"/><path d="M104 152v40"/><path d="M124 154q2 18 0 36"/>
      </g>
      <ellipse cx="128" cy="210" rx="9" ry="5" fill="#FF8FB8" opacity=".0" class="glove-blush"/>
      <g class="cuff">
        <path d="M66 222h78q6 0 6 6v20q0 8-8 8H68q-8 0-8-8v-20q0-6 6-6z" fill="${cuff}" stroke="${INK}" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M64 236h82" stroke="${INK}" stroke-width="2.6" stroke-linecap="round" opacity=".45"/>
      </g>
      ${o.sparkles ? SPARK(66, 40, 0.9, '#FFE066') + SPARK(140, 30, 0.7, '#FF6FAE') + SPARK(126, 78, 0.55, '#6CC8FF') : ''}
    `;
    const inner = o.mirror ? `<g transform="translate(210 0) scale(-1 1)">${body}</g>` : body;
    return `<svg class="hand ${o.className || ''}" viewBox="0 0 210 262" data-pose="${o.pose || 'rock'}" aria-hidden="true" focusable="false"><g class="hand-wrap">${inner}</g></svg>`;
  }

  /**
   * Morph an existing hand to a pose.
   * @param {SVGElement} el the <svg class="hand">
   * @param {string} poseName
   * @param {object} o { order: ['thumb','index',...], stagger: ms between digits }
   */
  function set(el, poseName, o) {
    if (!el) return;
    o = o || {};
    const pose = POSES[poseName];
    if (!pose) return;
    el.setAttribute('data-pose', poseName);
    const order = o.order || ['thumb', 'index', 'middle', 'ring', 'pinky'];
    order.forEach((id, i) => {
      const g = el.querySelector('.f-' + id);
      if (!g) return;
      g.style.transitionDelay = o.stagger ? i * o.stagger + 'ms' : '0ms';
      g.style.transform = id === 'thumb' ? thumbTransform(pose.thumb) : fingerTransform(FINGERS.find((f) => f.id === id), pose[id]);
    });
    el.querySelectorAll('.shine').forEach((s, i) => {
      s.style.transition = `opacity 240ms ease ${o.shineDelay || 0}ms`;
      s.style.opacity = poseName === 'middle' || poseName === 'ily' ? '1' : '0';
    });
  }

  /** Small static icon version for the arcade buttons. */
  function icon(poseName, cuff) {
    return svg({ pose: poseName, cuff: cuff || '#FFFBFD', className: 'hand-icon' });
  }

  PLM.hand = { svg, set, icon, poses: Object.keys(POSES) };
})(window.PLM = window.PLM || {});

<script>
/* machine.js - the cabinet: wall, marquee bulbs, stickers, deck controls,
   the host pony (Tangyuan) with her speech bubble, and the music player. */
(function (PLM) {
  'use strict';

  const U = PLM.util;
  const art = () => PLM.art || {};
  const sticker = (name, o) => (art().sticker ? art().sticker(name, o) : '');
  const icon = (name, o) => (art().icon ? art().icon(name, o) : '');

  const M = (PLM.machine = {});

  /* ---------------- wall ---------------- */
  function buildWall() {
    const wall = U.$('#wall');
    const clouds = [
      { y: 64, size: 220, dur: 150, delay: -20 },
      { y: 236, size: 160, dur: 118, delay: -88 },
      { y: 392, size: 250, dur: 170, delay: -54 },
      { y: 548, size: 180, dur: 136, delay: -118 },
      { y: 150, size: 130, dur: 104, delay: -40 },
      { y: 470, size: 140, dur: 124, delay: -9 },
    ];
    clouds.forEach((c) => {
      const d = U.el('div', { class: 'drift' });
      d.style.top = c.y + 'px';
      d.style.setProperty('--dur', c.dur + 's');
      d.style.setProperty('--delay', c.delay + 's');
      d.innerHTML = sticker('cloud', { size: c.size, diecut: false });
      wall.append(d);
    });
    wall.append(U.el('div', { class: 'wall-floor' }));
  }

  /* ---------------- marquee bulbs ---------------- */
  const bulbs = (M.bulbs = {
    els: [], timer: null, mode: 'steady',
    build() {
      const host = U.$('#bulbs');
      const W = 996;
      const H = 108;
      const pts = [];
      const topY = 14;
      const botY = H - 14;
      const n = 23;
      for (let i = 0; i < n; i++) pts.push([30 + (i * (W - 60)) / (n - 1), topY]);
      pts.push([W - 13, H / 2]);
      for (let i = n - 1; i >= 0; i--) pts.push([30 + (i * (W - 60)) / (n - 1), botY]);
      pts.push([13, H / 2]);
      pts.forEach(([x, y]) => {
        const b = U.el('span', { class: 'bulb' });
        b.style.left = x + 'px';
        b.style.top = y + 'px';
        host.append(b);
        this.els.push(b);
      });
      this.set('steady');
    },
    set(mode) {
      clearInterval(this.timer);
      this.mode = mode;
      const els = this.els;
      if (mode === 'off') { els.forEach((b) => b.classList.remove('on')); return; }
      if (mode === 'steady' || U.reduced()) { els.forEach((b) => b.classList.add('on')); return; }
      let i = 0;
      if (mode === 'attract') {
        const tick = () => { i++; els.forEach((b, k) => b.classList.toggle('on', (k + i) % 2 === 0)); };
        tick();
        this.timer = setInterval(tick, 560);
      } else if (mode === 'chase') {
        const tick = () => { i++; els.forEach((b, k) => b.classList.toggle('on', (k - i + 400) % 5 < 2)); };
        tick();
        this.timer = setInterval(tick, 65);
      }
    },
    /** chase for a moment, then settle back */
    flash(ms) {
      const back = this.mode === 'chase' ? 'steady' : this.mode;
      this.set('chase');
      clearTimeout(this.flashT);
      this.flashT = setTimeout(() => this.set(back), ms || 1100);
    },
  });

  /* ---------------- stickers (stage coords) ---------------- */
  function buildStickers() {
    const layer = U.$('#cabStickers');
    const list = [
      { n: 'heart', x: 262, y: 150, s: 70, r: -14 },
      { n: 'bridge', x: 168, y: 318, s: 122, r: -8 },
      { n: 'tangyuanBall', x: 196, y: 470, s: 70, r: 12 },
      { n: 's520', x: 178, y: 594, s: 100, r: -10 },
      { n: 'horseshoe', x: 1150, y: 214, s: 76, r: 16 },
      { n: 'sparkle', x: 1176, y: 108, s: 42, r: 0 },
      { n: 'sparkle', x: 206, y: 120, s: 34, r: 12 },
      { n: 'rainbow', x: 1262, y: 30, s: 150, r: 0 },
      { n: 'thursday', x: 1224, y: 158, s: 196, r: 8 },
      { n: 'sparkle', x: 1340, y: 330, s: 30, r: 0 },
      { n: 'sparkle', x: 70, y: 262, s: 26, r: 0 },
      { n: 'hoofprints', x: 70, y: 836, s: 74, r: -18 },
      { n: 'heart', x: 1158, y: 450, s: 46, r: 14 },
    ];
    list.forEach((it) => {
      const d = U.el('div', { class: 'stk stk-' + it.n });
      d.style.left = it.x + 'px';
      d.style.top = it.y + 'px';
      d.style.width = it.s + 'px';
      d.style.setProperty('--r', it.r + 'deg');
      d.innerHTML = sticker(it.n, { size: it.s });
      layer.append(d);
    });
  }

  /* ---------------- deck ---------------- */
  function dome(o) {
    const b = U.el('button', { class: 'dome ' + (o.className || ''), type: 'button', 'aria-label': o.aria || o.label || '' });
    b.innerHTML = `<span class="ring"></span><span class="cap">${o.inner || ''}${o.label ? `<span class="label">${o.label}</span>` : ''}</span>${o.tag ? `<span class="tag" aria-hidden="true">${o.tag}</span>` : ''}`;
    if (o.pick) b.dataset.pick = o.pick;
    return b;
  }

  function buildDeck() {
    const deck = U.$('#deck');
    M.lcd = U.el('div', { class: 'lcd', 'aria-hidden': 'true' });
    M.setCredits(0, true);

    M.coinslot = U.el('div', { class: 'coinslot plate' },
      U.el('div', { class: 'slit' }),
      U.el('div', { class: 'plate-label', html: 'Insert &#9825;' }));

    M.nameplate = U.el('div', { class: 'nameplate plate' },
      U.el('div', { class: 'np-1', text: 'PLAYER 1' }),
      U.el('div', { class: 'np-2', lang: 'zh', text: '徐梦' }));

    M.yes = dome({ className: 'is-yes', label: 'YES', aria: 'Yes' });
    M.noHome = U.el('div', { class: 'no-home', style: { width: '112px', height: '52px', position: 'relative' } });
    M.yesnoSet = U.el('div', { class: 'ctrl-set is-off', 'data-set': 'yesno' }, M.yes, M.noHome);

    const picks = [
      { pick: 'rock', cn: '石头', en: 'Rock', key: '1' },
      { pick: 'paper', cn: '布', en: 'Paper', key: '2' },
      { pick: 'scissors', cn: '剪刀', en: 'Scissors', key: '3' },
    ];
    M.rps = {};
    M.rpsSet = U.el('div', { class: 'ctrl-set rps-set is-off', 'data-set': 'rps' });
    picks.forEach((p) => {
      const b = dome({ className: 'rps', pick: p.pick, tag: `<b>${p.key}</b><span lang="zh">${p.cn}</span>`, aria: `${p.en} (${p.cn}), key ${p.key}`, inner: PLM.hand ? PLM.hand.icon(p.pick, '#FFFBFD') : '' });
      M.rps[p.pick] = b;
      M.rpsSet.append(b);
    });

    M.ticketslot = U.el('div', { class: 'ticketslot plate' },
      U.el('div', { class: 'plate-label', text: 'Prize tickets' }),
      U.el('div', { class: 'slit' }));

    M.crank = U.el('button', { class: 'crank', type: 'button', 'aria-label': 'Turn the crank to print the voucher', disabled: true });
    M.crank.innerHTML = '<span class="base"></span><span class="arm"><span class="bar"></span><span class="knob"></span></span><span class="hub"></span>';

    deck.append(M.lcd, M.coinslot, M.nameplate, M.yesnoSet, M.rpsSet, M.ticketslot, M.crank);

    M.crankHint = U.el('div', { class: 'crank-hint', 'aria-hidden': 'true', html: 'turn me' + icon('arrowRight') });
    U.$('#stage').append(M.crankHint);
  }

  M.setCredits = function (n, silent) {
    M.lcd.innerHTML = `CREDITS <b>${String(n).padStart(2, '0')}</b>`;
    if (!silent) {
      M.lcd.classList.remove('flash');
      void M.lcd.offsetWidth;
      M.lcd.classList.add('flash');
    }
  };

  /** 'none' | 'yesno' | 'rps' */
  M.setDeck = function (name) {
    U.$$('.ctrl-set', U.$('#deck')).forEach((s) => s.classList.toggle('is-off', s.dataset.set !== name));
    M.nameplate.classList.toggle('is-off', name !== 'none');
    M.deckName = name;
  };

  M.setCrankReady = function (on) {
    M.crank.disabled = !on;
    M.crank.classList.toggle('is-ready', !!on);
    M.crankHint.classList.toggle('is-on', !!on);
  };

  M.turnCrank = function () {
    const arm = M.crank.querySelector('.arm');
    M.crank.classList.remove('is-ready');
    M.crankHint.classList.remove('is-on');
    if (U.reduced()) { PLM.sfx('crank'); return U.sleep(120); }
    arm.style.transition = 'transform 760ms cubic-bezier(.77,0,.175,1)';
    arm.style.transform = 'rotate(360deg)';
    PLM.sfx('crank');
    return U.sleep(780).then(() => {
      arm.style.transition = 'none';
      arm.style.transform = 'rotate(0deg)';
    });
  };

  M.dim = function (on) { U.$('#machine').classList.toggle('is-dim', !!on); };

  /* ---------------- alive registry: blink + eyes follow the cursor ---------------- */
  const alive = (PLM.alive = {
    items: new Set(),
    add(svg) {
      if (!svg) return;
      svg.classList.add('is-alive');
      const it = { svg, lx: 0, ly: 0, next: performance.now() + U.rand(1200, 3600) };
      this.items.add(it);
      return it;
    },
    remove(svg) { this.items.forEach((it) => { if (it.svg === svg) this.items.delete(it); }); },
    loop(t) {
      const p = PLM.pointer;
      alive.items.forEach((it) => {
        if (!it.svg.isConnected) { alive.items.delete(it); return; }
        // eyes follow the cursor (decorative, lerped)
        const eyes = it.svg.querySelector('.p-eyes') || it.svg;
        const r = PLM.stage.rectOf(eyes);
        let tx = 0;
        let ty = 0;
        if (p.active && !U.reduced()) {
          tx = U.clamp((p.x - r.cx) / 380, -1, 1);
          ty = U.clamp((p.y - r.cy) / 300, -1, 1);
        }
        it.lx = U.lerp(it.lx, tx, 0.12);
        it.ly = U.lerp(it.ly, ty, 0.12);
        if (art().lookAt) art().lookAt(it.svg, it.lx, it.ly);
        // blinks every 2.5-6s, sometimes a double
        if (t > it.next) {
          if (art().blink) {
            art().blink(it.svg);
            if (Math.random() < 0.22) setTimeout(() => art().blink(it.svg), 220);
          }
          it.next = t + U.rand(2500, 6000);
        }
      });
      requestAnimationFrame(alive.loop);
    },
  });

  /* ---------------- host pony + bubble ---------------- */
  function buildHost() {
    const host = U.$('#host');
    const pony = art().tangyuan ? art().tangyuan({ size: 236, expr: 'happy', facing: 'left' }) : '';
    host.innerHTML = `<div class="host-cloud">${sticker('cloud', { size: 250 })}</div>
      <button class="host-pony" type="button" aria-label="Tangyuan the pony. Poke her.">${pony}</button>
      <div class="bubble is-hidden" role="status"></div>`;
    const svg = host.querySelector('.pony');
    alive.add(svg);
    const btn = host.querySelector('.host-pony');
    let pokes = 0;
    let pokeT = null;
    const lines = [
      ['shocked', 'Hey.'],
      ['pout', 'Personal space, please.'],
      ['smug', 'I’m telling Amine.'],
      ['shocked', 'Bro.'],
      ['pout', '<span class="cn">哼</span>. Stop poking me. Poke him.'],
    ];
    btn.addEventListener('click', () => {
      pokes++;
      clearTimeout(pokeT);
      pokeT = setTimeout(() => { pokes = 0; }, 6000);
      const [expr, text] = lines[Math.min(pokes, lines.length) - 1];
      PLM.sfx('pop');
      PLM.host.hop();
      PLM.host.say(text, { expr, html: true, ms: 2200 });
      if (pokes >= lines.length) pokes = 0;
    });
  }

  const hostApi = (PLM.host = {
    baseExpr: 'happy',
    get svg() { return U.$('#host .pony'); },
    get bubble() { return U.$('#host .bubble'); },
    expr(e, ms) {
      const svg = this.svg;
      if (!svg) return;
      clearTimeout(this.exprT);
      if (art().setExpr) art().setExpr(svg, e); else svg.setAttribute('data-expr', e);
      if (ms) this.exprT = setTimeout(() => this.expr(this.baseExpr), ms);
    },
    setBase(e) { this.baseExpr = e; this.expr(e); },
    hop() {
      const h = U.$('#host');
      h.classList.remove('hop');
      void h.offsetWidth;
      h.classList.add('hop');
    },
    say(text, o) {
      o = o || {};
      const b = this.bubble;
      if (!b) return;
      clearTimeout(this.hideT);
      clearTimeout(this.showT);
      const plain = o.html ? text.replace(/<[^>]+>/g, '') : text;
      const ms = o.ms || U.clamp(1500 + plain.length * 52, 2300, 6000);
      const show = () => {
        if (o.html) b.innerHTML = text; else b.textContent = text;
        b.classList.remove('is-hidden');
      };
      if (!b.classList.contains('is-hidden')) {
        b.classList.add('is-hidden');
        this.showT = setTimeout(show, 150);
      } else show();
      if (o.expr) this.expr(o.expr, ms);
      this.hideT = setTimeout(() => b.classList.add('is-hidden'), ms + 150);
    },
    hush() { clearTimeout(this.hideT); const b = this.bubble; if (b) b.classList.add('is-hidden'); },
  });

  /* ---------------- music player ---------------- */
  function buildPlayer() {
    const p = U.$('#player');
    p.innerHTML = `
      <div class="ttl">${icon('music')}<span>Pastel Paddock<small>MUSIC BOX · LOOP</small></span></div>
      <div class="row">
        <button class="pbtn play" type="button" aria-label="Play music">${icon('play')}</button>
        <button class="pbtn mute" type="button" aria-pressed="false" aria-label="Mute">${icon('speaker')}</button>
        <input class="vol" type="range" min="0" max="100" step="1" value="50" aria-label="Volume">
      </div>`;
    const play = p.querySelector('.play');
    const mute = p.querySelector('.mute');
    const vol = p.querySelector('.vol');
    const A = () => PLM.audio;

    play.addEventListener('click', () => {
      if (!A()) return;
      A().init();
      A().toggleMusic();
      sync();
    });
    mute.addEventListener('click', () => {
      if (!A()) return;
      A().init();
      A().toggleMuted();
      const m = A().isMuted();
      PLM.host.say(m ? 'Muted. The pony is offended.' : 'The pony forgives you.', { expr: m ? 'pout' : 'happy', ms: 2200 });
      sync();
    });
    let slideTick = 0;
    vol.addEventListener('input', () => {
      const v = Number(vol.value) / 100;
      vol.style.setProperty('--v', vol.value + '%');
      if (!A()) return;
      A().init();
      A().setVolume(v);
      if (A().isMuted() && v > 0) A().setMuted(false);
      const now = performance.now();
      if (now - slideTick > 90) { PLM.sfx('slide'); slideTick = now; }
    });

    function sync() {
      if (!A()) return;
      const playing = A().isMusicPlaying();
      const muted = A().isMuted();
      play.innerHTML = icon(playing ? 'pause' : 'play');
      play.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
      mute.innerHTML = icon(muted ? 'speakerMute' : 'speaker');
      mute.setAttribute('aria-pressed', String(muted));
      mute.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
      p.classList.toggle('is-muted', muted);
      const v = Math.round(A().getVolume() * 100);
      if (Number(vol.value) !== v) vol.value = String(v);
      vol.style.setProperty('--v', vol.value + '%');
    }
    M.syncPlayer = sync;
    if (A() && A().onChange) A().onChange(sync);
    vol.style.setProperty("--v", "50%");
  }

  M.build = function () {
    buildWall();
    bulbs.build();
    buildStickers();
    buildDeck();
    buildHost();
    buildPlayer();
    const heart = U.$('.mq-heart');
    if (heart) heart.innerHTML = icon('heart', { size: 26 });
    if (heart) heart.style.color = 'var(--pink)';
    requestAnimationFrame(alive.loop);
  };
})(window.PLM = window.PLM || {});

</script>
<script>
/* nobutton.js - the No button is a creature, not a glitch.
   It lives on a spring, watches the cursor, blushes when you get close, and runs.
   It flees on proximity AND on pointerdown, so a click can never land on it. */
(function (PLM) {
  'use strict';

  const U = PLM.util;
  const W = 1440;
  const H = 900;

  function padRect(r, p) {
    return { x: r.x - p, y: r.y - p, r: r.r + p, b: r.b + p };
  }
  function overlaps(r, x, y, hw, hh) {
    return x + hw > r.x && x - hw < r.r && y + hh > r.y && y - hh < r.b;
  }

  /**
   * @param {object} o
   *  home: element marking the start spot, yes: the YES button,
   *  steps: array indexed by attempt number -> { label, caption, scale, hide, sulk, shy, dialog, host }
   *  onAttempt(n, step), onDialog(): Promise<'yes'|'close'>, onYes(), onFired(),
   *  hideCloud(show:boolean): shows the hiding cloud and returns its stage rect
   */
  function mount(o) {
    const roam = U.$('#roam');
    const btn = U.el('button', { class: 'nobtn', type: 'button', 'aria-label': 'No (unavailable, sorry)' });
    btn.innerHTML = '<span class="nb-body"><span class="nb-label">No</span><span class="nb-blush l"></span><span class="nb-blush r"></span></span>'
      + '<span class="nb-eyes" aria-hidden="true"><span class="nb-eye"><i></i></span><span class="nb-eye"><i></i></span></span>';
    roam.append(btn);
    const label = btn.querySelector('.nb-label');
    const pupils = btn.querySelectorAll('.nb-eye i');

    const home = PLM.stage.rectOf(o.home);
    const sp = new U.Spring2D({ k: 260, c: 18, x: home.cx, y: home.cy });
    let w = btn.offsetWidth || 112;
    let h = btn.offsetHeight || 52;
    let n = 0;
    let scale = 1;
    let targetScale = 1;
    let state = 'idle'; // idle | running | hidden | frozen | gone
    let lastFlee = 0;
    let lastAttempt = 0;
    let kbTries = 0;
    let raf = 0;
    let last = performance.now();
    const t0 = performance.now();

    U.animate(btn, [{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: 'ease', fill: 'backwards' });

    function setLabel(html) {
      if (label.innerHTML === html) return;
      label.innerHTML = html;
      // the button resizes to the new words; re-measure so it stays centred on its spring
      w = btn.offsetWidth;
      h = btn.offsetHeight;
      if (!U.reduced()) {
        U.animate(label, [{ opacity: 0, filter: 'blur(3px)' }, { opacity: 1, filter: 'blur(0px)' }], { duration: 200, easing: 'cubic-bezier(.23,1,.32,1)' });
      }
    }

    function render() {
      const v = sp.speed;
      const reduced = U.reduced();
      const sq = reduced ? 0 : Math.min(v / 2600, 0.2);
      const ang = (Math.atan2(sp.vy, sp.vx) * 180) / Math.PI;
      const x = sp.x - w / 2;
      const y = sp.y - h / 2;
      btn.style.transform = sq > 0.004
        ? `translate(${x}px, ${y}px) rotate(${ang}deg) scale(${1 + sq}, ${1 - sq}) rotate(${-ang}deg) scale(${scale})`
        : `translate(${x}px, ${y}px) scale(${scale})`;
    }

    function avoidRects() {
      const list = [];
      if (o.yes && o.yes.isConnected) list.push(padRect(PLM.stage.rectOf(o.yes), 46));
      const player = U.$('#player');
      if (player) list.push(padRect(PLM.stage.rectOf(player), 22));
      const host = U.$('#host .host-pony');
      if (host) list.push(padRect(PLM.stage.rectOf(host), -30));
      return list;
    }

    function pickTarget(px, py) {
      const hw = (w * scale) / 2 + 6;
      const hh = (h * scale) / 2 + 18; // eyes poke above
      const zone = { x0: 34 + hw, x1: W - 34 - hw, y0: 40 + hh, y1: H - 26 - hh };
      const avoid = avoidRects();
      const travel = n <= 3 ? 230 : n <= 6 ? 360 : 440;
      let best = null;
      let bestScore = -Infinity;
      for (let i = 0; i < 64; i++) {
        const x = U.rand(zone.x0, zone.x1);
        const y = U.rand(zone.y0, zone.y1);
        if (avoid.some((r) => overlaps(r, x, y, hw, hh))) continue;
        const dp = Math.hypot(x - px, y - py);
        if (dp < 300) continue;
        const dm = Math.hypot(x - sp.x, y - sp.y);
        const score = Math.min(dp, 620) - Math.abs(dm - travel) * 0.6 + U.rand(0, 90);
        if (score > bestScore) { bestScore = score; best = { x, y }; }
      }
      if (!best) {
        // cornered: hop to the far side of the stage
        best = {
          x: U.clamp(W - px, zone.x0, zone.x1),
          y: U.clamp(H - py, zone.y0, zone.y1),
        };
      }
      return best;
    }

    function sparkleAt(x, y) {
      U.burst(x, y, { count: 4, kinds: ['sparkle'], spread: 50, size: [10, 16], dur: [500, 800], fall: 8 });
    }

    function attempt() {
      if (performance.now() - t0 > 45000 && n >= 3 && n < 9) n = 9; // it calls for backup
      n++;
      const step = o.steps[Math.min(n, o.steps.length - 1)] || {};
      btn.classList.toggle('is-sulk', !!step.sulk);
      btn.classList.toggle('is-shy', !!step.shy);
      if (step.label) setLabel(step.label);
      if (step.scale) targetScale = step.scale;
      if (o.onAttempt) o.onAttempt(n, step);
      return step;
    }

    function moveTo(tgt, teleport) {
      if (teleport || U.reduced()) {
        sparkleAt(sp.x, sp.y);
        PLM.sfx('sparkle');
        U.animate(btn, [{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' });
        sp.jump(tgt.x, tgt.y);
      } else {
        sparkleAt(sp.x, sp.y);
        sp.set(tgt.x, tgt.y);
      }
    }

    async function flee(px, py, hard) {
      if (state === 'frozen' || state === 'gone') return;
      const now = performance.now();
      lastFlee = now;
      let step = null;
      if (now - lastAttempt > 380) {
        lastAttempt = now;
        step = attempt();
      }
      if (step && step.dialog) {
        state = 'frozen';
        btn.classList.remove('is-near');
        PLM.sfx('ding');
        const res = o.onDialog ? await o.onDialog() : 'yes';
        if (res === 'close') fire();
        return;
      }
      if (state === 'hidden' && o.hideCloud) {
        // leaving the cloud: it keeps the cloud there for the vibes
      }
      state = 'running';
      PLM.sfx('boing', Math.min(n, 10));
      if (step && step.hide && o.hideCloud) {
        const c = o.hideCloud(true);
        if (c) {
          state = 'hidden';
          moveTo({ x: c.r - 8, y: c.cy + 6 }, false);
          return;
        }
      }
      const tgt = pickTarget(px, py);
      moveTo(tgt, hard && n >= 4);
      if (step && step.sulk) {
        U.animate(btn.querySelector('.nb-body'), [
          { transform: 'rotate(0deg)' }, { transform: 'rotate(-7deg)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(-3deg)' }, { transform: 'rotate(0deg)' },
        ], { duration: 520, delay: 380, easing: 'ease-in-out' });
        PLM.sfx('bonk');
      }
    }

    function fire() {
      state = 'gone';
      cancelAnimationFrame(raf);
      const x = sp.x - w / 2;
      const y = sp.y - h / 2;
      PLM.sfx('trombone');
      const a = U.reduced()
        ? U.animate(btn, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' })
        : U.animate(btn, [
          { transform: `translate(${x}px, ${y}px) scale(${scale}) rotate(0deg)` },
          { transform: `translate(${x}px, ${y - 40}px) scale(${scale}) rotate(-12deg)`, offset: 0.25, easing: 'cubic-bezier(.55,0,1,.45)' },
          { transform: `translate(${x + 30}px, ${H + 120}px) scale(${scale}) rotate(40deg)` },
        ], { duration: 900, easing: 'linear', fill: 'forwards' });
      a.finished.then(() => btn.remove());
      if (o.onFired) o.onFired();
    }

    function tick(t) {
      const dt = Math.min((t - last) / 1000, 0.05);
      last = t;
      scale = U.lerp(scale, targetScale, 0.16);
      if (state !== 'gone') {
        const p = PLM.pointer;
        const d = Math.hypot(p.x - sp.x, p.y - sp.y);
        const R = (118 + Math.min(n, 8) * 8) * Math.max(scale, 0.72);
        if (state !== 'frozen') {
          btn.classList.toggle('is-near', p.active && d < R * 1.8);
          if (p.active && p.type !== 'touch' && d < R && t - lastFlee > 140) flee(p.x, p.y, false);
        }
        const a = Math.atan2(p.y - sp.y, p.x - sp.x);
        const m = p.active ? 3.5 : 0;
        const tx = (Math.cos(a) * m).toFixed(2);
        const ty = (Math.sin(a) * m).toFixed(2);
        pupils.forEach((pp) => { pp.style.transform = `translate(${tx}px, ${ty}px)`; });
        sp.step(dt);
        render();
        raf = requestAnimationFrame(tick);
      }
    }
    raf = requestAnimationFrame(tick);

    // A press that somehow reaches it: it bolts before the click can complete.
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const p = PLM.stage.toStage(e.clientX, e.clientY);
      flee(p.x, p.y, true);
    });
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      if (state === 'gone' || state === 'frozen') return;
      PLM.host.say('That click didn’t count. The judges reviewed the footage.', { expr: 'smug' });
      flee(PLM.pointer.x, PLM.pointer.y, true);
    });
    // Keyboard: focusing it makes it hop away and hand focus to YES.
    btn.addEventListener('focus', () => {
      if (state === 'gone' || state === 'frozen') return;
      if (!btn.matches(':focus-visible')) return;
      kbTries++;
      flee(sp.x, sp.y, true);
      if (o.yes) o.yes.focus();
      if (kbTries >= 3) {
        btn.tabIndex = -1;
        PLM.host.say('The No button has left the tab order.', { expr: 'smug' });
      } else {
        PLM.host.say('Tab-tab-tab. Hacker.', { expr: 'smug' });
      }
    });

    return {
      el: btn,
      get attempts() { return n; },
      fire,
      destroy() {
        state = 'gone';
        cancelAnimationFrame(raf);
        U.animate(btn, [{ opacity: 1 }, { opacity: 0, transform: btn.style.transform + ' scale(.9)' }], { duration: 180, fill: 'forwards' })
          .finished.then(() => btn.remove());
      },
    };
  }

  PLM.noButton = { mount };
})(window.PLM = window.PLM || {});

</script>
<script>

  // She lands Thursday night (26 Nov 2026) and stays until Sunday.

  const TIMES = [

  const clingWord = (v) => (v >= 95 ? 'surgically attached' : v >= 85 ? 'full koala' : v >= 70 ? 'koala-adjacent' : 'clingy');
  const slotText = (slot) => {
    if (!slot) return '';
    const d = DAYS.find((x) => x.id === slot.day);
    const t = TIMES.find((x) => x.id === slot.time);
    return [d && d.short + ' Nov', t && t.label.toLowerCase()].filter(Boolean).join(' · ');
  };

  PLM.data = { PLANS, DAYS, TIMES, clingWord, slotText, byId: (id) => PLANS.find((p) => p.id === id) };

  const serial = '520-1314-XM-' + String(Math.floor(Math.random() * 100)).padStart(2, '0');
  PLM.state = PLM.state || {};
  Object.assign(PLM.state, { serial, plans: [], schedule: {}, clingy: 75, payer: 'Amine' });

  /* ---------------- ticket artwork ---------------- */
  let uid = 0;
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const F_DISPLAY = "DynaPuff, 'ZCOOL KuaiLe', sans-serif";
  const F_BODY = "'Zen Maru Gothic', 'ZCOOL KuaiLe', sans-serif";
  const F_CN = "'ZCOOL KuaiLe', DynaPuff, sans-serif";
  const F_DOT = "DotGothic16, 'ZCOOL KuaiLe', monospace";

  /* The QR opens a tiny password page ("I love you"), which then opens
     美团外卖 if she picked 外卖 & Chill, otherwise 高德地图 at her first date's spot.
     That page lives at UNLOCK_BASE (see landing/ and README). */
  const UNLOCK_BASE = (PLM.config && PLM.config.unlockBase) || 'https://smallklaus.github.io/plm/key/';
  const DAY_ORDER = { thu: 0, fri: 1, sat: 2, sun: 3 };
  const TIME_ORDER = { afternoon: 0, golden: 1, late: 2 };

  function qrText(s) {
    if (s.plans.includes('waimai')) return UNLOCK_BASE + '#waimai';
    const rank = (id) => {
      const sl = (s.schedule && s.schedule[id]) || {};
      return (DAY_ORDER[sl.day] == null ? 9 : DAY_ORDER[sl.day]) * 10 + (TIME_ORDER[sl.time] == null ? 9 : TIME_ORDER[sl.time]);
    };
    const first = s.plans.slice().sort((a, b) => rank(a) - rank(b))[0] || 'westlake';
    return UNLOCK_BASE + '#map-' + first;
  }

  function nestSvg(markup, x, y, w, h) {
    if (!markup) return '';
    // place a returned <svg> at x,y with a fixed width/height
    return markup.replace(/<svg\b([^>]*)>/, (m, attrs) => {
      const cleaned = attrs.replace(/\s(width|height|x|y)="[^"]*"/g, '');
      return `<svg${cleaned} x="${x}" y="${y}" width="${w}" height="${h == null ? w : h}">`;
    });
  }

  function build(s) {
    const id = ++uid;
    const u = (k) => `tk${id}-${k}`;
    const plans = s.plans.map((pid) => PLM.data.byId(pid));

    // perforation holes
    let holes = '';
    let holeRings = '';
    for (let y = 34; y <= 428; y += 16) {
      holes += `<circle cx="700" cy="${y}" r="4.6" fill="#000"/>`;
      holeRings += `<circle cx="700" cy="${y}" r="4.6" fill="none" stroke="#3A1A26" stroke-width="1.4" opacity=".55"/>`;
    }
    // guilloche waves
    let waves = '';
    for (let k = 0; k < 6; k++) {
      const y0 = 150 + k * 54;
      const amp = 9 + k * 2;
      const f = 0.017 + k * 0.0026;
      let d = '';
      for (let x = -10; x <= 710; x += 10) d += (x === -10 ? 'M' : 'L') + x + ' ' + (y0 + Math.sin(x * f + k * 1.7) * amp).toFixed(1);
      waves += `<path d="${d}" fill="none" stroke="#F2C94C" stroke-width="1.4" opacity=".75"/>`;
    }
    const band = ['#FF6FAE', '#FFA96B', '#FFE066', '#66E3B4', '#6CC8FF']
      .map((c, i) => `<rect x="0" y="${i * 4}" width="700" height="4" fill="${c}"/>`).join('');

    // plan rows
    const rows = plans.map((p, i) => {
      const y = 172 + i * 54;
      const mark = art().mark ? nestSvg(art().mark(p.id, { size: 46, diecut: false }), 44, y, 46) : '';
      const when = slotText(s.schedule && s.schedule[p.id]) || p.ticketSub;
      return `${mark}
        <text x="104" y="${y + 22}" font-family="${F_DISPLAY}" font-weight="600" font-size="21" fill="#3A1A26">${esc(p.ticket)}</text>
        <text x="104" y="${y + 42}" font-family="${F_DOT}" font-size="14.5" fill="#C2185B">${esc(when)}</text>`;
    }).join('');

    const entry = (x, y, labelText, value) => `
      <text x="${x}" y="${y}" font-family="${F_DOT}" font-size="13" letter-spacing="1.6" fill="#C2185B">${esc(labelText)}</text>
      <text x="${x}" y="${y + 21}" font-family="${F_DOT}" font-size="17" fill="#3A1A26">${esc(value)}</text>`;

    // short URL + level M + no centre hole = a sparse code that phone scanners (WeChat included) read easily
    const qr = PLM.qr && PLM.qr.svg ? nestSvg(PLM.qr.svg(qrText(s), { size: 184, ecc: 'M', margin: 3, fg: '#3A1A26', bg: '#FFFBFD', label: 'QR code: scan it with your phone' }), 726, 104, 184) : '';
    // the peek's forelegs grip an edge at 164/182 of its height: put that edge on the ticket's top edge
    const PW = 124;
    const PH = (PW * 182) / 200;
    const peek = art().ponyPeek ? nestSvg(art().ponyPeek({ size: PW, expr: 'happy' }), 818 - PW / 2 - 8, -(PH * 164) / 182 + 3, PW, PH) : '';
    const aria = `Date voucher number ${s.serial}. Holder 徐梦. Good for: ${plans.map((p) => p.ticket + ' (' + slotText(s.schedule && s.schedule[p.id]) + ')').join(', ')}. Valid in Hangzhou from the moment you land. Never expires.`;

    return `<svg class="ticket" xmlns="http://www.w3.org/2000/svg" viewBox="0 -70 960 530" width="960" height="530" role="img" aria-label="${esc(aria)}">
  <defs>
    <mask id="${u('cut')}" maskUnits="userSpaceOnUse" x="-20" y="-20" width="1000" height="500">
      <rect x="-20" y="-20" width="1000" height="500" fill="#fff"/>
      <circle cx="700" cy="0" r="19" fill="#000"/><circle cx="700" cy="460" r="19" fill="#000"/>
      ${holes}
    </mask>
    <clipPath id="${u('body')}"><path d="M26 0H700V460H26A26 26 0 0 1 0 434V26A26 26 0 0 1 26 0Z"/></clipPath>
    <pattern id="${u('pat')}" width="58" height="58" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <path d="M14 22s-6-3.6-6-8a3.4 3.4 0 0 1 6-2 3.4 3.4 0 0 1 6 2c0 4.4-6 8-6 8z" fill="#F2C94C"/>
      <path d="M38 52v-9a6 6 0 0 1 12 0v9" fill="none" stroke="#F2C94C" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <filter id="${u('ink')}" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="${u('circ')}" d="M579 100a47 47 0 1 1 94 0a47 47 0 1 1 -94 0"/>
  </defs>

  <g mask="url(#${u('cut')})">
    <rect x="0" y="0" width="960" height="460" rx="26" fill="#FFEB85"/>
    <g clip-path="url(#${u('body')})">
      <rect width="700" height="460" fill="url(#${u('pat')})" opacity=".6"/>
      ${waves}
      ${band}
    </g>
    <path d="M700 0H934A26 26 0 0 1 960 26V434A26 26 0 0 1 934 460H700Z" fill="#FF6FAE"/>
    <rect x="2.5" y="2.5" width="955" height="455" rx="24" fill="none" stroke="#3A1A26" stroke-width="5"/>
  </g>
  <path d="M681 0a19 19 0 0 0 38 0M681 460a19 19 0 0 1 38 0" fill="none" stroke="#3A1A26" stroke-width="4"/>
  ${holeRings}

  <text x="44" y="82" font-family="${F_DISPLAY}" font-weight="700" font-size="46" fill="#3A1A26">DATE VOUCHER<tspan dx="14" font-family="${F_CN}" font-weight="400" font-size="32" fill="#C2185B">约会兑换券</tspan></text>
  <text x="44" y="114" font-family="${F_BODY}" font-weight="700" font-size="19" fill="#C2185B">One date with Amine. Valid for one (1) 徐梦.</text>
  <line x1="44" y1="134" x2="672" y2="134" stroke="#3A1A26" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round" opacity=".55"/>

  <text x="44" y="160" font-family="${F_DOT}" font-size="13" letter-spacing="1.6" fill="#C2185B">GOOD FOR</text>
  ${rows}

  ${entry(404, 160, 'HOLDER', '徐梦 (Babe)')}
  ${entry(404, 200, 'ISSUED BY', 'Amine (bro, buddy, boyfriend)')}
  ${entry(404, 240, 'HER STAY', 'Thu 26 → Sun 29 Nov')}
  ${entry(404, 280, 'CLINGINESS', s.clingy + '% · ' + clingWord(s.clingy))}
  ${entry(404, 320, 'PAID BY', 'Amine (non-negotiable)')}

  <line x1="44" y1="346" x2="672" y2="346" stroke="#3A1A26" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round" opacity=".55"/>
  ${entry(44, 370, 'VALID', 'Hangzhou, from the moment you land')}
  ${entry(404, 370, 'EXPIRES', 'never · 永久有效')}
  <text x="44" y="420" font-family="${F_BODY}" font-weight="700" font-size="12.5" fill="#3A1A26" opacity=".78">Non-transferable, especially to other boyfriends. Can be combined with hugs and 奶茶.</text>
  <text x="44" y="438" font-family="${F_BODY}" font-weight="700" font-size="12.5" fill="#3A1A26" opacity=".78">Holder may change the plan, not the boyfriend. If Amine is late, Amine buys dessert.</text>

  <rect x="718" y="96" width="200" height="200" rx="18" fill="#FFFBFD" stroke="#3A1A26" stroke-width="4"/>
