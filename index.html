:root {
  --pink: #FF6FAE; --sky: #9ADCFF; --glass: #E6FFF5; --butter: #FFE066; --milk: #FFFBFD;
  --ink: #3A1A26; --rasp: #C2185B; --stamp: #E0335F; --ink-60: rgba(58, 26, 38, .62);
  --display: "DynaPuff", "ZCOOL KuaiLe", ui-rounded, system-ui, sans-serif;
  --body: "Zen Maru Gothic", "ZCOOL KuaiLe", ui-rounded, system-ui, sans-serif;
  --cn: "ZCOOL KuaiLe", "DynaPuff", system-ui, sans-serif;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--body); font-weight: 700; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 110px 18px 36px; }
::selection { background: var(--butter); color: var(--ink); }
.card {
  position: relative; z-index: 1; width: min(400px, 100%); padding: 34px 22px 24px; text-align: center;
  background: var(--milk); border: 4px solid var(--ink); border-radius: 30px; box-shadow: 0 10px 0 rgba(58, 26, 38, .18);
}
.peek { position: absolute; left: 50%; top: -110px; width: 156px; margin-left: -78px; }
.peek svg { display: block; width: 100%; height: auto; }
h1 { margin: 6px 0 8px; font-family: var(--display); font-size: 31px; line-height: 1.06; letter-spacing: -.01em; text-wrap: balance; }
h1:focus, h1:focus-visible { outline: none; }
.sub { margin: 0 0 18px; font-size: 16px; line-height: 1.45; color: var(--rasp); text-wrap: pretty; }
.cn { font-family: var(--cn); font-weight: 400; }
form { display: grid; gap: 12px; }
input {
  width: 100%; padding: 14px 16px; font: inherit; font-family: var(--display); font-size: 20px; text-align: center;
  color: var(--ink); background: var(--glass); border: 4px solid var(--ink); border-radius: 18px; outline: none; caret-color: var(--pink);
  -webkit-appearance: none; appearance: none;
}
input:focus { background: #fff; box-shadow: 0 0 0 4px var(--butter); }
input::placeholder { color: var(--ink-60); font-family: var(--body); font-weight: 700; font-size: 16px; }
button, .btn { font: inherit; cursor: pointer; }
.go, .btn {
  display: block; width: 100%; padding: 13px 18px; text-decoration: none; text-align: center;
  font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.15; color: var(--ink);
  background: var(--milk); border: 4px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink);
  transition: transform 120ms var(--ease-out), box-shadow 120ms var(--ease-out);
}
.go, .btn.primary { background: var(--butter); }
.go:active, .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.go:focus-visible, .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.err { min-height: 22px; margin: 12px 0 0; font-size: 15px; line-height: 1.35; color: var(--stamp); }
.shake { animation: shake 380ms var(--ease-out); }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
[hidden] { display: none !important; }
.mark { width: 92px; margin: 0 auto 4px; }
.mark svg { display: block; width: 100%; height: auto; }
.wx { margin: 0 0 16px; padding: 11px 12px; font-size: 14px; line-height: 1.5; text-align: left; background: var(--glass); border: 3px dashed var(--ink-60); border-radius: 14px; }
.btns { display: grid; gap: 12px; }
.fine { margin: 16px 0 0; font-size: 13px; color: var(--ink-60); }
.hearts { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.hearts span { position: absolute; bottom: -40px; width: 26px; animation: rise linear forwards; }
.hearts svg { display: block; width: 100%; height: auto; }
@keyframes rise { 0% { transform: translateY(0) rotate(0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translateY(-110vh) rotate(var(--r)); opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .shake, .hearts span { animation: none; } .hearts { display: none; } .go, .btn { transition: none; } }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="peek" id="peek" aria-hidden="true"></div>
  <section class="lock" id="lock">
    <h1>Password, Babe.</h1>
    <p class="sub">This voucher is locked. Three words. You know them.</p>
    <form id="form" autocomplete="off" novalidate>
      <input id="pw" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="type the password" aria-label="Password">
      <button class="go" type="submit">Unlock</button>
    </form>
    <p class="err" id="err" role="alert"></p>
  </section>
  <section class="open" id="open" hidden>
    <div class="mark" id="mark" aria-hidden="true"></div>
    <h1 id="openTitle" tabindex="-1">Unlocked. I love you too.</h1>
    <p class="sub" id="msg"></p>
    <p class="wx" id="wx" hidden>WeChat won’t let me open other apps. Tap <b>···</b> in the top right → <b class="cn">在浏览器打开</b>, then say the password again. Or use the web button below.</p>
    <div class="btns" id="btns"></div>
    <p class="fine">Valid in Hangzhou from the moment you land. Never expires.</p>
  </section>
</main>
<div class="hearts" id="hearts" aria-hidden="true"></div>

  var dest = /^map-/.test(hash) ? { kind: 'map', plan: hash.slice(4) } : { kind: 'waimai' };

  var PLACES = {
    westlake: { kw: '苏堤', html: 'the Su Causeway <span class="cn">苏堤</span>' },
    hotpot: { kw: '火锅', html: 'hotpot <span class="cn">火锅</span>, as spicy as you want' },
    claw: { kw: '抓娃娃', html: 'the claw machines <span class="cn">抓娃娃</span>' },
    hefang: { kw: '河坊街', html: 'Hefang Street <span class="cn">河坊街</span>' },
    surprise: { kw: '西湖', html: 'somewhere near West Lake. That’s all you get.' }
  };
  var H5_WAIMAI = 'https://h5.waimai.meituan.com/waimai/mindex/home';
  function amapWeb(kw) { return 'https://uri.amap.com/search?keyword=' + encodeURIComponent(kw) + '&city=330100&view=map&src=ponylove&coordinate=gaode&callnative=1'; }
  function amapApp(kw) {
    return isIOS
      ? 'iosamap://poi?sourceApplication=ponylove&name=' + encodeURIComponent(kw) + '&dev=0'
      : 'androidamap://poi?sourceApplication=ponylove&keywords=' + encodeURIComponent(kw) + '&dev=0';
  }

  var $ = function (id) { return document.getElementById(id); };
  $('peek').innerHTML = PEEK.smug || '';

  function go(url) {
    if (test) { window.__visits.push(url); return; }
    window.location.href = url;
  }
  // try app links in order; stop as soon as the page loses focus (an app opened)
  function tryChain(urls) {
    var left = false;
    var mark = function () { left = true; };
    document.addEventListener('visibilitychange', function () { if (document.hidden) mark(); });
    window.addEventListener('pagehide', mark);
    var i = 0;
    (function next() {
      if (left || i >= urls.length) return;
      go(urls[i++]);
      if (i < urls.length) setTimeout(function () { if (!left && !document.hidden) next(); }, 1700);
    })();
  }

  function button(label, primary, onClick) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn' + (primary ? ' primary' : '');
    b.innerHTML = label;
    b.addEventListener('click', onClick);
    $('btns').appendChild(b);
    return b;
  }

  function hearts() {
    var box = $('hearts');
    var colors = ['#FF6FAE', '#FFA96B', '#FFE066', '#66E3B4', '#6CC8FF', '#FFFBFD'];
    for (var i = 0; i < 18; i++) {
      var s = document.createElement('span');
      s.style.left = (4 + Math.random() * 92) + '%';
      s.style.animationDuration = (2.6 + Math.random() * 2.4) + 's';
      s.style.animationDelay = (i * 0.09 + Math.random() * 0.2) + 's';
      s.style.setProperty('--r', (Math.random() * 80 - 40) + 'deg');
      s.style.width = (18 + Math.random() * 18) + 'px';
      s.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 21.2s-8-4.9-8-10.6A4.5 4.5 0 0 1 12 8a4.5 4.5 0 0 1 8 2.6c0 5.7-8 10.6-8 10.6z" fill="' + colors[i % colors.length] + '" stroke="#3A1A26" stroke-width="1.8" stroke-linejoin="round"/></svg>';
      box.appendChild(s);
    }
  }

  function unlock() {
    $('lock').hidden = true;
    $('open').hidden = false;
    $('peek').innerHTML = PEEK.love || '';
    hearts();
    if (dest.kind === 'waimai') {
      $('mark').innerHTML = MARKS.waimai || '';
      $('msg').innerHTML = 'Opening <span class="cn">美团外卖</span>… order something cute. It’s on me.';
      if (!isWeChat) {
        button('Open <span class="cn">美团外卖</span>', true, function () { tryChain(['meituanwaimai://']); });
        button('Open the <span class="cn">美团</span> app', false, function () { tryChain(['imeituan://']); });
      }
      button('Order on the web', isWeChat, function () { go(H5_WAIMAI); });
      if (isPhone && !isWeChat) setTimeout(function () { tryChain(['meituanwaimai://', 'imeituan://', H5_WAIMAI]); }, 900);
    } else {
      var place = PLACES[dest.plan] || PLACES.westlake;
      $('mark').innerHTML = MARKS[dest.plan] || MARKS.westlake || '';
      $('msg').innerHTML = 'Opening <span class="cn">高德地图</span> → ' + place.html + '. See you there.';
      if (!isWeChat) button('Open <span class="cn">高德地图</span>', true, function () { tryChain([amapApp(place.kw), amapWeb(place.kw)]); });
      button('Open the web map', isWeChat, function () { go(amapWeb(place.kw)); });
      if (isPhone && !isWeChat) setTimeout(function () { tryChain([amapApp(place.kw), amapWeb(place.kw)]); }, 900);
    }
    $('wx').hidden = !isWeChat;
    setTimeout(function () { $('openTitle').focus(); }, 50);
  }

  var WRONG = [
    'Nope. Try again.',
    'Close? Not even close.',
    'Hint: it starts with “I”.',
    'Hint: you say it before you fall asleep.',
    'It works in Chinese too, Babe.'
  ];
  var tries = 0;
  function ok(v) {
    var t = String(v || '').toLowerCase().replace(/[^a-z一-鿿]/g, '');
    return t === 'iloveyou' || t === '我爱你';
  }
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('pw').value;
    if (ok(v)) { unlock(); return; }
    $('err').textContent = WRONG[Math.min(tries, WRONG.length - 1)];
    tries++;
    $('peek').innerHTML = PEEK.pout || PEEK.smug || '';
    var card = $('card');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    $('pw').select();
  });
})();
</script>
</body>
</html>
