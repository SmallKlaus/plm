  const MIN_GAP = { hover: 80, slide: 60, type: 22, chirp: 30, boing: 90, click: 30, sparkle: 60, pop: 40 };
  const WET = { coin: 1, sparkle: 1, yes: 1, harp: 1, twinkle: 1, fanfare: 1, ding: 1 };

  /* ---------------- the graph ---------------- */
  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx = null;
  let master = null;
  let musicBus = null;
  let duckGain = null;
  let sfxBus = null;
  let reverbIn = null;
  let volume = 0.5;
  let muted = false;
  let playing = false;
  let wasPlayingBeforeHide = false;
  let timer = null;
  let nextTime = 0;
  let bar = 0;
  let slot = 0;
  let live = [];
  const lastPlayed = {};
  const listeners = new Set();

  const volCurve = (v) => 1.5 * Math.pow(Math.max(0, Math.min(1, v)), 1.7);

  function makeReverb(ac, seconds) {
    const len = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) {
        const k = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - k, 2.6) * (i < ac.sampleRate * 0.012 ? i / (ac.sampleRate * 0.012) : 1);
      }
    }
    const cv = ac.createConvolver();
    cv.buffer = buf;
    return cv;
  }

  /** build the whole chain on any context (live or offline) */
  function buildGraph(ac) {
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12;
    comp.knee.value = 10;
    comp.ratio.value = 5;
    comp.attack.value = 0.004;
    comp.release.value = 0.2;
    comp.connect(ac.destination);
    const m = gainNode(ac, comp, volCurve(volume));
    const duck = gainNode(ac, m, 1);
    const music = gainNode(ac, duck, 0.75);
    const sfx = gainNode(ac, m, 0.9);
    const rv = makeReverb(ac, 2.2);
    const rvIn = gainNode(ac, null, 0.32);
    rvIn.connect(rv);
    rv.connect(duck);
    return { master: m, duck, music, sfx, reverbIn: rvIn };
  }

  function emit() {
    const s = { playing, muted, volume };
    listeners.forEach((fn) => { try { fn(s); } catch (e) { /* ui */ } });
  }

  /* ---------------- scheduler ---------------- */
  function scheduleSlot(ac, outMusic, send, b, s, t, keep) {
    const bdef = SCORE[b];
    const ch = CHORDS[bdef.chord];
    const human = () => rnd(-0.004, 0.006);
    if (s === 0) {
      const o = pad(ac, outMusic, t, ch.pad, EIGHTH * 8);
      if (keep) keep.push(...o);
    }
    if (s === 0 || s === 4) bass(ac, outMusic, t + 0.002, ch.bass, s === 0 ? 1 : 0.8);
    bdef.mel.forEach((n) => {
      if (n[0] !== s) return;
      const vel = (n[3] || 0.72) * rnd(0.92, 1.06);
      tine(ac, outMusic, t + human(), midi(n[1]), vel * 0.26, send);
    });
    if (s === 7 && bdef.orn) bdef.orn.forEach((n, i) => glock(ac, outMusic, t + i * 0.07, midi(n), 0.07, send));
  }

  function tick() {
    if (!ctx || !playing) return;
    const ahead = ctx.currentTime + 0.14;
    while (nextTime < ahead) {
      scheduleSlot(ctx, musicBus, reverbIn, bar, slot, nextTime, live);
      nextTime += EIGHTH;
      slot++;
      if (slot > 7) { slot = 0; bar = (bar + 1) % SCORE.length; }
    }
    const now = ctx.currentTime;
    if (live.length > 60) live = live.filter((o) => o._end == null || o._end > now);
  }

  function startScheduler() {
    nextTime = ctx.currentTime + 0.06;
    clearInterval(timer);
    timer = setInterval(tick, 25);
    tick();
  }
  function stopScheduler() {
    clearInterval(timer);
    timer = null;
    const now = ctx ? ctx.currentTime : 0;
    live.forEach((o) => { try { o.stop(now + 0.35); } catch (e) { /* already stopped */ } });
    live = [];
  }

  /* ---------------- public API ---------------- */
  const api = {
    init() {
      if (!AC) return false;
      try {
        if (!ctx) {
          ctx = new AC();
          const g = buildGraph(ctx);
          master = g.master;
          duckGain = g.duck;
          musicBus = g.music;
          sfxBus = g.sfx;
          reverbIn = g.reverbIn;
          master.gain.value = muted ? 0 : volCurve(volume);
          document.addEventListener('visibilitychange', () => {
            if (!ctx) return;
            if (document.hidden) {
              wasPlayingBeforeHide = playing;
              if (playing) { stopScheduler(); }
              ctx.suspend().catch(() => {});
            } else {
              ctx.resume().catch(() => {});
              if (wasPlayingBeforeHide && playing) startScheduler();
            }
          });
        }
        // 'suspended' (no tap yet) or iOS's 'interrupted' (after a call or a screen lock): a tap brings it back
        if (ctx.state !== 'running' && ctx.state !== 'closed') ctx.resume().catch(() => {});
        return true;
      } catch (e) {
        return false;
      }

    playMusic() {

    return /MicroMessenger|WeChat|WeiBo|QQ\/|MQQBrowser|DingTalk|AlipayClient|FBAN|FBAV|Instagram|Line\/|Twitter|TikTok|BytedanceWebview|; wv\)/i.test(ua);
  }

  let styleInjected = false;
  function injectStyle() {
    if (styleInjected || document.getElementById('plm-export-style')) return;
    styleInjected = true;
    const s = document.createElement('style');
    s.id = 'plm-export-style';
    s.textContent =
      '.plm-export-dialog::backdrop{background:rgba(58,26,38,.55)}' +
      '.plm-export-dialog{animation:plm-export-in .22s cubic-bezier(.16,1,.3,1)}' +
      '@keyframes plm-export-in{from{opacity:0;transform:translateY(10px) scale(.96)}}' +
      '.plm-export-dialog button:focus-visible,.plm-export-dialog a:focus-visible{outline:3px solid #C2185B;outline-offset:3px}' +
      '.plm-export-dialog button:active{transform:translateY(3px);box-shadow:0 1px 0 #3A1A26}' +
      '@media (prefers-reduced-motion:reduce){.plm-export-dialog{animation:none}}';
    document.head.appendChild(s);
  }

  let current = null;
  /** Show the PNG in a modal so it can be saved by right-click / long-press. Returns the dialog. */
  function showImageFallback(blob, options) {
    const o = options || {};
    if (current) current.close();
    injectStyle();
    const title = o.title || 'Your ticket';
    const hint = o.hint || 'Right-click the picture and choose “Save image as…”. On a phone, long-press it.';
    const uid = 'plm-x-' + Math.random().toString(36).slice(2, 8);
    const opener = document.activeElement;
    const objectUrl = URL.createObjectURL(blob);

    const dlg = document.createElement('dialog');
    dlg.className = 'plm-export-dialog';
    dlg.setAttribute('aria-labelledby', uid + '-t');
    dlg.setAttribute('aria-describedby', uid + '-h');
    dlg.setAttribute('data-plm-allow-contextmenu', '');
    dlg.style.cssText =
      'box-sizing:border-box;max-width:min(92vw,980px);max-height:92vh;overflow:auto;padding:20px 22px 18px;' +
      'border:3px solid #3A1A26;border-radius:24px;background:#FFFBFD;color:#3A1A26;text-align:center;' +
      'box-shadow:0 8px 0 #E0458C,0 22px 50px rgba(58,26,38,.35);color-scheme:light;' +
      'font-family:"Zen Maru Gothic","DynaPuff",system-ui,sans-serif';

    const h = document.createElement('h2');
    h.id = uid + '-t';
    h.textContent = title;
    h.style.cssText = 'margin:0 0 14px;font:700 24px/1.2 "DynaPuff","Zen Maru Gothic",system-ui,sans-serif;color:#3A1A26';

    const img = document.createElement('img');
    img.alt = o.alt || title;
    img.src = objectUrl;
    // WeChat-style webviews save long-pressed images from data: URLs, not blob: URLs.
    blobToDataURL(blob).then((d) => { if (!closed) img.src = d; }, () => {});
    img.draggable = true;
    img.style.cssText =
      'display:block;margin:0 auto;max-width:100%;max-height:64vh;width:auto;height:auto;border-radius:14px;' +
      'background:#FFFBFD;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;pointer-events:auto';

    const p = document.createElement('p');
    p.id = uid + '-h';
    p.textContent = hint;
    p.style.cssText = 'margin:14px auto 16px;max-width:46ch;font:500 16px/1.5 "Zen Maru Gothic",system-ui,sans-serif;color:#3A1A26';

    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = o.closeLabel || 'Close';
    btn.style.cssText =
      'font:700 17px/1 "DynaPuff","Zen Maru Gothic",system-ui,sans-serif;color:#3A1A26;background:#FFE066;' +
      'border:3px solid #3A1A26;border-radius:999px;padding:11px 24px;cursor:pointer;box-shadow:0 4px 0 #3A1A26;' +
      'transition:transform .12s cubic-bezier(.23,1,.32,1),box-shadow .12s cubic-bezier(.23,1,.32,1)';
    row.appendChild(btn);
    if (o.filename) {
      const a = document.createElement('a');
      a.href = objectUrl;
      a.download = o.filename;
      a.textContent = o.downloadLabel || 'Download PNG';
      a.style.cssText = 'font:700 16px/1 "Zen Maru Gothic",system-ui,sans-serif;color:#C2185B;text-underline-offset:3px';
      row.appendChild(a);
    }
    dlg.append(h, img, p, row);

    // Keep the app's global shortcuts and custom right-click menu away from this dialog.
    dlg.addEventListener('contextmenu', (e) => e.stopPropagation());
    dlg.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !dlg.showModal) {
        e.preventDefault();
        close();
      }
      e.stopPropagation();
    });
    dlg.addEventListener('click', (e) => {
      if (e.target !== dlg) return; // backdrop clicks land on the dialog box itself
      const r = dlg.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) close();
    });

    let closed = false;
    function cleanup() {
      if (closed) return;
      closed = true;
      dlg.remove();
      setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
      if (current === api) current = null;
      if (opener && opener.focus && document.contains(opener)) opener.focus();
    }
    function close() {
      if (dlg.open && dlg.close) dlg.close();
      else cleanup();
    }
    dlg.addEventListener('close', cleanup);
    btn.addEventListener('click', close);
    const api = { close, dialog: dlg };
    current = api;

    (document.body || document.documentElement).appendChild(dlg);
    if (typeof dlg.showModal === 'function') {
      dlg.showModal();
    } else {
      // Very old engines: fake a modal.
      dlg.setAttribute('open', '');
      dlg.setAttribute('role', 'dialog');
      dlg.setAttribute('aria-modal', 'true');
      dlg.style.cssText += ';position:fixed;inset:0;margin:auto;z-index:2147483647;height:fit-content';
    }
    btn.focus();
    return dlg;
  }

  /** Download where possible, otherwise show the long-press fallback. Returns which one ran. */
  function save(blob, filename, fallbackOptions) {
    const canDownload = 'download' in HTMLAnchorElement.prototype;
    if (!canDownload || isInAppBrowser()) {
      showImageFallback(blob, Object.assign({ filename: null }, fallbackOptions));
      return 'fallback';
    }
    download(blob, filename);
    return 'download';
  }

  PLM.exporter = { svgToPngBlob, download, showImageFallback, save, isInAppBrowser };
})(window.PLM = window.PLM || {});

</script>
<script>
/* hand.js - one parametric cartoon glove that can make every gesture the duel needs.
   Upright, back of the hand facing us. Fingers are separate groups pivoting at their
   base (hidden under the palm), so poses morph on springs:
   rock -> paper -> scissors -> middle (the joke) -> ily (I love you in sign language). */
(function (PLM) {
  'use strict';

  const INK = '#3A1A26';
  const MILK = '#FFFBFD';
  const KNUCKLE = 132; // y of the knuckle line (palm top edge)
  const BASE = 20; // finger length hidden under the palm
  const FOLD = 16; // visible height of a folded finger above the knuckle

  const FINGERS = [
    { id: 'index', x: 76, w: 25, len: 76 },
    { id: 'middle', x: 100, w: 26, len: 90 },
    { id: 'ring', x: 123, w: 24, len: 80 },
    { id: 'pinky', x: 142, w: 20, len: 60 },
  ];
  const THUMB = { x: 64, y: 186, w: 26, len: 56, base: 16 };

  // [extended 0|1, rotation in degrees] per digit
  const POSES = {
    rock: { thumb: [0, 10], index: [0, -3], middle: [0, -1], ring: [0, 0], pinky: [0, 1] },
    paper: { thumb: [1, -48], index: [1, -13], middle: [1, -3], ring: [1, 7], pinky: [1, 17] },
    scissors: { thumb: [0, 10], index: [1, -14], middle: [1, 9], ring: [0, 0], pinky: [0, 1] },
    middle: { thumb: [0, 10], index: [0, -3], middle: [1, 0], ring: [0, 0], pinky: [0, 1] },
    ily: { thumb: [1, -60], index: [1, -8], middle: [0, -1], ring: [0, 0], pinky: [1, 15] },
  };

  function fingerTransform(f, pose) {
    const [ext, rot] = pose;
    const s = ext ? 1 : (FOLD + BASE) / (f.len + BASE);
    return `rotate(${rot}deg) scaleY(${s.toFixed(4)})`;
  }
  function thumbTransform(pose) {
    const [ext, rot] = pose;
    // folded: slide in behind the palm so no stray sliver shows
    return ext ? `translate(0px, 0px) rotate(${rot}deg) scaleY(1)` : `translate(12px, 6px) rotate(${rot}deg) scaleY(0.4)`;
  }

  function fingerMarkup(f, pose) {
    const top = KNUCKLE - f.len;
    const h = f.len + BASE;
    const ox = f.x;
    const oy = KNUCKLE + BASE;
    return `<g class="f f-${f.id}" style="transform-origin:${ox}px ${oy}px;transform:${fingerTransform(f, pose)}">
      <rect x="${f.x - f.w / 2}" y="${top}" width="${f.w}" height="${h}" rx="${f.w / 2}" fill="${MILK}" stroke="${INK}" stroke-width="3.2" vector-effect="non-scaling-stroke"/>
    </g>`;
  }

  function thumbMarkup(pose) {
    const t = THUMB;
    const ox = t.x;
    const oy = t.y + t.base;
    return `<g class="f f-thumb" style="transform-origin:${ox}px ${oy}px;transform:${thumbTransform(pose)}">
      <rect x="${t.x - t.w / 2}" y="${t.y - t.len}" width="${t.w}" height="${t.len + t.base}" rx="${t.w / 2}" fill="${MILK}" stroke="${INK}" stroke-width="3.2" vector-effect="non-scaling-stroke"/>
    </g>`;
  }

  const SPARK = (x, y, s, fill) => `<path class="shine" opacity="0" transform="translate(${x} ${y}) scale(${s})" d="M0-10c.9 5.6 3.3 8.2 9 9.4-5.7 1.2-8.1 3.8-9 9.4-.9-5.6-3.3-8.2-9-9.4 5.7-1.2 8.1-3.8 9-9.4z" fill="${fill}" stroke="${INK}" stroke-width="1.8" stroke-linejoin="round"/>`;

  /**
   * @param {object} o { pose='rock', cuff='#FF6FAE', mirror=false, className='', sparkles=false }
   * @returns {string} SVG markup
   */
  function svg(o) {
    o = o || {};
    const pose = POSES[o.pose] || POSES.rock;
    const cuff = o.cuff || '#FF6FAE';
    const fingers = FINGERS.map((f) => fingerMarkup(f, pose[f.id])).join('');
    const body = `
      ${thumbMarkup(pose.thumb)}
      ${fingers}
      <path class="palm" d="M58 146c0-11 6-16 16-16h60c12 0 18 6 18 18l-2 50c-1 20-12 30-32 30H90c-20 0-32-10-33-30z" fill="${MILK}" stroke="${INK}" stroke-width="3.4" stroke-linejoin="round"/>
      <g fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round" opacity=".5">
        <path d="M84 154q-2 18 0 36"/><path d="M104 152v40"/><path d="M124 154q2 18 0 36"/>
      </g>
      <ellipse cx="128" cy="210" rx="9" ry="5" fill="#FF8FB8" opacity=".0" class="glove-blush"/>
      <g class="cuff">
        <path d="M66 222h78q6 0 6 6v20q0 8-8 8H68q-8 0-8-8v-20q0-6 6-6z" fill="${cuff}" stroke="${INK}" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M64 236h82" stroke="${INK}" stroke-width="2.6" stroke-linecap="round" opacity=".45"/>
      </g>
      ${o.sparkles ? SPARK(66, 40, 0.9, '#FFE066') + SPARK(140, 30, 0.7, '#FF6FAE') + SPARK(126, 78, 0.55, '#6CC8FF') : ''}
    `;
    const inner = o.mirror ? `<g transform="translate(210 0) scale(-1 1)">${body}</g>` : body;
    return `<svg class="hand ${o.className || ''}" viewBox="0 0 210 262" data-pose="${o.pose || 'rock'}" aria-hidden="true" focusable="false"><g class="hand-wrap">${inner}</g></svg>`;
  }

  /**
   * Morph an existing hand to a pose.
   * @param {SVGElement} el the <svg class="hand">
   * @param {string} poseName
   * @param {object} o { order: ['thumb','index',...], stagger: ms between digits }
   */
  function set(el, poseName, o) {
    if (!el) return;
    o = o || {};
    const pose = POSES[poseName];
    if (!pose) return;
    el.setAttribute('data-pose', poseName);
    const order = o.order || ['thumb', 'index', 'middle', 'ring', 'pinky'];
    order.forEach((id, i) => {
      const g = el.querySelector('.f-' + id);
      if (!g) return;
      g.style.transitionDelay = o.stagger ? i * o.stagger + 'ms' : '0ms';
      g.style.transform = id === 'thumb' ? thumbTransform(pose.thumb) : fingerTransform(FINGERS.find((f) => f.id === id), pose[id]);
    });
    el.querySelectorAll('.shine').forEach((s, i) => {
      s.style.transition = `opacity 240ms ease ${o.shineDelay || 0}ms`;
      s.style.opacity = poseName === 'middle' || poseName === 'ily' ? '1' : '0';
    });
  }

  /** Small static icon version for the arcade buttons. */
  function icon(poseName, cuff) {
    return svg({ pose: poseName, cuff: cuff || '#FFFBFD', className: 'hand-icon' });
  }

  PLM.hand = { svg, set, icon, poses: Object.keys(POSES) };
})(window.PLM = window.PLM || {});

</script>
<script>
/* machine.js - the cabinet: wall, marquee bulbs, stickers, deck controls,
   the host pony (Tangyuan) with her speech bubble, and the music player. */
(function (PLM) {
  'use strict';

  const U = PLM.util;
  const art = () => PLM.art || {};
  const sticker = (name, o) => (art().sticker ? art().sticker(name, o) : '');
  const icon = (name, o) => (art().icon ? art().icon(name, o) : '');

  const M = (PLM.machine = {});

  /* ---------------- wall ---------------- */
  function buildWall() {
    const wall = U.$('#wall');
    const clouds = [
      { y: 64, size: 220, dur: 150, delay: -20 },
      { y: 236, size: 160, dur: 118, delay: -88 },
      { y: 392, size: 250, dur: 170, delay: -54 },
      { y: 548, size: 180, dur: 136, delay: -118 },
      { y: 150, size: 130, dur: 104, delay: -40 },
      { y: 470, size: 140, dur: 124, delay: -9 },
    ];
    clouds.forEach((c) => {
      const d = U.el('div', { class: 'drift' });
      d.style.top = c.y + 'px';
      d.style.setProperty('--dur', c.dur + 's');
      d.style.setProperty('--delay', c.delay + 's');
      d.innerHTML = sticker('cloud', { size: c.size, diecut: false });
      wall.append(d);
    });
    wall.append(U.el('div', { class: 'wall-floor' }));
  }

  /* ---------------- marquee bulbs ---------------- */
  const bulbs = (M.bulbs = {
    els: [], timer: null, mode: 'steady',
    build() {
      const host = U.$('#bulbs');
      const W = 996;
      const H = 108;
      const pts = [];
      const topY = 14;
      const botY = H - 14;
      const n = 23;
      for (let i = 0; i < n; i++) pts.push([30 + (i * (W - 60)) / (n - 1), topY]);
      pts.push([W - 13, H / 2]);
      for (let i = n - 1; i >= 0; i--) pts.push([30 + (i * (W - 60)) / (n - 1), botY]);
      pts.push([13, H / 2]);
      pts.forEach(([x, y]) => {
        const b = U.el('span', { class: 'bulb' });
        b.style.left = x + 'px';
        b.style.top = y + 'px';
        host.append(b);
        this.els.push(b);
      });
      this.set('steady');
    },
    set(mode) {
      clearInterval(this.timer);
      this.mode = mode;
      const els = this.els;
      if (mode === 'off') { els.forEach((b) => b.classList.remove('on')); return; }
      if (mode === 'steady' || U.reduced()) { els.forEach((b) => b.classList.add('on')); return; }
      let i = 0;
      if (mode === 'attract') {
        const tick = () => { i++; els.forEach((b, k) => b.classList.toggle('on', (k + i) % 2 === 0)); };
        tick();
        this.timer = setInterval(tick, 560);
      } else if (mode === 'chase') {
        const tick = () => { i++; els.forEach((b, k) => b.classList.toggle('on', (k - i + 400) % 5 < 2)); };
        tick();
        this.timer = setInterval(tick, 65);
      }
    },
    /** chase for a moment, then settle back */
    flash(ms) {
      const back = this.mode === 'chase' ? 'steady' : this.mode;
      this.set('chase');
      clearTimeout(this.flashT);
      this.flashT = setTimeout(() => this.set(back), ms || 1100);
    },
  });

  /* ---------------- stickers (stage coords) ---------------- */
  function buildStickers() {
    const layer = U.$('#cabStickers');
    const list = [
      { n: 'heart', x: 262, y: 150, s: 70, r: -14 },
      { n: 'bridge', x: 168, y: 318, s: 122, r: -8 },
      { n: 'tangyuanBall', x: 196, y: 470, s: 70, r: 12 },
      { n: 's520', x: 178, y: 594, s: 100, r: -10 },
      { n: 'horseshoe', x: 1150, y: 214, s: 76, r: 16 },
      { n: 'sparkle', x: 1176, y: 108, s: 42, r: 0 },
      { n: 'sparkle', x: 206, y: 120, s: 34, r: 12 },
      { n: 'rainbow', x: 1262, y: 30, s: 150, r: 0 },
      { n: 'thursday', x: 1224, y: 158, s: 196, r: 8 },
      { n: 'sparkle', x: 1340, y: 330, s: 30, r: 0 },
      { n: 'sparkle', x: 70, y: 262, s: 26, r: 0 },
      { n: 'hoofprints', x: 70, y: 836, s: 74, r: -18 },
      { n: 'heart', x: 1158, y: 450, s: 46, r: 14 },
    ];
    list.forEach((it) => {
      const d = U.el('div', { class: 'stk stk-' + it.n });
      d.style.left = it.x + 'px';
      d.style.top = it.y + 'px';
      d.style.width = it.s + 'px';
      d.style.setProperty('--r', it.r + 'deg');
      d.innerHTML = sticker(it.n, { size: it.s });
      layer.append(d);
    });
  }

  /* ---------------- deck ---------------- */
  function dome(o) {
    const b = U.el('button', { class: 'dome ' + (o.className || ''), type: 'button', 'aria-label': o.aria || o.label || '' });
    b.innerHTML = `<span class="ring"></span><span class="cap">${o.inner || ''}${o.label ? `<span class="label">${o.label}</span>` : ''}</span>${o.tag ? `<span class="tag" aria-hidden="true">${o.tag}</span>` : ''}`;
    if (o.pick) b.dataset.pick = o.pick;
    return b;
  }

  function buildDeck() {
    const deck = U.$('#deck');
    M.lcd = U.el('div', { class: 'lcd', 'aria-hidden': 'true' });
    M.setCredits(0, true);

    M.coinslot = U.el('div', { class: 'coinslot plate' },
      U.el('div', { class: 'slit' }),
      U.el('div', { class: 'plate-label', html: 'Insert &#9825;' }));

    M.nameplate = U.el('div', { class: 'nameplate plate' },
      U.el('div', { class: 'np-1', text: 'PLAYER 1' }),
      U.el('div', { class: 'np-2', lang: 'zh', text: '徐梦' }));

    M.yes = dome({ className: 'is-yes', label: 'YES', aria: 'Yes' });
    M.noHome = U.el('div', { class: 'no-home', style: { width: '112px', height: '52px', position: 'relative' } });
    M.yesnoSet = U.el('div', { class: 'ctrl-set is-off', 'data-set': 'yesno' }, M.yes, M.noHome);

    const picks = [
      { pick: 'rock', cn: '石头', en: 'Rock', key: '1' },
      { pick: 'paper', cn: '布', en: 'Paper', key: '2' },
      { pick: 'scissors', cn: '剪刀', en: 'Scissors', key: '3' },
    ];
    M.rps = {};
    M.rpsSet = U.el('div', { class: 'ctrl-set rps-set is-off', 'data-set': 'rps' });
    picks.forEach((p) => {
      const b = dome({ className: 'rps', pick: p.pick, tag: `<b>${p.key}</b><span lang="zh">${p.cn}</span>`, aria: `${p.en} (${p.cn}), key ${p.key}`, inner: PLM.hand ? PLM.hand.icon(p.pick, '#FFFBFD') : '' });
      M.rps[p.pick] = b;
      M.rpsSet.append(b);
    });

    M.ticketslot = U.el('div', { class: 'ticketslot plate' },
      U.el('div', { class: 'plate-label', text: 'Prize tickets' }),
      U.el('div', { class: 'slit' }));

    M.crank = U.el('button', { class: 'crank', type: 'button', 'aria-label': 'Turn the crank to print the voucher', disabled: true });
    M.crank.innerHTML = '<span class="base"></span><span class="arm"><span class="bar"></span><span class="knob"></span></span><span class="hub"></span>';

    deck.append(M.lcd, M.coinslot, M.nameplate, M.yesnoSet, M.rpsSet, M.ticketslot, M.crank);

    M.crankHint = U.el('div', { class: 'crank-hint', 'aria-hidden': 'true', html: 'turn me' + icon('arrowRight') });
    U.$('#stage').append(M.crankHint);
  }

  M.setCredits = function (n, silent) {
    M.lcd.innerHTML = `CREDITS <b>${String(n).padStart(2, '0')}</b>`;
    if (!silent) {
      M.lcd.classList.remove('flash');
      void M.lcd.offsetWidth;
      M.lcd.classList.add('flash');
    }
  };

  /** 'none' | 'yesno' | 'rps' */
  M.setDeck = function (name) {
    U.$$('.ctrl-set', U.$('#deck')).forEach((s) => s.classList.toggle('is-off', s.dataset.set !== name));
    M.nameplate.classList.toggle('is-off', name !== 'none');
    M.deckName = name;
  };

  M.setCrankReady = function (on) {
    M.crank.disabled = !on;
    M.crank.classList.toggle('is-ready', !!on);
    M.crankHint.classList.toggle('is-on', !!on);
  };

  M.turnCrank = function () {
    const arm = M.crank.querySelector('.arm');
    M.crank.classList.remove('is-ready');
    M.crankHint.classList.remove('is-on');
    if (U.reduced()) { PLM.sfx('crank'); return U.sleep(120); }
    arm.style.transition = 'transform 760ms cubic-bezier(.77,0,.175,1)';
    arm.style.transform = 'rotate(360deg)';
    PLM.sfx('crank');
    return U.sleep(780).then(() => {
      arm.style.transition = 'none';
      arm.style.transform = 'rotate(0deg)';
    });
  };

  M.dim = function (on) { U.$('#machine').classList.toggle('is-dim', !!on); };

  /* ---------------- alive registry: blink + eyes follow the cursor ---------------- */
  const alive = (PLM.alive = {
    items: new Set(),
    add(svg) {
      if (!svg) return;
      svg.classList.add('is-alive');
      const it = { svg, lx: 0, ly: 0, next: performance.now() + U.rand(1200, 3600) };
      this.items.add(it);
      return it;
    },
    remove(svg) { this.items.forEach((it) => { if (it.svg === svg) this.items.delete(it); }); },
    loop(t) {
      const p = PLM.pointer;
      alive.items.forEach((it) => {
        if (!it.svg.isConnected) { alive.items.delete(it); return; }
        // eyes follow the cursor (decorative, lerped)
        const eyes = it.svg.querySelector('.p-eyes') || it.svg;
        const r = PLM.stage.rectOf(eyes);
        let tx = 0;
        let ty = 0;
        if (p.active && !U.reduced()) {
          tx = U.clamp((p.x - r.cx) / 380, -1, 1);
          ty = U.clamp((p.y - r.cy) / 300, -1, 1);
        }
        it.lx = U.lerp(it.lx, tx, 0.12);
        it.ly = U.lerp(it.ly, ty, 0.12);
        if (art().lookAt) art().lookAt(it.svg, it.lx, it.ly);
        // blinks every 2.5-6s, sometimes a double
        if (t > it.next) {
          if (art().blink) {
            art().blink(it.svg);
            if (Math.random() < 0.22) setTimeout(() => art().blink(it.svg), 220);
          }
          it.next = t + U.rand(2500, 6000);
        }
      });
      requestAnimationFrame(alive.loop);
    },
  });

  /* ---------------- host pony + bubble ---------------- */
  function buildHost() {
    const host = U.$('#host');
    const pony = art().tangyuan ? art().tangyuan({ size: 236, expr: 'happy', facing: 'left' }) : '';
    host.innerHTML = `<div class="host-cloud">${sticker('cloud', { size: 250 })}</div>
      <button class="host-pony" type="button" aria-label="Tangyuan the pony. Poke her.">${pony}</button>
      <div class="bubble is-hidden" role="status"></div>`;
    const svg = host.querySelector('.pony');
    alive.add(svg);
    const btn = host.querySelector('.host-pony');
    let pokes = 0;
    let pokeT = null;
    const lines = [
      ['shocked', 'Hey.'],
      ['pout', 'Personal space, please.'],
      ['smug', 'I’m telling Amine.'],
      ['shocked', 'Bro.'],
      ['pout', '<span class="cn">哼</span>. Stop poking me. Poke him.'],
    ];
    btn.addEventListener('click', () => {
      pokes++;
      clearTimeout(pokeT);
      pokeT = setTimeout(() => { pokes = 0; }, 6000);
      const [expr, text] = lines[Math.min(pokes, lines.length) - 1];
      PLM.sfx('pop');
      PLM.host.hop();
      PLM.host.say(text, { expr, html: true, ms: 2200 });
      if (pokes >= lines.length) pokes = 0;
    });
  }

  const hostApi = (PLM.host = {
    baseExpr: 'happy',
    get svg() { return U.$('#host .pony'); },
    get bubble() { return U.$('#host .bubble'); },
    expr(e, ms) {
      const svg = this.svg;
      if (!svg) return;
      clearTimeout(this.exprT);
      if (art().setExpr) art().setExpr(svg, e); else svg.setAttribute('data-expr', e);
      if (ms) this.exprT = setTimeout(() => this.expr(this.baseExpr), ms);
    },
    setBase(e) { this.baseExpr = e; this.expr(e); },
    hop() {
      const h = U.$('#host');
      h.classList.remove('hop');
      void h.offsetWidth;
      h.classList.add('hop');
    },
    say(text, o) {
      o = o || {};
      const b = this.bubble;
      if (!b) return;
      clearTimeout(this.hideT);
      clearTimeout(this.showT);
      const plain = o.html ? text.replace(/<[^>]+>/g, '') : text;
      const ms = o.ms || U.clamp(1500 + plain.length * 52, 2300, 6000);
      const show = () => {
        if (o.html) b.innerHTML = text; else b.textContent = text;
        b.classList.remove('is-hidden');
      };
      if (!b.classList.contains('is-hidden')) {
        b.classList.add('is-hidden');
        this.showT = setTimeout(show, 150);
      } else show();
      if (o.expr) this.expr(o.expr, ms);
      this.hideT = setTimeout(() => b.classList.add('is-hidden'), ms + 150);
    },
    hush() { clearTimeout(this.hideT); const b = this.bubble; if (b) b.classList.add('is-hidden'); },
  });

  /* ---------------- music player ---------------- */
  function buildPlayer() {
    const p = U.$('#player');
    p.innerHTML = `
      <div class="ttl">${icon('music')}<span>Pastel Paddock<small>MUSIC BOX · LOOP</small></span></div>
      <div class="row">
        <button class="pbtn play" type="button" aria-label="Play music">${icon('play')}</button>
        <button class="pbtn mute" type="button" aria-pressed="false" aria-label="Mute">${icon('speaker')}</button>
        <input class="vol" type="range" min="0" max="100" step="1" value="50" aria-label="Volume">
      </div>`;
    const play = p.querySelector('.play');
    const mute = p.querySelector('.mute');
    const vol = p.querySelector('.vol');
    const A = () => PLM.audio;

    play.addEventListener('click', () => {
      if (!A()) return;
      A().init();
      A().toggleMusic();
      sync();
    });
    mute.addEventListener('click', () => {
      if (!A()) return;
      A().init();
      A().toggleMuted();
      const m = A().isMuted();
      PLM.host.say(m ? 'Muted. The pony is offended.' : 'The pony forgives you.', { expr: m ? 'pout' : 'happy', ms: 2200 });
      sync();
    });
    let slideTick = 0;
    vol.addEventListener('input', () => {
      const v = Number(vol.value) / 100;
      vol.style.setProperty('--v', vol.value + '%');
      if (!A()) return;
      A().init();
      A().setVolume(v);
      if (A().isMuted() && v > 0) A().setMuted(false);
      const now = performance.now();
      if (now - slideTick > 90) { PLM.sfx('slide'); slideTick = now; }
    });

    function sync() {
      if (!A()) return;
      const playing = A().isMusicPlaying();
      const muted = A().isMuted();
      play.innerHTML = icon(playing ? 'pause' : 'play');
      play.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
      mute.innerHTML = icon(muted ? 'speakerMute' : 'speaker');
      mute.setAttribute('aria-pressed', String(muted));
      mute.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
      p.classList.toggle('is-muted', muted);
      const v = Math.round(A().getVolume() * 100);
      if (Number(vol.value) !== v) vol.value = String(v);
      vol.style.setProperty('--v', vol.value + '%');
    }
    M.syncPlayer = sync;
    if (A() && A().onChange) A().onChange(sync);
    vol.style.setProperty("--v", "50%");
  }

  M.build = function () {
    buildWall();
    bulbs.build();
    buildStickers();
    buildDeck();
    buildHost();
    buildPlayer();
    const heart = U.$('.mq-heart');
    if (heart) heart.innerHTML = icon('heart', { size: 26 });
    if (heart) heart.style.color = 'var(--pink)';
    requestAnimationFrame(alive.loop);
  };
})(window.PLM = window.PLM || {});

</script>
<script>
/* nobutton.js - the No button is a creature, not a glitch.
   It lives on a spring, watches the cursor, blushes when you get close, and runs.
   It flees on proximity AND on pointerdown, so a click can never land on it. */
(function (PLM) {
  'use strict';

  const U = PLM.util;
  const W = 1440;
  const H = 900;

  function padRect(r, p) {
    return { x: r.x - p, y: r.y - p, r: r.r + p, b: r.b + p };
  }
  function overlaps(r, x, y, hw, hh) {
    return x + hw > r.x && x - hw < r.r && y + hh > r.y && y - hh < r.b;
  }

  /**
   * @param {object} o
   *  home: element marking the start spot, yes: the YES button,
   *  steps: array indexed by attempt number -> { label, caption, scale, hide, sulk, shy, dialog, host }
   *  onAttempt(n, step), onDialog(): Promise<'yes'|'close'>, onYes(), onFired(),
   *  hideCloud(show:boolean): shows the hiding cloud and returns its stage rect
   */
  function mount(o) {
    const roam = U.$('#roam');
    const btn = U.el('button', { class: 'nobtn', type: 'button', 'aria-label': 'No (unavailable, sorry)' });
    btn.innerHTML = '<span class="nb-body"><span class="nb-label">No</span><span class="nb-blush l"></span><span class="nb-blush r"></span></span>'
      + '<span class="nb-eyes" aria-hidden="true"><span class="nb-eye"><i></i></span><span class="nb-eye"><i></i></span></span>';
    roam.append(btn);
    const label = btn.querySelector('.nb-label');
    const pupils = btn.querySelectorAll('.nb-eye i');

    const home = PLM.stage.rectOf(o.home);
    const sp = new U.Spring2D({ k: 260, c: 18, x: home.cx, y: home.cy });
    let w = btn.offsetWidth || 112;
    let h = btn.offsetHeight || 52;
    let n = 0;
    let scale = 1;
    let targetScale = 1;
    let state = 'idle'; // idle | running | hidden | frozen | gone
    let lastFlee = 0;
    let lastAttempt = 0;
    let kbTries = 0;
    let raf = 0;
    let last = performance.now();
    const t0 = performance.now();

    U.animate(btn, [{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: 'ease', fill: 'backwards' });

    function setLabel(html) {
      if (label.innerHTML === html) return;
      label.innerHTML = html;
      // the button resizes to the new words; re-measure so it stays centred on its spring
      w = btn.offsetWidth;
      h = btn.offsetHeight;
      if (!U.reduced()) {
        U.animate(label, [{ opacity: 0, filter: 'blur(3px)' }, { opacity: 1, filter: 'blur(0px)' }], { duration: 200, easing: 'cubic-bezier(.23,1,.32,1)' });
      }
    }

    function render() {
      const v = sp.speed;
      const reduced = U.reduced();
      const sq = reduced ? 0 : Math.min(v / 2600, 0.2);
      const ang = (Math.atan2(sp.vy, sp.vx) * 180) / Math.PI;
      const x = sp.x - w / 2;
      const y = sp.y - h / 2;
      btn.style.transform = sq > 0.004
        ? `translate(${x}px, ${y}px) rotate(${ang}deg) scale(${1 + sq}, ${1 - sq}) rotate(${-ang}deg) scale(${scale})`
        : `translate(${x}px, ${y}px) scale(${scale})`;
    }

    function avoidRects() {
      const list = [];
      if (o.yes && o.yes.isConnected) list.push(padRect(PLM.stage.rectOf(o.yes), 46));
      const player = U.$('#player');
      if (player) list.push(padRect(PLM.stage.rectOf(player), 22));
      const host = U.$('#host .host-pony');
      if (host) list.push(padRect(PLM.stage.rectOf(host), -30));
      return list;
    }

    function pickTarget(px, py) {
      const hw = (w * scale) / 2 + 6;
      const hh = (h * scale) / 2 + 18; // eyes poke above
      const zone = { x0: 34 + hw, x1: W - 34 - hw, y0: 40 + hh, y1: H - 26 - hh };
      const avoid = avoidRects();
      const travel = n <= 3 ? 230 : n <= 6 ? 360 : 440;
      let best = null;
      let bestScore = -Infinity;
      for (let i = 0; i < 64; i++) {
        const x = U.rand(zone.x0, zone.x1);
        const y = U.rand(zone.y0, zone.y1);
        if (avoid.some((r) => overlaps(r, x, y, hw, hh))) continue;
        const dp = Math.hypot(x - px, y - py);
        if (dp < 300) continue;
        const dm = Math.hypot(x - sp.x, y - sp.y);
        const score = Math.min(dp, 620) - Math.abs(dm - travel) * 0.6 + U.rand(0, 90);
        if (score > bestScore) { bestScore = score; best = { x, y }; }
      }
      if (!best) {
        // cornered: hop to the far side of the stage
        best = {
          x: U.clamp(W - px, zone.x0, zone.x1),
          y: U.clamp(H - py, zone.y0, zone.y1),
        };
      }
      return best;
    }

    function sparkleAt(x, y) {
      U.burst(x, y, { count: 4, kinds: ['sparkle'], spread: 50, size: [10, 16], dur: [500, 800], fall: 8 });
    }

    function attempt() {
      if (performance.now() - t0 > 45000 && n >= 3 && n < 9) n = 9; // it calls for backup
      n++;
      const step = o.steps[Math.min(n, o.steps.length - 1)] || {};
      btn.classList.toggle('is-sulk', !!step.sulk);
      btn.classList.toggle('is-shy', !!step.shy);
      if (step.label) setLabel(step.label);
      if (step.scale) targetScale = step.scale;
      if (o.onAttempt) o.onAttempt(n, step);
      return step;
    }

    function moveTo(tgt, teleport) {
      if (teleport || U.reduced()) {
        sparkleAt(sp.x, sp.y);
        PLM.sfx('sparkle');
        U.animate(btn, [{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' });
        sp.jump(tgt.x, tgt.y);
      } else {
        sparkleAt(sp.x, sp.y);
        sp.set(tgt.x, tgt.y);
      }
    }

    async function flee(px, py, hard) {
      if (state === 'frozen' || state === 'gone') return;
      const now = performance.now();
      lastFlee = now;
      let step = null;
      if (now - lastAttempt > 380) {
        lastAttempt = now;
        step = attempt();
      }
      if (step && step.dialog) {
        state = 'frozen';
        btn.classList.remove('is-near');
        PLM.sfx('ding');
        const res = o.onDialog ? await o.onDialog() : 'yes';
        if (res === 'close') fire();
        return;
      }
      if (state === 'hidden' && o.hideCloud) {
        // leaving the cloud: it keeps the cloud there for the vibes
      }
      state = 'running';
      PLM.sfx('boing', Math.min(n, 10));
      if (step && step.hide && o.hideCloud) {
        const c = o.hideCloud(true);
        if (c) {
          state = 'hidden';
          moveTo({ x: c.r - 8, y: c.cy + 6 }, false);
          return;
        }
      }
      const tgt = pickTarget(px, py);
      moveTo(tgt, hard && n >= 4);
      if (step && step.sulk) {
        U.animate(btn.querySelector('.nb-body'), [
          { transform: 'rotate(0deg)' }, { transform: 'rotate(-7deg)' }, { transform: 'rotate(6deg)' }, { transform: 'rotate(-3deg)' }, { transform: 'rotate(0deg)' },
        ], { duration: 520, delay: 380, easing: 'ease-in-out' });
        PLM.sfx('bonk');
      }
    }

    function fire() {
      state = 'gone';
      cancelAnimationFrame(raf);
      const x = sp.x - w / 2;
      const y = sp.y - h / 2;
      PLM.sfx('trombone');
      const a = U.reduced()
        ? U.animate(btn, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' })
        : U.animate(btn, [
          { transform: `translate(${x}px, ${y}px) scale(${scale}) rotate(0deg)` },
          { transform: `translate(${x}px, ${y - 40}px) scale(${scale}) rotate(-12deg)`, offset: 0.25, easing: 'cubic-bezier(.55,0,1,.45)' },
          { transform: `translate(${x + 30}px, ${H + 120}px) scale(${scale}) rotate(40deg)` },
        ], { duration: 900, easing: 'linear', fill: 'forwards' });
      a.finished.then(() => btn.remove());
      if (o.onFired) o.onFired();
    }

    function tick(t) {
      const dt = Math.min((t - last) / 1000, 0.05);
      last = t;
      scale = U.lerp(scale, targetScale, 0.16);
      if (state !== 'gone') {
        const p = PLM.pointer;
        const d = Math.hypot(p.x - sp.x, p.y - sp.y);
        const R = (118 + Math.min(n, 8) * 8) * Math.max(scale, 0.72);
        if (state !== 'frozen') {
          btn.classList.toggle('is-near', p.active && d < R * 1.8);
          if (p.active && p.type !== 'touch' && d < R && t - lastFlee > 140) flee(p.x, p.y, false);
        }
        const a = Math.atan2(p.y - sp.y, p.x - sp.x);
        const m = p.active ? 3.5 : 0;
        const tx = (Math.cos(a) * m).toFixed(2);
        const ty = (Math.sin(a) * m).toFixed(2);
        pupils.forEach((pp) => { pp.style.transform = `translate(${tx}px, ${ty}px)`; });
        sp.step(dt);
        render();
        raf = requestAnimationFrame(tick);
      }
    }
    raf = requestAnimationFrame(tick);

    // A press that somehow reaches it: it bolts before the click can complete.
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const p = PLM.stage.toStage(e.clientX, e.clientY);
      flee(p.x, p.y, true);
    });
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      if (state === 'gone' || state === 'frozen') return;
      PLM.host.say('That click didn’t count. The judges reviewed the footage.', { expr: 'smug' });
      flee(PLM.pointer.x, PLM.pointer.y, true);
    });
    // Keyboard: focusing it makes it hop away and hand focus to YES.
    btn.addEventListener('focus', () => {
      if (state === 'gone' || state === 'frozen') return;
      if (!btn.matches(':focus-visible')) return;
      kbTries++;
      flee(sp.x, sp.y, true);
      if (o.yes) o.yes.focus();
      if (kbTries >= 3) {
        btn.tabIndex = -1;
        PLM.host.say('The No button has left the tab order.', { expr: 'smug' });
      } else {
        PLM.host.say('Tab-tab-tab. Hacker.', { expr: 'smug' });
      }
    });

    return {
      el: btn,
      get attempts() { return n; },
      fire,
      destroy() {
        state = 'gone';
        cancelAnimationFrame(raf);
        U.animate(btn, [{ opacity: 1 }, { opacity: 0, transform: btn.style.transform + ' scale(.9)' }], { duration: 180, fill: 'forwards' })
          .finished.then(() => btn.remove());
      },
    };
  }

  PLM.noButton = { mount };
})(window.PLM = window.PLM || {});

</script>
<script>
/* voucher.js - the date voucher: the shared plan data, the ticket artwork (one SVG,
   so it can also be saved as a PNG), the print moment, and the screenshot ending. */
(function (PLM) {
  'use strict';

  const U = PLM.util;
  const art = () => PLM.art || {};

  /* ---------------- shared copy data ---------------- */
  const PLANS = [
    {
      id: 'waimai', color: '#FF6FAE', rosette: true,
      name: '<span class="cn">外卖</span> &amp; Chill', nameCn: 'on the bed, obviously',
      line: 'We order too much, eat in bed, fall asleep in episode two.',
      joke: 'Crumbs in the bed are my problem.',
      ticket: '外卖 & Chill', ticketSub: 'on the bed, obviously', short: '外卖&Chill',
    },
    {
      id: 'westlake', color: '#FFA96B',
      name: 'West Lake Sunset', nameCn: '西湖',
      line: 'Walk the Su Causeway <span class="cn">苏堤</span> at golden hour.',
      joke: 'I take 200 photos of you. You take 3 of me, all blurry.',
      ticket: 'West Lake Sunset', ticketSub: '西湖 · the Su Causeway', short: '西湖 Sunset',
    },
    {
      id: 'hotpot', color: '#FFE066',
      name: 'Hotpot Night', nameCn: '火锅',
      line: 'Spicy pot for you, mild pot for the coward.',
      joke: 'The coward is me.',
      ticket: 'Hotpot Night', ticketSub: '火锅 · mild pot for the coward', short: '火锅',
    },
    {
      id: 'claw', color: '#66E3B4',
      name: 'Claw Machine Mission', nameCn: '抓娃娃',
      line: 'I win you a pony plush.',
      joke: 'Or I spend ¥200 trying. Romantic either way.',
      ticket: 'Claw Machine Mission', ticketSub: '抓娃娃 · one pony plush', short: '抓娃娃',
    },
    {
      id: 'hefang', color: '#6CC8FF',
      name: 'Hefang Snack Crawl', nameCn: '河坊街',
      line: 'Old street, everything on a stick.',
      joke: 'You eat half of mine. I already know.',
      ticket: 'Hefang Snack Crawl', ticketSub: '河坊街 · everything on a stick', short: '河坊街',
    },
    {
      id: 'surprise', color: '#FF8FB8',
      name: 'Surprise Me', nameCn: '惊喜',
      line: 'I plan it. You act surprised.',
      joke: 'Dress code: cute. Easy for you.',
      ticket: 'Surprise Me', ticketSub: '惊喜 · dress code: cute', short: '惊喜',
    },
  ];
  // She lands Thursday night (26 Nov 2026) and stays until Sunday.
  const DAYS = [
    { id: 'thu', label: 'Thu', date: '26', short: 'Thu 26', nightOnly: true, say: 'Thursday you land at night. Late night it is.' },
    { id: 'fri', label: 'Fri', date: '27', short: 'Fri 27', say: 'Friday. A whole day of you.' },
    { id: 'sat', label: 'Sat', date: '28', short: 'Sat 28', say: 'Saturday. Clearing my schedule.' },
    { id: 'sun', label: 'Sun', date: '29', short: 'Sun 29', say: 'Sunday. Saving the best for last. Smart.' },
  ];
  const TIMES = [
    { id: 'afternoon', label: 'Afternoon', say: 'Afternoon. Responsible. Cute.' },
    { id: 'golden', label: 'Golden hour', say: 'Golden hour. You’ll look unreal.' },
    { id: 'late', label: 'Late night', say: 'Late night. Noted. <i>Very</i> noted.' },
  ];
  const clingWord = (v) => (v >= 95 ? 'surgically attached' : v >= 85 ? 'full koala' : v >= 70 ? 'koala-adjacent' : 'clingy');
  const slotText = (slot) => {
    if (!slot) return '';
    const d = DAYS.find((x) => x.id === slot.day);
    const t = TIMES.find((x) => x.id === slot.time);
    return [d && d.short + ' Nov', t && t.label.toLowerCase()].filter(Boolean).join(' · ');
  };

  PLM.data = { PLANS, DAYS, TIMES, clingWord, slotText, byId: (id) => PLANS.find((p) => p.id === id) };

  const serial = '520-1314-XM-' + String(Math.floor(Math.random() * 100)).padStart(2, '0');
  PLM.state = PLM.state || {};
  Object.assign(PLM.state, { serial, plans: [], schedule: {}, clingy: 75, payer: 'Amine' });

  /* ---------------- ticket artwork ---------------- */
  let uid = 0;
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const F_DISPLAY = "DynaPuff, 'ZCOOL KuaiLe', sans-serif";
  const F_BODY = "'Zen Maru Gothic', 'ZCOOL KuaiLe', sans-serif";
  const F_CN = "'ZCOOL KuaiLe', DynaPuff, sans-serif";
  const F_DOT = "DotGothic16, 'ZCOOL KuaiLe', monospace";

  /* The QR opens a tiny password page ("I love you"), which then opens
     美团外卖 if she picked 外卖 & Chill, otherwise 高德地图 at her first date's spot.
     That page lives at UNLOCK_BASE (see landing/ and README). */
  const UNLOCK_BASE = (PLM.config && PLM.config.unlockBase) || 'https://smallklaus.github.io/plm/key/';
  const DAY_ORDER = { thu: 0, fri: 1, sat: 2, sun: 3 };
  const TIME_ORDER = { afternoon: 0, golden: 1, late: 2 };

  function qrText(s) {
    if (s.plans.includes('waimai')) return UNLOCK_BASE + '#waimai';
    const rank = (id) => {
      const sl = (s.schedule && s.schedule[id]) || {};
      return (DAY_ORDER[sl.day] == null ? 9 : DAY_ORDER[sl.day]) * 10 + (TIME_ORDER[sl.time] == null ? 9 : TIME_ORDER[sl.time]);
    };
    const first = s.plans.slice().sort((a, b) => rank(a) - rank(b))[0] || 'westlake';
    return UNLOCK_BASE + '#map-' + first;
  }

  function nestSvg(markup, x, y, w, h) {
    if (!markup) return '';
    // place a returned <svg> at x,y with a fixed width/height
    return markup.replace(/<svg\b([^>]*)>/, (m, attrs) => {
      const cleaned = attrs.replace(/\s(width|height|x|y)="[^"]*"/g, '');
      return `<svg${cleaned} x="${x}" y="${y}" width="${w}" height="${h == null ? w : h}">`;
    });
  }

  function build(s) {
    const id = ++uid;
    const u = (k) => `tk${id}-${k}`;
    const plans = s.plans.map((pid) => PLM.data.byId(pid));

    // perforation holes
    let holes = '';
    let holeRings = '';
    for (let y = 34; y <= 428; y += 16) {
      holes += `<circle cx="700" cy="${y}" r="4.6" fill="#000"/>`;
      holeRings += `<circle cx="700" cy="${y}" r="4.6" fill="none" stroke="#3A1A26" stroke-width="1.4" opacity=".55"/>`;
    }
    // guilloche waves
    let waves = '';
    for (let k = 0; k < 6; k++) {
      const y0 = 150 + k * 54;
      const amp = 9 + k * 2;
      const f = 0.017 + k * 0.0026;
      let d = '';
      for (let x = -10; x <= 710; x += 10) d += (x === -10 ? 'M' : 'L') + x + ' ' + (y0 + Math.sin(x * f + k * 1.7) * amp).toFixed(1);
      waves += `<path d="${d}" fill="none" stroke="#F2C94C" stroke-width="1.4" opacity=".75"/>`;
    }
    const band = ['#FF6FAE', '#FFA96B', '#FFE066', '#66E3B4', '#6CC8FF']
      .map((c, i) => `<rect x="0" y="${i * 4}" width="700" height="4" fill="${c}"/>`).join('');

    // plan rows
    const rows = plans.map((p, i) => {
      const y = 172 + i * 54;
      const mark = art().mark ? nestSvg(art().mark(p.id, { size: 46, diecut: false }), 44, y, 46) : '';
      const when = slotText(s.schedule && s.schedule[p.id]) || p.ticketSub;
      return `${mark}
        <text x="104" y="${y + 22}" font-family="${F_DISPLAY}" font-weight="600" font-size="21" fill="#3A1A26">${esc(p.ticket)}</text>
        <text x="104" y="${y + 42}" font-family="${F_DOT}" font-size="14.5" fill="#C2185B">${esc(when)}</text>`;
    }).join('');

    const entry = (x, y, labelText, value) => `
      <text x="${x}" y="${y}" font-family="${F_DOT}" font-size="13" letter-spacing="1.6" fill="#C2185B">${esc(labelText)}</text>
      <text x="${x}" y="${y + 21}" font-family="${F_DOT}" font-size="17" fill="#3A1A26">${esc(value)}</text>`;

    // short URL + level M + no centre hole = a sparse code that phone scanners (WeChat included) read easily
    const qr = PLM.qr && PLM.qr.svg ? nestSvg(PLM.qr.svg(qrText(s), { size: 184, ecc: 'M', margin: 3, fg: '#3A1A26', bg: '#FFFBFD', label: 'QR code: scan it with your phone' }), 726, 104, 184) : '';
    // the peek's forelegs grip an edge at 164/182 of its height: put that edge on the ticket's top edge
    const PW = 124;
    const PH = (PW * 182) / 200;
    const peek = art().ponyPeek ? nestSvg(art().ponyPeek({ size: PW, expr: 'happy' }), 818 - PW / 2 - 8, -(PH * 164) / 182 + 3, PW, PH) : '';
    const aria = `Date voucher number ${s.serial}. Holder 徐梦. Good for: ${plans.map((p) => p.ticket + ' (' + slotText(s.schedule && s.schedule[p.id]) + ')').join(', ')}. Valid in Hangzhou from the moment you land. Never expires.`;

    return `<svg class="ticket" xmlns="http://www.w3.org/2000/svg" viewBox="0 -70 960 530" width="960" height="530" role="img" aria-label="${esc(aria)}">
  <defs>
    <mask id="${u('cut')}" maskUnits="userSpaceOnUse" x="-20" y="-20" width="1000" height="500">
      <rect x="-20" y="-20" width="1000" height="500" fill="#fff"/>
      <circle cx="700" cy="0" r="19" fill="#000"/><circle cx="700" cy="460" r="19" fill="#000"/>
      ${holes}
    </mask>
    <clipPath id="${u('body')}"><path d="M26 0H700V460H26A26 26 0 0 1 0 434V26A26 26 0 0 1 26 0Z"/></clipPath>
    <pattern id="${u('pat')}" width="58" height="58" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <path d="M14 22s-6-3.6-6-8a3.4 3.4 0 0 1 6-2 3.4 3.4 0 0 1 6 2c0 4.4-6 8-6 8z" fill="#F2C94C"/>
      <path d="M38 52v-9a6 6 0 0 1 12 0v9" fill="none" stroke="#F2C94C" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <filter id="${u('ink')}" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <path id="${u('circ')}" d="M579 100a47 47 0 1 1 94 0a47 47 0 1 1 -94 0"/>
  </defs>

  <g mask="url(#${u('cut')})">
    <rect x="0" y="0" width="960" height="460" rx="26" fill="#FFEB85"/>
    <g clip-path="url(#${u('body')})">
      <rect width="700" height="460" fill="url(#${u('pat')})" opacity=".6"/>
      ${waves}
      ${band}
    </g>
    <path d="M700 0H934A26 26 0 0 1 960 26V434A26 26 0 0 1 934 460H700Z" fill="#FF6FAE"/>
    <rect x="2.5" y="2.5" width="955" height="455" rx="24" fill="none" stroke="#3A1A26" stroke-width="5"/>
  </g>
  <path d="M681 0a19 19 0 0 0 38 0M681 460a19 19 0 0 1 38 0" fill="none" stroke="#3A1A26" stroke-width="4"/>
  ${holeRings}

  <text x="44" y="82" font-family="${F_DISPLAY}" font-weight="700" font-size="46" fill="#3A1A26">DATE VOUCHER<tspan dx="14" font-family="${F_CN}" font-weight="400" font-size="32" fill="#C2185B">约会兑换券</tspan></text>
  <text x="44" y="114" font-family="${F_BODY}" font-weight="700" font-size="19" fill="#C2185B">One date with Amine. Valid for one (1) 徐梦.</text>
  <line x1="44" y1="134" x2="672" y2="134" stroke="#3A1A26" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round" opacity=".55"/>

  <text x="44" y="160" font-family="${F_DOT}" font-size="13" letter-spacing="1.6" fill="#C2185B">GOOD FOR</text>
  ${rows}

  ${entry(404, 160, 'HOLDER', '徐梦 (Babe)')}
  ${entry(404, 200, 'ISSUED BY', 'Amine (bro, buddy, boyfriend)')}
  ${entry(404, 240, 'HER STAY', 'Thu 26 → Sun 29 Nov')}
  ${entry(404, 280, 'CLINGINESS', s.clingy + '% · ' + clingWord(s.clingy))}
  ${entry(404, 320, 'PAID BY', 'Amine (non-negotiable)')}

  <line x1="44" y1="346" x2="672" y2="346" stroke="#3A1A26" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round" opacity=".55"/>
  ${entry(44, 370, 'VALID', 'Hangzhou, from the moment you land')}
  ${entry(404, 370, 'EXPIRES', 'never · 永久有效')}
  <text x="44" y="420" font-family="${F_BODY}" font-weight="700" font-size="12.5" fill="#3A1A26" opacity=".78">Non-transferable, especially to other boyfriends. Can be combined with hugs and 奶茶.</text>
  <text x="44" y="438" font-family="${F_BODY}" font-weight="700" font-size="12.5" fill="#3A1A26" opacity=".78">Holder may change the plan, not the boyfriend. If Amine is late, Amine buys dessert.</text>

  <rect x="718" y="96" width="200" height="200" rx="18" fill="#FFFBFD" stroke="#3A1A26" stroke-width="4"/>
  ${qr}
  <path d="M912 116s-14-8.4-14-18a7.8 7.8 0 0 1 14-4.6 7.8 7.8 0 0 1 14 4.6c0 9.6-14 18-14 18z" fill="#FF6FAE" stroke="#3A1A26" stroke-width="3" stroke-linejoin="round" transform="translate(7 -8) rotate(12 912 102)"/>
  <text x="818" y="324" text-anchor="middle" font-family="${F_BODY}" font-weight="700" font-size="16" fill="#3A1A26">scan me (go on)</text>
  <text x="818" y="343" text-anchor="middle" font-family="${F_BODY}" font-weight="700" font-size="12.5" fill="#3A1A26" opacity=".8">password protected</text>
  <text x="818" y="372" text-anchor="middle" font-family="${F_DOT}" font-size="14.5" fill="#3A1A26">No. ${esc(s.serial)}</text>
  <text x="818" y="414" text-anchor="middle" font-family="${F_CN}" font-size="21" fill="#3A1A26">小马恋爱机</text>
  <text x="818" y="434" text-anchor="middle" font-family="${F_DOT}" font-size="11" letter-spacing="1.4" fill="#3A1A26">PONY LOVE MACHINE</text>
  <text transform="translate(941 232) rotate(90)" text-anchor="middle" font-family="${F_DISPLAY}" font-weight="700" font-size="18" letter-spacing="5" fill="#3A1A26">ADMIT ONE</text>

  <g class="tk-peek" style="opacity:0">${peek}</g>

  <g class="tk-stamp" style="opacity:0">
    <g filter="url(#${u('ink')})" transform="rotate(-12 626 100)" opacity=".9">
      <circle cx="626" cy="100" r="56" fill="none" stroke="#E0335F" stroke-width="5"/>
      <circle cx="626" cy="100" r="39" fill="none" stroke="#E0335F" stroke-width="2.5"/>
      <text font-family="${F_DISPLAY}" font-weight="700" font-size="11.5" letter-spacing="1.1" fill="#E0335F"><textPath href="#${u('circ')}">APPROVED BY 汤圆 · 已批准 · APPROVED BY 汤圆 · 已批准 ·</textPath></text>
      <path d="M626 118s-15-9-15-19.4a8.4 8.4 0 0 1 15-5 8.4 8.4 0 0 1 15 5c0 10.4-15 19.4-15 19.4z" fill="#E0335F"/>
    </g>
  </g>
</svg>`;
  }

  /* ---------------- print + reveal ---------------- */
  const FINAL = { x: 240, y: 34 };
  let guardOn = false;
  window.addEventListener('beforeunload', (e) => {
    if (!guardOn) return;
    e.preventDefault();
    e.returnValue = '';
  });

  async function print(s) {
    const layer = U.$('#voucherLayer');
    const M = PLM.machine;
    layer.classList.add('is-on');
    layer.innerHTML = '';
    const markup = build(s);
    const fly = U.el('div', { class: 'ticket-fly' });
    fly.innerHTML = markup;
    const svg = fly.querySelector('svg');
    const stamp = svg.querySelector('.tk-stamp');
    const peek = svg.querySelector('.tk-peek');
    const sk = U.skipper();
    const reduced = U.reduced();
    PLM.host.say('Printing… don’t read the fine print.', { expr: 'smug', ms: 2600 });

    const finalTransform = `translate(${FINAL.x}px, ${FINAL.y}px) rotate(0deg) scale(1)`;
    let skipped = false;

    if (!reduced) {
      // 1. rises out of the ticket slot in mechanical steps
      const slot = PLM.stage.rectOf(M.ticketslot.querySelector('.slit'));
      const k = (slot.w - 10) / 460;
      const maskH = 420;
      const mask = U.el('div', { class: 'print-mask' });
      Object.assign(mask.style, { left: slot.x - 12 + 'px', top: slot.cy - maskH + 'px', width: slot.w + 24 + 'px', height: maskH + 'px' });
      layer.append(mask);
      mask.append(fly);
      const tx = (slot.w + 24) / 2 - 300 * k;
      const ty0 = maskH + 960 * k;
      const ty1 = maskH + 96 * k;
      const at = (ty, rot) => `translate(${tx}px, ${ty}px) rotate(${-90 + (rot || 0)}deg) scale(${k})`;
      fly.style.transform = at(ty0);
      M.bulbs.set('chase');
      const steps = 12;
      for (let i = 1; i <= steps && !sk.skipped; i++) {
        const from = U.lerp(ty0, ty1, (i - 1) / steps);
        const to = U.lerp(ty0, ty1, i / steps);
        PLM.sfx('chirp');
        U.animate(fly, [{ transform: at(from) }, { transform: at(to) }], { duration: 70, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'forwards' });
        fly.style.transform = at(to);
        await sk.wait(118);
      }
      // 2. tear off with a little wiggle
      if (!sk.skipped) {
        PLM.sfx('pop');
        U.animate(fly, [{ transform: at(ty1) }, { transform: at(ty1, 2) }, { transform: at(ty1, -2) }, { transform: at(ty1, 1) }, { transform: at(ty1) }], { duration: 300, easing: 'ease-in-out' });
        await sk.wait(320);
      }
      // 3. fly to the centre while the cabinet steps back
      const m = PLM.stage.rectOf(mask);
      const startStage = `translate(${m.x + tx}px, ${m.y + ty1}px) rotate(-90deg) scale(${k})`;
      layer.append(fly);
      mask.remove();
      fly.style.transform = startStage;
      M.dim(true);
      if (!sk.skipped) {
        PLM.sfx('whoosh');
        const a = U.animate(fly, [
          { transform: startStage },
          { transform: `translate(${FINAL.x}px, ${FINAL.y}px) rotate(-3deg) scale(1)` },
        ], { duration: 640, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' });
        await Promise.race([a.finished, sk.wait(660)]);
        fly.style.transform = `translate(${FINAL.x}px, ${FINAL.y}px) rotate(-3deg) scale(1)`;
        if (!sk.skipped) {
          U.animate(fly, [{ transform: `translate(${FINAL.x}px, ${FINAL.y}px) rotate(-3deg) scale(1)` }, { transform: finalTransform }], { duration: 420, easing: 'cubic-bezier(.34,1.4,.64,1)', fill: 'forwards' });
          await sk.wait(260);
        }
      }
      fly.getAnimations().forEach((an) => an.cancel());
      fly.style.transform = finalTransform;
      M.bulbs.set('steady');

      // 4. the stamp thunks down
      if (!sk.skipped) {
        stamp.style.transformBox = 'fill-box';
        stamp.style.transformOrigin = '50% 50%';
        const st = U.animate(stamp, [{ opacity: 0, transform: 'scale(1.22)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 170, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'forwards' });
        await st.finished;
        stamp.style.opacity = '1';
        PLM.sfx('thunk');
        U.animate(fly, [
          { transform: finalTransform }, { transform: `translate(${FINAL.x + 2}px, ${FINAL.y + 1}px)` },
          { transform: `translate(${FINAL.x - 2}px, ${FINAL.y}px)` }, { transform: finalTransform },
        ], { duration: 160, easing: 'linear' });
        U.burst(FINAL.x + 626, FINAL.y + 70 + 100, { count: 18, spread: 260 });
        await sk.wait(260);
      }
      // 5. the host pony pops up from behind the stub
      if (!sk.skipped) {
        PLM.sfx('pop');
        peek.style.transformBox = 'fill-box';
        peek.style.transformOrigin = '50% 100%';
        U.animate(peek, [{ opacity: 0, transform: 'translateY(40px) scale(.94)' }, { opacity: 1, transform: 'none' }], { duration: 480, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'forwards' });
        await sk.wait(300);
      }
      skipped = sk.skipped;
    } else {
      layer.append(fly);
      fly.style.transform = finalTransform;
      M.dim(true);
      U.animate(fly, [{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: 'ease' });
      PLM.sfx('thunk');
    }
    sk.dispose();

    // settle the final state as real attributes (so the PNG export sees it)
    fly.getAnimations().forEach((an) => an.cancel());
    fly.style.transform = finalTransform;
    [stamp, peek].forEach((g) => { g.getAnimations().forEach((an) => an.cancel()); g.style.opacity = '1'; g.style.transform = ''; });
    svg.style.filter = 'drop-shadow(0 18px 26px rgba(58,26,38,.24)) drop-shadow(0 2px 3px rgba(58,26,38,.18))';
    if (skipped) {
      M.dim(true);
      M.bulbs.set('steady');
    }

    // 6. one foil sweep across the paper
    if (!reduced) {
      const foil = U.el('div', { class: 'foil', 'aria-hidden': 'true' });
      Object.assign(foil.style, { left: FINAL.x + 'px', top: FINAL.y + 70 + 'px' });
      layer.append(foil);
      requestAnimationFrame(() => foil.classList.add('sweep'));
      setTimeout(() => foil.remove(), 1100);
    }
    PLM.sfx('twinkle');
    showUi(s, svg);
    guardOn = true;
  }

  function shortcutHtml() {
    return U.isMac()
      ? '<kbd>⌘</kbd>+<kbd>Shift</kbd>+<kbd>4</kbd>'
      : '<kbd>Win</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd>';
  }

  function showUi(s, svg) {
    const layer = U.$('#voucherLayer');
    const icon = (n) => (art().icon ? art().icon(n) : '');
    const ui = U.el('div', { class: 'voucher-ui' });
    ui.innerHTML = `
      <div class="shot-banner blink" data-enter="lead">
        <span class="cam">${icon('camera')}</span>
        <div class="shot-text"><span class="lead">Screenshot this now, Babe.</span><span>This machine forgets everything when you close it. <b>I won’t.</b></span></div>
        <span class="keys" aria-label="Screenshot shortcut">${shortcutHtml()}</span>
      </div>
      <div class="v-actions" data-enter="support">
        <button class="v-btn save" type="button">${icon('download')}Save as image</button>
        <button class="v-btn primary done" type="button">I screenshotted it${icon('check')}</button>
      </div>`;
    layer.append(ui);
    U.enter(ui);
    const save = ui.querySelector('.save');
    const done = ui.querySelector('.done');
    setTimeout(() => done.focus({ preventScroll: true }), 400);

    save.addEventListener('click', () => saveImage(s, svg, save));
    done.addEventListener('click', () => {
      guardOn = false;
      PLM.sfx('fanfare');
      PLM.machine.bulbs.flash(1600);
      const fin = U.el('div', { class: 'v-final' });
      fin.innerHTML = `
        <div class="small" data-enter="support">Good. Send it to me so it’s official.</div>
        <div class="big" data-enter="lead">See you Thursday, Babe. <span class="cn">想你.</span></div>
        <button class="v-btn tiny-save" type="button" data-enter="deco">${icon('download')}Save as image</button>`;
      ui.replaceChildren(fin);
      U.enter(fin);
      fin.querySelector('.tiny-save').addEventListener('click', (e) => saveImage(s, svg, e.currentTarget));
      U.drift({ count: 26 });
      PLM.host.setBase('love');
      PLM.host.say('Best. Purchase. Ever.', { expr: 'love', ms: 3200 });
      if (PLM.audio && PLM.audio.duck) PLM.audio.duck(4, 1.4);
    });
  }

  async function saveImage(s, svg, btn) {
    if (!PLM.exporter) return;
    btn.setAttribute('aria-busy', 'true');
    try {
      const blob = await PLM.exporter.svgToPngBlob(svg, { scale: 2, background: '#9ADCFF', padding: 40 });
      const name = `pony-love-machine-voucher-${s.serial}.png`;
      const inApp = /MicroMessenger|WeChat|QQ\//i.test(navigator.userAgent);
      if (inApp) PLM.exporter.showImageFallback(blob, { title: 'Your voucher', hint: 'Long-press or right-click the picture to save it.' });
      else PLM.exporter.download(blob, name);
      guardOn = false;
      PLM.sfx('twinkle');
      PLM.host.say('Saved. Screenshot it anyway, I’m insecure.', { expr: 'smug', ms: 3000 });
    } catch (e) {
      PLM.host.say('The printer jammed. Screenshot it instead, Babe.', { expr: 'shocked' });
    } finally {
      btn.removeAttribute('aria-busy');
    }
  }

  PLM.voucher = { build, print, qrText };
})(window.PLM = window.PLM || {});

</script>
<script>
/* scenes.js - the story, scene by scene, plus the rainbow "mane wipe" between them.
   attract -> boot -> ask -> duel (+confession) -> prizes -> fine -> voucher (print) */
(function (PLM) {
  'use strict';

  const U = PLM.util;
  const art = () => PLM.art || {};
  const M = () => PLM.machine;
  const host = () => PLM.host;
  const sticker = (n, o) => (art().sticker ? art().sticker(n, o) : '');
  const icon = (n, o) => (art().icon ? art().icon(n, o) : '');
  const S = () => PLM.state;
  const D = () => PLM.data;
  const setExpr = (svg, e) => { if (!svg) return; if (art().setExpr) art().setExpr(svg, e); else svg.setAttribute('data-expr', e); };

  /* ---------------- scene runner ---------------- */
  let current = null;

  function makeCtx() {
    const cleanups = [];
    return {
      token: PLM.flow.token(),
      cleanups,
      onCleanup(fn) { cleanups.push(fn); },
      listen(target, type, fn, opts) {
        target.addEventListener(type, fn, opts);
        cleanups.push(() => target.removeEventListener(type, fn, opts));
      },
      timeout(fn, ms) {
        const t = setTimeout(fn, ms);
        cleanups.push(() => clearTimeout(t));
        return t;
      },
    };
  }

  async function wipe(swap) {
    const bands = U.$$('#wipe i');
    PLM.sfx('whoosh');
    if (U.reduced()) {
      const el = swap();
      U.animate(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease' });
      return;
    }
    const gaps = [0, 26, 46, 60, 70];
    const ease = 'cubic-bezier(.77,0,.175,1)';
    await Promise.all(bands.map((b, i) => U.animate(b, [{ transform: 'translateX(-101%)' }, { transform: 'translateX(0)' }], { duration: 250, delay: gaps[i], easing: ease, fill: 'forwards' }).finished));
    swap();
    host().hop();
    await U.sleep(50);
    await Promise.all(bands.map((b, i) => U.animate(b, [{ transform: 'translateX(0)' }, { transform: 'translateX(101%)' }], { duration: 250, delay: gaps[i], easing: ease, fill: 'forwards' }).finished));
    bands.forEach((b) => b.getAnimations().forEach((a) => a.cancel()));
  }

  const SCENES = {};

  async function go(name, opts) {
    const def = SCENES[name];
    if (!def) return;
    const ctx = makeCtx();
    const el = def.build(opts);
    const swap = () => {
      if (current) current.cleanups.forEach((fn) => { try { fn(); } catch (e) { /* ignore */ } });
      U.$('#sceneHost').replaceChildren(el);
      current = { name, el, cleanups: ctx.cleanups };
      if (def.deck) M().setDeck(def.deck);
      U.enter(el);
      // the control that started the wipe is gone: land keyboard + screen-reader focus on the new heading
      const a = document.activeElement;
      if (!a || a === document.body) {
        const h = el.querySelector('h2');
        if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
      }
      return el;
    };
    if (!current) swap();
    else await wipe(swap);
    PLM.scene = name;
    if (def.run) def.run(el, ctx, opts);
  }
  PLM.go = go;

  function captionSetter(node) {
    return (html) => {
      node.innerHTML = html;
      node.classList.remove('swap');
      void node.offsetWidth;
      node.classList.add('swap');
      U.announce(node.textContent);
    };
  }

  /* ================================================================== */

  SCENES.attract = {
    deck: 'coin',

      return U.frag(`<section class="scene s-attract" aria-labelledby="att-h">
        <div class="top-left" data-enter="deco">PLAYER 1 · <span class="cn">徐梦</span></div>
        <h2 class="h1" id="att-h" data-enter="lead"><span class="cn">徐梦</span>, I built a whole arcade machine to ask you one question.</h2>

      </section>`);
    },
    run(el, ctx) {
      PLM.alive.add(el.querySelector('.stage-pony .pony'));
      M().bulbs.set('attract');
      M().coinslot.classList.add('glow');
      const stage = U.$('#stage');
      const coin = U.el('button', { class: 'coin is-idle', type: 'button', 'aria-label': 'Insert the heart coin to start', html: sticker('heartCoin', { size: 118 }) });
      const hint = U.el('div', {
        class: 'coin-hint', 'aria-hidden': 'true',
        html: `<span class="arrow">${sticker('arrow', { size: 74, diecut: false })}</span><div class="note">Insert heart, Babe<small>${icon('speaker')} sound on, it’s cute</small></div>`,
      });
      stage.append(coin, hint);
      U.animate(coin, [{ opacity: 0, transform: 'translateY(-24px) scale(.92)' }, { opacity: 1, transform: 'none' }], { duration: 560, delay: 320, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'backwards' });
      U.animate(hint, [{ opacity: 0 }, { opacity: 1 }], { duration: 420, delay: 560, easing: 'ease', fill: 'backwards' });
      ctx.timeout(() => host().say('Psst. The coin. Put it in the slot.', { expr: 'smug' }), 2600);
      ctx.timeout(() => host().say('You can drag it too. I’m not your boss.', { expr: 'happy' }), 14000);

      const base = { cx: 502 + 59, cy: 728 + 59 };
      let inserted = false;
      let drag = null;

      function insert(ox, oy) {
        if (inserted) return;
        inserted = true;
        if (PLM.audio) { PLM.audio.init(); PLM.audio.playMusic(); }
        if (M().syncPlayer) M().syncPlayer();
        coin.classList.remove('is-idle');
        coin.disabled = true;
        hint.classList.add('is-off');
        const slot = PLM.stage.rectOf(M().coinslot.querySelector('.slit'));
        const dx = slot.cx - base.cx;
        const dy = slot.cy - base.cy;
        PLM.sfx('coin');
        const a = U.reduced()
          ? U.animate(coin, [{ opacity: 1 }, { opacity: 0 }], { duration: 240, fill: 'forwards' })
          : U.animate(coin, [
            { transform: `translate(${ox}px, ${oy}px) rotate(0deg) scale(1)` },
            { transform: `translate(${(ox + dx) / 2}px, ${Math.min(oy, dy) - 90}px) rotate(-24deg) scale(.78)`, offset: 0.45, easing: 'cubic-bezier(.55,0,1,.45)' },
            { transform: `translate(${dx}px, ${dy}px) rotate(0deg) scale(.42)`, offset: 0.82 },
            { transform: `translate(${dx}px, ${dy + 18}px) rotate(0deg) scale(.06, .42)`, opacity: 0 },
          ], { duration: 760, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'forwards' });
        a.finished.then(async () => {
          coin.remove();
          hint.remove();
          M().coinslot.classList.remove('glow');
          M().setCredits(1);
          M().bulbs.flash(900);
          host().say('Ooh. A paying customer.', { expr: 'happy', ms: 2000 });
          await U.sleep(620);
          if (ctx.token.alive) go('boot');
        });
      }

      coin.addEventListener('pointerdown', (e) => {
        if (inserted || e.button > 0) return;
        e.preventDefault();
        try { coin.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
        drag = { sx: e.clientX, sy: e.clientY, moved: false, ox: 0, oy: 0 };
        coin.classList.remove('is-idle');
      });
      coin.addEventListener('pointermove', (e) => {
        if (!drag) return;
        const s = PLM.stage.scale;
        const dx = (e.clientX - drag.sx) / s;
        const dy = (e.clientY - drag.sy) / s;
        if (!drag.moved && Math.hypot(dx, dy) > 6) drag.moved = true;
        if (drag.moved) {
          drag.ox = dx;
          drag.oy = dy;
          coin.style.transform = `translate(${dx}px, ${dy}px) rotate(${U.clamp(dx * 0.06, -16, 16)}deg)`;
        }
      });
      const release = () => {
        if (!drag) return;
        const d = drag;
        drag = null;
        if (!d.moved) { insert(0, 0); return; }
        const slot = PLM.stage.rectOf(M().coinslot);
        if (Math.hypot(base.cx + d.ox - slot.cx, base.cy + d.oy - slot.cy) < 170) insert(d.ox, d.oy);
        else {
          U.animate(coin, [{ transform: coin.style.transform }, { transform: 'translate(0px, 0px) rotate(0deg)' }], { duration: 420, easing: 'cubic-bezier(.34,1.56,.64,1)' });
          coin.style.transform = '';
          coin.classList.add('is-idle');
          host().say('In the slot, Babe. The little dark one on the left.', { expr: 'smug' });
        }
      };
      coin.addEventListener('pointerup', release);
      coin.addEventListener('pointercancel', () => { drag = null; coin.style.transform = ''; });
      coin.addEventListener('click', (e) => { if (e.detail === 0) insert(0, 0); });
      ctx.onCleanup(() => { coin.remove(); hint.remove(); M().bulbs.set('steady'); });
    },
  };

  SCENES.boot = {
    deck: 'none',
    build() {
      return U.frag(`<section class="scene s-boot" aria-labelledby="boot-h">
        <h2 class="h2" id="boot-h" data-enter="lead">Calculating how much I miss you…</h2>
        <div class="boot-bar" data-enter="support" role="progressbar" aria-label="How much I miss you" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="fill"></div>
          <svg class="crack" viewBox="0 0 70 74" aria-hidden="true"><path d="M34 2l-7 20 15 8-13 16 11 7-9 19" fill="none" stroke="#3A1A26" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="boot-pct" data-enter="support" aria-hidden="true">0%</div>
        <p class="boot-note" data-enter="deco"></p>
        <div class="boot-err" aria-hidden="true">ERROR: NUMBER TOO BIG</div>
        <div class="skip-hint" aria-hidden="true">CLICK TO SKIP</div>
      </section>`);
    },
    async run(el, ctx) {
      const sk = U.skipper();
      ctx.onCleanup(() => sk.dispose());
      const fill = el.querySelector('.fill');
      const pct = el.querySelector('.boot-pct');
      const note = el.querySelector('.boot-note');
      const err = el.querySelector('.boot-err');
      const crack = el.querySelector('.crack');
      const bar = el.querySelector('.boot-bar');
      const TRACK = 538;
      const fmt = (v) => Math.round(v).toLocaleString('en-US') + '%';
      const setW = (w, animate) => {
        if (animate && !U.reduced()) {
          U.animate(fill, [{ width: fill.style.width || '0px' }, { width: w + 'px' }], { duration: 240, easing: 'cubic-bezier(.23,1,.32,1)' });
        }
        fill.style.width = w + 'px';
      };
      const leave = () => { if (ctx.token.alive) go('ask'); };

      // 0 -> 99%
      await new Promise((resolve) => {
        const t0 = performance.now();
        const dur = U.reduced() ? 600 : 1500;
        let lastChirp = 0;
        const f = (t) => {
          if (!ctx.token.alive || sk.skipped) return resolve();
          const k = Math.min(1, (t - t0) / dur);
          const v = 99 * (1 - Math.pow(1 - k, 3));
          setW((TRACK * v) / 100);
          pct.textContent = fmt(v);
          bar.setAttribute('aria-valuenow', String(Math.round(v)));
          if (v - lastChirp > 14) { lastChirp = v; PLM.sfx('chirp'); }
          if (k < 1) requestAnimationFrame(f); else resolve();
        };
        requestAnimationFrame(f);
      });
      if (sk.skipped) return leave();
      note.textContent = 'almost…';
      if (await sk.wait(950)) return leave();
      pct.textContent = '100%';
      setW(TRACK, true);
      if (await sk.wait(240)) return leave();
      pct.textContent = '340%';
      PLM.sfx('boing', 4);
      setW(TRACK * 1.22, true);
      note.textContent = 'hold on.';
      if (await sk.wait(520)) return leave();
      pct.textContent = '9,999%';
      PLM.sfx('boing', 9);
      setW(TRACK * 2.2, true);
      if (await sk.wait(260)) return leave();
      // crack
      PLM.sfx('bonk');
      crack.style.opacity = '1';
      U.animate(bar, [
        { transform: 'translateX(0)' }, { transform: 'translateX(-7px)' }, { transform: 'translateX(6px)' },
        { transform: 'translateX(-4px)' }, { transform: 'translateX(2px)' }, { transform: 'translateX(0)' },
      ], { duration: 360, easing: 'ease-out' });
      U.animate(err, [{ opacity: 0, transform: 'scale(.94)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'forwards' });
      note.textContent = 'Skipping to the question.';
      U.announce('Error: number too big. Skipping to the question.');
      host().say('It broke. Classic.', { expr: 'shocked', ms: 1800 });
      await sk.wait(1500);
      leave();
    },
  };

  function openSystemDialog() {
    return new Promise((resolve) => {
      const layer = U.$('#dialogLayer');
      const face = art().ponyPeek ? art().ponyPeek({ size: 64, expr: 'shocked', diecut: false }) : '';
      layer.innerHTML = `<div class="scrim"></div>

          <div class="bar"><h2 id="dlg-t"><span lang="zh">系统提示</span><span>SYSTEM MESSAGE</span></h2><button class="x" type="button" aria-label="Close">${icon('close')}</button></div>

        </div>`;
      const dlg = layer.querySelector('.sysdlg');
      requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('is-on')));
      const focusables = () => U.$$('button', dlg);
      const done = (res) => {
        document.removeEventListener('keydown', onKey, true);
        layer.classList.remove('is-on');
        setTimeout(() => { layer.innerHTML = ''; }, 260);
        resolve(res);
      };
      const onKey = (e) => {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done('close'); return; }
        if (e.key === 'Tab') {
          const f = focusables();
          const i = f.indexOf(document.activeElement);
          e.preventDefault();
          f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
        }
      };
      document.addEventListener('keydown', onKey, true);
      layer.querySelector('.x').addEventListener('click', () => done('close'));
      layer.querySelector('.b1').addEventListener('click', () => done('yes'));
      layer.querySelector('.b2').addEventListener('click', () => done('yes'));
      layer.querySelector('.scrim').addEventListener('click', () => {
        U.animate(dlg, [{ translate: '0 0' }, { translate: '-8px 0' }, { translate: '7px 0' }, { translate: '-4px 0' }, { translate: '0 0' }], { duration: 320, easing: 'ease-out' });

      });
      setTimeout(() => layer.querySelector('.b2').focus({ preventScroll: true }), 80);
    });
  }

  SCENES.ask = {

    build() {

      return U.frag(`<section class="scene s-ask" aria-labelledby="ask-h">

      PLM.alive.add(capt);

      const scoreBox = el.querySelector('.score');
      const scoreA = el.querySelector('.sa');

      const say = (html, ms) => {
